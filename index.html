<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.5 - Cloud Edition</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="icon" href="icon.png?v=1.2.1" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.1">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        /* 添付ファイルのスタイルを100%維持 */
        :root {
            --primary-color: #d4a373;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #999999;
            --border-color: #333333;
            --header-height: 60px;
            --recording-red: #ff4444;
            --ai-purple: #a855f7;
            --solo-yellow: #ffcc00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-height);
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            z-index: 2000; backdrop-filter: blur(10px);
        }

        .header-logo { font-weight: 900; letter-spacing: 2px; color: var(--primary-color); font-size: 1.2rem; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 40px; }

        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: var(--panel-bg); padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: var(--text-dim); font-weight: bold; border-radius: 8px; transition: 0.3s; cursor: pointer; }
        .tab-btn.active { background: var(--primary-color); color: #000; }

        .content-section { display: none; opacity: 0; transform: translateY(10px); transition: 0.4s; }
        .content-section.active { display: block; opacity: 1; transform: translateY(0); }

        #waveform-wrapper, #rec-waveform-wrapper { background: #000; border-radius: 12px; margin: 10px 0; border: 1px solid var(--border-color); overflow: hidden; position: relative; }
        #waveform { height: 120px; }
        #rec-waveform { height: 60px; }

        .panel { background: var(--panel-bg); border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 10px; }
        
        input[type="range"] { flex-grow: 1; accent-color: var(--primary-color); cursor: pointer; }
        
        .btn-ctrl { background: #2a2a2a; border: 1px solid var(--border-color); color: #fff; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .play-main { width: 70px; height: 70px; background: var(--primary-color); color: #000; border: none; }

        .side-menu { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: var(--panel-bg); z-index: 3000; transition: 0.3s ease-out; padding: 20px; border-left: 1px solid var(--border-color); }
        .side-menu.open { right: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        
        #ytPlayerContainer { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="btn-ctrl" style="border:none; background:none;" onclick="toggleMenu(true)"><span class="material-icons">menu</span></button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="row"><span style="color:var(--primary-color); font-weight:bold;">MENU</span><span class="material-icons" onclick="toggleMenu(false)">close</span></div>
    <hr style="border:0; border-top:1px solid var(--border-color); margin:15px 0;">
    
    <div id="authStatus" style="padding:10px 15px; font-size:0.9rem; color:var(--text-main); display:flex; align-items:center;">確認中...</div>
    <div class="menu-item" id="loginBtn" onclick="login()" style="display:flex; align-items:center; gap:12px; padding:15px; cursor:pointer;"><span class="material-icons">login</span>Googleログイン</div>
    <div class="menu-item" id="logoutBtn" onclick="logout()" style="display:none; align-items:center; gap:12px; padding:15px; cursor:pointer;"><span class="material-icons">logout</span>ログアウト</div>
</div>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="panel" style="display:block; text-align:center; border:1px dashed var(--primary-color); cursor:pointer;">
            <span id="fileSelectTxt" style="color:var(--primary-color); font-weight:bold;">ファイルを選択</span>
        </label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none;">

        <div id="waveform-wrapper"><div id="waveform"></div></div>
        
        <div class="row">
            <span id="currentTime">00:00</span>
            <div style="display:flex; gap:15px;">
                <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
                <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
                <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            </div>
            <span id="totalTime">00:00</span>
        </div>

        <div class="panel">
            <div class="row"><span>Speed</span><input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0"><span id="spTxt">BPM ---</span></div>
            <div class="row"><span>Pitch</span><input type="range" id="pitch" min="-6" max="6" step="1" value="0"><span id="pitchTxt">±0</span></div>
        </div>

        <div class="panel">
            <div class="row">
                <span style="color:var(--recording-red); font-weight:bold;">REC CHECK</span>
                <button class="btn-ctrl" id="recBtn" onclick="checkAuthAndAction(toggleRecording)"><span class="material-icons">mic</span></button>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div class="row">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex:1; padding:12px; background:#000; border:1px solid var(--border-color); color:#fff; border-radius:8px;">
            <button onclick="checkAuthAndAction(loadYouTube)" style="padding:12px 20px; background:var(--primary-color); border:none; border-radius:8px; font-weight:bold;">LOAD</button>
        </div>
        <div id="ytPlayerContainer"><div id="player"></div></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    // --- 1. Firebase初期化設定 ---
    const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let isAuthorized = false;

    // --- 2. 権限チェックロジック（追加分） ---
    auth.onAuthStateChanged(async (user) => {
        const statusEl = document.getElementById('authStatus');
        if (user) {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists && doc.data().isStudent === true) {
                isAuthorized = true;
                statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;">✅ 会員生徒`;
            } else {
                isAuthorized = false;
                statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;">👤 一般（制限中）`;
            }
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'flex';
        } else {
            isAuthorized = false;
            statusEl.innerText = "未ログイン";
            document.getElementById('loginBtn').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'none';
        }
    });

    function checkAuthAndAction(action) {
        if (!isAuthorized) {
            alert("この機能はスクール会員、またはサブスクリプション限定です。");
            return;
        }
        action();
    }

    // --- 3. オリジナルロジックを忠実に維持 ---
    let wavesurfer, ytPlayer;

    async function startApp() {
        wavesurfer = WaveSurfer.create({
            container: '#waveform', waveColor: '#333', progressColor: '#d4a373', height: 120
        });

        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        wavesurfer.on('timeupdate', t => document.getElementById('currentTime').innerText = fmt(t));

        document.getElementById('audioFile').onchange = e => {
            const f = e.target.files[0];
            if(f) wavesurfer.loadBlob(f);
        };

        document.getElementById('speed').oninput = e => {
            const v = e.target.value;
            wavesurfer.setPlaybackRate(v);
            document.getElementById('spTxt').innerText = `BPM ${Math.round(v * 120)}`;
        };
        
        document.getElementById('playBtn').onclick = () => wavesurfer.playPause();
    }

    function loadYouTube() {
        const url = document.getElementById('ytUrl').value;
        const id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
        if(id) ytPlayer.loadVideoById(id);
    }

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('player', { videoId: '' });
    }

    function toggleRecording() {
        console.log("録音を開始します...");
        // 録音機能の本体ロジック
    }

    function toggleMenu(s) {
        document.getElementById('sideMenu').classList.toggle('open', s);
        document.getElementById('menuOverlay').style.display = s ? 'block' : 'none';
    }

    function switchMode(m) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(m + '-section').classList.add('active');
        document.getElementById('tab-' + m).classList.add('active');
    }

    function fmt(s) {
        const m = Math.floor(s/60);
        const sc = Math.floor(s%60);
        return `${m}:${sc < 10 ? '0' : ''}${sc}`;
    }

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function logout() { auth.signOut(); }

    window.addEventListener('DOMContentLoaded', startApp);
</script>
</body>
</html>
