<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.2 - Studio Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <link rel="icon" href="icon.png?v=1.2.2" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.2">

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d4a373;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #999999;
            --border-color: #333333;
            --header-height: 60px;
            --recording-red: #ff4444;
            --ai-purple: #a855f7;
            --solo-yellow: #ffcc00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-height);
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            z-index: 2000; backdrop-filter: blur(10px);
        }

        .header-logo { font-weight: 900; letter-spacing: 2px; color: var(--primary-color); font-size: 1.2rem; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        /* モード切替タブ */
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: var(--panel-bg); padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: var(--text-dim); font-weight: bold; border-radius: 8px; transition: 0.3s; cursor: pointer; }
        .tab-btn.active { background: var(--primary-color); color: #000; }

        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 波形エリア */
        #waveform-wrapper, #rec-waveform-wrapper { background: #000; border-radius: 12px; margin: 10px 0; border: 1px solid var(--border-color); overflow: hidden; position: relative; }
        #waveform { height: 120px; }
        #rec-waveform { height: 60px; }

        /* コントロールパネル */
        .panel { background: var(--panel-bg); border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 10px; }
        .row:last-child { margin-bottom: 0; }

        /* ボタン・入力 */
        input[type="range"] { flex-grow: 1; accent-color: var(--primary-color); cursor: pointer; }
        .btn-ctrl { background: #2a2a2a; border: 1px solid var(--border-color); color: #fff; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-ctrl:active { transform: scale(0.9); background: #333; }
        .btn-ctrl.active { color: var(--primary-color); border-color: var(--primary-color); }
        .play-main { width: 70px; height: 70px; background: var(--primary-color); color: #000; border: none; }
        
        /* 録音・AI */
        .rec-btn.recording { background: var(--recording-red); animation: pulse 1.5s infinite; color: #fff; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .ai-result-card { background: #1a1a2e; border: 1px solid var(--ai-purple); border-radius: 12px; padding: 15px; margin-top: 10px; display: none; }
        
        /* サイドメニュー */
        .side-menu { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: var(--panel-bg); z-index: 3000; transition: 0.3s; padding: 20px; border-left: 1px solid var(--border-color); box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        .side-menu.open { right: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 8px; cursor: pointer; color: var(--text-main); }
        .menu-item:active { background: #333; }

        /* YouTube */
        #ytPlayerContainer { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        #player { width: 100%; height: 100%; }

        .custom-file-upload { display: block; width: 100%; padding: 15px; background: #2a2a2a; color: var(--primary-color); text-align: center; border-radius: 12px; border: 1px dashed var(--primary-color); cursor: pointer; font-weight: bold; }
        input[type="file"] { display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
            authDomain: "ams-player-e04bf.firebaseapp.com",
            projectId: "ams-player-e04bf",
            storageBucket: "ams-player-e04bf.firebasestorage.app",
            messagingSenderId: "102274983236",
            appId: "1:102274983236:web:f4334348391dde42dd6311"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('authStatus');
            if (user) {
                statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;vertical-align:middle;">${user.displayName}`;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'flex';
            } else {
                statusEl.innerText = "未ログイン";
                document.getElementById('loginBtn').style.display = 'flex';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        });
    </script>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="btn-ctrl" style="width:40px;height:40px;border:none;" onclick="toggleMenu(true)">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="row">
        <span style="font-weight:bold; color:var(--primary-color);">MENU</span>
        <span class="material-icons" onclick="toggleMenu(false)">close</span>
    </div>
    <hr style="border:0; border-top:1px solid var(--border-color); margin:15px 0;">
    <div id="authStatus" style="padding:0 15px 10px; font-size:0.9rem;"></div>
    <div class="menu-item" id="loginBtn" onclick="login()"><span class="material-icons">login</span>ログイン</div>
    <div class="menu-item" id="logoutBtn" onclick="logout()" style="display:none;"><span class="material-icons">logout</span>ログアウト</div>
</div>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="custom-file-upload">ファイルを選択</label>
        <input type="file" id="audioFile" accept="audio/*">
        
        <div id="waveform-wrapper"><div id="waveform"></div></div>
        
        <div class="row">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
        </div>

        <div style="display:flex; justify-content:center; gap:20px; margin:20px 0;">
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
        </div>

        <div class="panel">
            <div class="row">
                <span>Speed</span>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <span id="spTxt">1.00x</span>
            </div>
            <div class="row">
                <span>Pitch</span>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <span id="pitchTxt">±0</span>
            </div>
        </div>

        <div class="panel">
            <div class="row">
                <span style="color:var(--recording-red); font-weight:bold; font-size:0.8rem;">REC CHECK</span>
                <button class="btn-ctrl rec-btn" id="recBtn"><span class="material-icons">mic</span></button>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div class="row">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex:1; padding:12px; background:#000; border:1px solid var(--border-color); color:#fff; border-radius:8px;">
            <button onclick="loadYouTube()" style="padding:12px 20px; background:var(--primary-color); border:none; border-radius:8px; font-weight:bold;">LOAD</button>
        </div>
        <div id="ytPlayerContainer"><div id="player"></div></div>
        <div class="panel" style="margin-top:15px;">
            <div class="row">
                <button class="tab-btn" style="background:#333;" onclick="setLoopPoint('start')">SET START</button>
                <button class="tab-btn" style="background:#333;" onclick="setLoopPoint('end')">SET END</button>
            </div>
            <button id="toggleLoopBtn" class="tab-btn active" style="width:100%; margin-top:10px;" onclick="toggleLoop()">LOOP ON</button>
        </div>
    </div>
</div>

<script>
    let wavesurfer, wsRegions;
    let recWavesurfer;
    let ytPlayer;
    let loopStart = 0, loopEnd = 0, isLoopActive = true;

    function initWaveSurfer() {
        wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#333',
            progressColor: '#d4a373',
            cursorColor: '#fff',
            height: 120,
            responsive: true,
            backend: 'WebAudio'
        });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        
        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        
        wavesurfer.on('timeupdate', (t) => {
            document.getElementById('currentTime').innerText = fmt(t);
        });

        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if(file) wavesurfer.loadBlob(file);
        };
    }

    function toggleMenu(show) {
        document.getElementById('sideMenu').classList.toggle('open', show);
        document.getElementById('menuOverlay').style.display = show ? 'block' : 'none';
    }

    function switchMode(mode) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode + '-section').classList.add('active');
        document.getElementById('tab-' + mode).classList.add('active');
    }

    function fmt(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // YouTube用
    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('player', {
            events: { 'onStateChange': onPlayerStateChange }
        });
    }

    function loadYouTube() {
        const url = document.getElementById('ytUrl').value;
        const id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
        if(id) ytPlayer.loadVideoById(id);
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING && isLoopActive) {
            setInterval(() => {
                const cur = ytPlayer.getCurrentTime();
                if (loopEnd > 0 && cur >= loopEnd) ytPlayer.seekTo(loopStart);
            }, 500);
        }
    }

    function setLoopPoint(type) {
        const cur = ytPlayer.getCurrentTime();
        if(type === 'start') loopStart = cur;
        else loopEnd = cur;
        alert(`${type}に設定しました: ${fmt(cur)}`);
    }

    function toggleLoop() {
        isLoopActive = !isLoopActive;
        document.getElementById('toggleLoopBtn').innerText = isLoopActive ? "LOOP ON" : "LOOP OFF";
    }

    window.onload = () => {
        initWaveSurfer();
        
        // 再生ボタン
        document.getElementById('playBtn').onclick = () => {
            wavesurfer.playPause();
        };

        // スピード/ピッチ
        document.getElementById('speed').oninput = e => {
            const v = e.target.value;
            wavesurfer.setPlaybackRate(v);
            document.getElementById('spTxt').innerText = parseFloat(v).toFixed(2) + 'x';
        };
    };
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
