<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.2 - Studio Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <link rel="icon" href="icon.png?v=1.2.2" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.2">

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=1.2.2">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
            authDomain: "ams-player-e04bf.firebaseapp.com",
            projectId: "ams-player-e04bf",
            storageBucket: "ams-player-e04bf.firebasestorage.app",
            messagingSenderId: "102274983236",
            appId: "1:102274983236:web:f4334348391dde42dd6311",
            measurementId: "G-GYHLQKN6SS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        async function syncUser(user) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);
            const statusEl = document.getElementById('authStatus');
            if (userSnap.exists() && userSnap.data().isPremium) {
                statusEl.innerHTML += ' <span class="premium-badge">PREMIUM</span>';
            } else if (!userSnap.exists()) {
                await setDoc(userRef, { displayName: user.displayName, email: user.email, isPremium: false, createdAt: new Date() });
            }
        }

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('authStatus');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            if (user) {
                statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;vertical-align:middle;">${user.displayName}`;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'flex';
                syncUser(user);
            } else {
                statusEl.innerText = "未ログイン";
                loginBtn.style.display = 'flex';
                logoutBtn.style.display = 'none';
            }
        });
    </script>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="menu-trigger" onclick="toggleMenu(true)">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <span style="font-weight:bold; color:var(--primary-color);">MENU</span>
        <button class="menu-trigger" onclick="toggleMenu(false)">
            <span class="material-icons">close</span>
        </button>
    </div>

    <span class="menu-section-title">Account</span>
    <div id="authStatus" style="padding:10px 15px; font-size:0.85rem; color:#fff;">確認中...</div>
    <div class="menu-item" id="loginBtn" onclick="login()"><span class="material-icons">login</span><span>Googleログイン</span></div>
    <div class="menu-item" id="logoutBtn" onclick="logout()" style="display:none;"><span class="material-icons">logout</span><span>ログアウト</span></div>
    <hr style="border:0; border-top:1px solid var(--border-color); margin:10px 0;">

    <span class="menu-section-title" id="langTitle">言語設定</span>
    <select id="langSelect" class="lang-select" onchange="changeLanguage()">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>
    
    <span class="menu-section-title" id="helpTitle">ヘルプ & ガイド</span>
    <div class="menu-item" onclick="showGuide('file')">
        <span class="material-icons">description</span>
        <span id="guideFileTitle">Audio Fileモード ガイド</span>
    </div>
    <div class="menu-item" onclick="showGuide('yt')">
        <span class="material-icons">smart_display</span>
        <span id="guideYTTitle">YouTubeモード ガイド</span>
    </div>
</div>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="custom-file-upload" id="fileSelectBtn">ファイルを選択</label>
        <input type="file" id="audioFile" accept="audio/*">
        
        <div id="waveform-wrapper">
            <div id="waveform"></div>
        </div>
        
        <div class="row" style="margin-top:5px; font-size:0.8rem; color:var(--text-dim);">
            <div id="loadStatus">READY</div>
            <div class="time-display">
                <span id="currentTime">00:00</span> / <span id="totalTime">00:00</span>
            </div>
        </div>

        <div class="clear-btn-container">
            <button class="tab-btn" id="fitBtn" style="flex:0; min-width:60px; font-size:0.75rem; padding:5px;" onclick="fitWaveform()">全体表示</button>
            <button class="tab-btn" id="clearBtn" style="flex:0; min-width:80px; font-size:0.75rem; padding:5px;" onclick="wsRegions.clearRegions()">範囲解除</button>
            <div style="flex-grow:1;"></div>
            <button class="clear-btn-ja" onclick="saveLoop('file')" id="saveLoopBtn" style="border: 1px solid var(--primary-color); border-radius: 6px; padding: 8px 12px; display: flex; align-items: center; gap: 5px;">
                <span class="material-icons" style="font-size:16px;">bookmark_add</span> ループ保存
            </button>
        </div>
        <div id="loopListFile" class="loop-list-container"></div>

        <div class="transport-controls">
            <button class="btn-ctrl active" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="btn-ctrl" id="speedUpToggleBtn" onclick="toggleFeature('speedup')"><span class="material-icons">speed</span></button>
        </div>

        <div class="panel panel-rec">
            <div class="row">
                <div style="font-size:0.7rem; color:var(--recording-red); font-weight:bold; letter-spacing:1px;">SELF-RECORDING CHECK</div>
                <button class="btn-ctrl rec-btn" id="recBtn" onclick="toggleRecording()" style="width:40px; height:40px; border:none;"><span class="material-icons">mic</span></button>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
            <div class="row" style="margin-top:10px;">
                <div style="display:flex; align-items:center; gap:10px; flex-grow:1;">
                    <button class="btn-ctrl" id="recPlayBtn" onclick="toggleRecPlayback()" style="width:35px; height:35px;"><span class="material-icons" id="recPlayIcon" style="font-size:20px;">play_arrow</span></button>
                    <input type="range" id="recVol" min="0" max="1" step="0.1" value="1" style="width:60px;">
                    <button id="soloBtn" onclick="toggleSolo()" style="background:none; border:1px solid #555; color:#555; border-radius:4px; font-size:10px; padding:2px 5px; font-weight:bold;">S</button>
                </div>
                <button id="aiBtn" onclick="runAI()" style="background:none; border:1px solid var(--ai-purple); color:var(--ai-purple); border-radius:20px; font-size:10px; padding:4px 12px; font-weight:bold; display:flex; align-items:center; gap:4px;">
                    <span class="material-icons" style="font-size:12px;">psychology</span> AI分析
                </button>
            </div>
            <div id="aiResult" class="ai-result-card">
                <div class="ai-title"><span class="material-icons" style="font-size:16px;">auto_awesome</span> AI PRACTICE ADVICE</div>
                <div id="aiText" style="font-size:0.85rem; line-height:1.6; color:#ccc;"></div>
            </div>
        </div>

        <div class="panel">
            <div class="row">
                <div style="min-width:65px;">Speed</div>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <span id="spTxt">BPM ---</span>
            </div>
            <div class="row">
                <div style="min-width:65px;">Pitch</div>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <span id="pitchTxt">±0</span>
            </div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div style="display:flex; gap:8px; margin-bottom:10px;">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex-grow:1; padding:12px; background:#000; border:1px solid var(--border-color); color:#fff; border-radius:8px; font-size:14px;">
            <button onclick="loadYouTube()" style="padding:0 15px; background:var(--primary-color); border:none; color:#000; border-radius:8px; font-weight:bold;">LOAD</button>
        </div>
        <div id="ytPlayerContainer">
            <div id="player"></div>
        </div>

        <div id="yt-history-container" style="margin-top:10px; display:none;">
            <div style="font-size:0.7rem; color:var(--text-dim); margin-bottom:5px;">RECENT VIDEOS</div>
            <div id="yt-history-list" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:5px;"></div>
        </div>

        <div class="panel" style="margin-top:15px;">
            <div class="row" style="justify-content: space-around; margin-bottom: 15px;">
                <button class="loop-btn-main" id="setStartBtn" onclick="setLoopPoint('start')">SET START</button>
                <div style="background:#000; padding:5px; border-radius:8px; border:1px solid var(--border-color); display:flex; align-items:center; gap:5px;">
                    <button class="adj-btn" onclick="adjustTime('start', -1)">-1s</button>
                    <span id="loopStartTxt" class="time-display">00:00</span>
                    <button class="adj-btn" onclick="adjustTime('start', 1)">+1s</button>
                </div>
            </div>
            <div class="row" style="justify-content: space-around; margin-bottom: 15px;">
                <button class="loop-btn-main" id="setEndBtn" onclick="setLoopPoint('end')">SET END</button>
                <div style="background:#000; padding:5px; border-radius:8px; border:1px solid var(--border-color); display:flex; align-items:center; gap:5px;">
                    <button class="adj-btn" onclick="adjustTime('end', -1)">-1s</button>
                    <span id="loopEndTxt" class="time-display">00:00</span>
                    <button class="adj-btn" onclick="adjustTime('end', 1)">+1s</button>
                </div>
            </div>
            <div class="row" style="justify-content: center; gap: 10px;">
                <button id="toggleLoopBtn" class="tab-btn" style="width:140px;" onclick="toggleLoop()">LOOP OFF</button>
                <button class="clear-btn-ja" onclick="saveLoop('yt')" id="saveLoopBtnYT" style="border: 1px solid var(--primary-color); border-radius: 6px; padding: 8px 12px;">
                    <span class="material-icons" style="font-size:16px;">bookmark_add</span> SAVE
                </button>
            </div>
        </div>
        <div id="loopListYT" class="loop-list-container"></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js?v=1.2.2"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=1.2.2');
    }
</script>
</body>
</html>
