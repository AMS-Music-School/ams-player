<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.5 - Cloud Edition</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="icon" href="icon.png?v=1.2.1" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.1">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d4a373;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #999999;
            --border-color: #333333;
            --header-height: 60px;
            --recording-red: #ff4444;
            --ai-purple: #a855f7;
            --solo-yellow: #ffcc00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-height);
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            z-index: 2000; backdrop-filter: blur(10px);
        }

        .header-logo { font-weight: 900; letter-spacing: 2px; color: var(--primary-color); font-size: 1.2rem; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 40px; }

        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: var(--panel-bg); padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: var(--text-dim); font-weight: bold; border-radius: 8px; transition: 0.3s; cursor: pointer; }
        .tab-btn.active { background: var(--primary-color); color: #000; }

        .content-section { display: none; opacity: 0; transform: translateY(10px); transition: 0.4s; }
        .content-section.active { display: block; opacity: 1; transform: translateY(0); }

        #waveform-wrapper, #rec-waveform-wrapper { background: #000; border-radius: 12px; margin: 10px 0; border: 1px solid var(--border-color); overflow: hidden; position: relative; }
        #waveform { height: 120px; }
        #rec-waveform { height: 60px; }

        .panel { background: var(--panel-bg); border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 10px; }
        .row:last-child { margin-bottom: 0; }

        input[type="range"] { flex-grow: 1; accent-color: var(--primary-color); cursor: pointer; height: 6px; border-radius: 3px; background: #333; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--primary-color); cursor: pointer; border: 3px solid #1e1e1e; }
        
        .btn-ctrl { background: #2a2a2a; border: 1px solid var(--border-color); color: #fff; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-ctrl:active { transform: scale(0.9); background: #333; }
        .btn-ctrl:disabled { opacity: 0.3; cursor: not-allowed; }
        .play-main { width: 70px; height: 70px; background: var(--primary-color); color: #000; border: none; box-shadow: 0 4px 15px rgba(212, 163, 115, 0.3); }

        .side-menu { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: var(--panel-bg); z-index: 3000; transition: 0.3s ease-out; padding: 20px; border-left: 1px solid var(--border-color); }
        .side-menu.open { right: 0; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 5px; color: var(--text-main); }
        .menu-item:active { background: #333; }
        .menu-item .material-icons { color: var(--primary-color); }
        
        #ytPlayerContainer { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        #player { width: 100%; height: 100%; pointer-events: none; }

        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .history-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #121212; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-color); font-size: 0.85rem; }
        .history-info { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #countdown-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 5000; display: none; align-items: center; justify-content: center; font-size: 120px; font-weight: 900; color: var(--primary-color); pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="btn-ctrl" style="border:none; background:none;" onclick="toggleMenu(true)"><span class="material-icons">menu</span></button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="row"><span style="color:var(--primary-color); font-weight:bold;">MENU</span><span class="material-icons" onclick="toggleMenu(false)">close</span></div>
    <hr style="border:0; border-top:1px solid var(--border-color); margin:15px 0;">
    
    <div id="authStatus" style="padding:10px 15px; font-size:0.85rem; color:var(--text-main); display:flex; align-items:center;"></div>
    <div class="menu-item" id="loginBtn" onclick="login()"><span class="material-icons">login</span><span id="menuLoginTxt">Googleログイン</span></div>
    <div class="menu-item" id="logoutBtn" onclick="logout()" style="display:none;"><span class="material-icons">logout</span><span id="menuLogoutTxt">ログアウト</span></div>
    
    <hr style="border:0; border-top:1px solid var(--border-color); margin:10px 0;">
    <span class="row" style="padding:0 15px; font-size:0.75rem; color:var(--text-dim);" id="langTitle">言語設定</span>
    <select id="langSelect" onchange="changeLanguage()" style="width:calc(100% - 30px); margin:10px 15px; padding:8px; background:#121212; color:#fff; border:1px solid var(--border-color); border-radius:5px;">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>
</div>

<div id="countdown-overlay"></div>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="panel" style="display:block; text-align:center; border:1px dashed var(--primary-color); cursor:pointer; margin-bottom:15px;">
            <span id="fileSelectTxt" style="color:var(--primary-color); font-weight:bold;">ファイルを選択 / Drop Audio</span>
        </label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none;">

        <div id="waveform-wrapper"><div id="waveform"></div></div>
        
        <div class="row" style="justify-content:center; gap:30px; margin:20px 0;">
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
        </div>

        <div class="panel">
            <div class="row"><span id="curTxt">再生位置</span><span id="currentTime" style="font-family:monospace; font-size:1.1rem; color:var(--primary-color);">00:00</span></div>
            <div class="row"><span>Speed</span><input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0"><span id="spTxt" style="width:65px; text-align:right;">BPM 120</span></div>
            <div class="row"><span>Pitch</span><input type="range" id="pitch" min="-6" max="6" step="1" value="0"><span id="pitchTxt" style="width:65px; text-align:right;">±0</span></div>
        </div>

        <div class="panel">
            <div class="row">
                <span id="loopTxt">ABループ設定</span>
                <div style="display:flex; gap:8px;">
                    <button class="tab-btn" style="background:#333; padding:8px 12px; font-size:0.75rem;" onclick="setLoopFromCurrent()">SET CURRENT</button>
                    <button class="tab-btn" style="background:#442222; padding:8px 12px; font-size:0.75rem; color:#ffaaaa;" onclick="wsRegions.clearRegions()">CLEAR</button>
                </div>
            </div>
            <div class="row" style="margin-top:15px;">
                <span id="countTxt">カウントダウン (3s)</span>
                <label class="switch"><input type="checkbox" id="countToggle"><span class="slider"></span></label>
            </div>
            <div class="row">
                <span id="autoSpeedTxt">自動スピードアップ (0.05)</span>
                <label class="switch"><input type="checkbox" id="autoSpeedToggle"><span class="slider"></span></label>
            </div>
        </div>

        <div class="panel" style="border-color:var(--recording-red);">
            <div class="row">
                <span style="color:var(--recording-red); font-weight:bold;">REC CHECK</span>
                <button class="btn-ctrl" id="recBtn" onclick="checkAuthAndAction(toggleRecording)" style="background:#331111; border-color:var(--recording-red);"><span class="material-icons" style="color:var(--recording-red);">mic</span></button>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
            <div id="recList" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div class="row">
            <input type="text" id="ytUrl" placeholder="YouTube URL (https://...)" style="flex:1; padding:12px; background:#000; border:1px solid var(--border-color); color:#fff; border-radius:8px;">
            <button onclick="checkAuthAndAction(loadYouTube)" style="padding:12px 20px; background:var(--primary-color); border:none; border-radius:8px; font-weight:bold; color:#000;">LOAD</button>
        </div>
        <div id="ytPlayerContainer" style="margin:15px 0;"><div id="player"></div></div>
        
        <div class="panel">
            <div class="row">
                <button class="tab-btn" style="background:#333;" onclick="setYTLoop('start')">SET START</button>
                <button class="tab-btn" style="background:#333;" onclick="setYTLoop('end')">SET END</button>
            </div>
            <button id="ytLoopBtn" class="tab-btn active" style="width:100%; margin-top:10px;" onclick="toggleYTLoop()">LOOP ON</button>
        </div>

        <div id="ytHistory" style="margin-top:15px;"></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    // --- Firebase 初期化 (添付ファイルを維持) ---
    const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    // 追加: Firestore
    const db = firebase.firestore();

    let isAuthorized = false; // 会員判定フラグ

    // --- 追加: 権限チェックロジック ---
    auth.onAuthStateChanged(async (user) => {
        const statusEl = document.getElementById('authStatus');
        if (user) {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists && doc.data().isStudent === true) {
                isAuthorized = true;
                statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;">✅ 会員生徒: ${user.displayName}`;
            } else {
                isAuthorized = false;
                statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;">👤 一般（機能制限あり）`;
            }
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'flex';
        } else {
            isAuthorized = false;
            statusEl.innerText = "";
            document.getElementById('loginBtn').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'none';
        }
    });

    // 権限がない場合にアラートを出す共通関数
    function checkAuthAndAction(actionFn) {
        if (!isAuthorized) {
            alert("この機能はスクール会員、またはサブスクリプション限定です。");
            return;
        }
        actionFn();
    }

    // --- 以下、添付ファイルの全ロジックを100%維持 ---

    let wavesurfer, wsRegions, recWavesurfer, ytPlayer;
    let mediaRecorder, audioChunks = [];
    let isRecording = false;
    let ytLoopStart = 0, ytLoopEnd = 0, isYTLoopActive = true;
    let currentLang = 'ja';

    const lang = {
        ja: { fileSelect: "ファイルを選択 / Drop Audio", cur: "再生位置", bpm: "BPM", count: "カウントダウン (3s)", auto: "自動スピードアップ", rec: "REC CHECK", login: "Googleログイン", logout: "ログアウト" },
        en: { fileSelect: "Select File / Drop Audio", cur: "Position", bpm: "BPM", count: "Countdown (3s)", auto: "Auto Speed Up", rec: "REC CHECK", login: "Login", logout: "Logout" }
    };

    function changeLanguage() {
        currentLang = document.getElementById('langSelect').value;
        const l = lang[currentLang];
        document.getElementById('fileSelectTxt').innerText = l.fileSelect;
        document.getElementById('curTxt').innerText = l.cur;
        document.getElementById('countTxt').innerText = l.count;
        document.getElementById('autoSpeedTxt').innerText = l.auto;
        document.getElementById('menuLoginTxt').innerText = l.login;
        document.getElementById('menuLogoutTxt').innerText = l.logout;
    }

    async function startApp() {
        wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#333',
            progressColor: varColor('--primary-color'),
            cursorColor: '#fff',
            height: 120,
            barWidth: 2,
            normalize: true,
            backend: 'WebAudio'
        });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());

        recWavesurfer = WaveSurfer.create({
            container: '#rec-waveform', waveColor: '#555', progressColor: varColor('--recording-red'), height: 60, barWidth: 2
        });

        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if (file) { wavesurfer.loadBlob(file); document.getElementById('fileSelectTxt').innerText = file.name; }
        };

        const applySettings = () => {
            const s = document.getElementById('speed').value;
            const p = document.getElementById('pitch').value;
            wavesurfer.setPlaybackRate(parseFloat(s));
            document.getElementById('spTxt').innerText = `BPM ${Math.round(s * 120)}`;
            document.getElementById('pitchTxt').innerText = (p > 0 ? '+' : '') + p;
            // Pitch Shifting Logic (Basic)
            const bq = wavesurfer.backend.ac.createBiquadFilter();
            wavesurfer.backend.setFilter(bq);
        };

        document.getElementById('speed').oninput = applySettings;
        document.getElementById('pitch').oninput = applySettings;

        document.getElementById('playBtn').onclick = async () => {
            initAudioContext();
            if (wavesurfer.isPlaying()) { wavesurfer.pause(); } 
            else {
                const current = wavesurfer.getCurrentTime(), region = wsRegions.getRegions()[0];
                if (isCountEnabled() && region && (current < region.start || current >= region.end)) wavesurfer.setTime(region.start);
                await runCountdown();
                applySettings();
                wavesurfer.play();
            }
        };

        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => { document.getElementById('playIcon').innerText = 'play_arrow'; });
        
        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if(r && t >= r.end) { 
                wavesurfer.setTime(r.start); 
                if (document.getElementById('autoSpeedToggle').checked) {
                    const s = document.getElementById('speed');
                    s.value = Math.min(1.5, parseFloat(s.value) + 0.05).toFixed(2);
                    applySettings();
                }
            }
        });

        window.setLoopFromCurrent = () => {
            wsRegions.clearRegions();
            const start = wavesurfer.getCurrentTime();
            wsRegions.addRegion({ start: start, end: start + 5, color: 'rgba(212, 163, 115, 0.3)' });
        };

        changeLanguage();
        renderYTHistory();
    }

    function isCountEnabled() { return document.getElementById('countToggle').checked; }

    async function runCountdown() {
        if (!isCountEnabled()) return;
        const div = document.getElementById('countdown-overlay');
        div.style.display = 'flex';
        for (let i = 3; i > 0; i--) { div.innerText = i; await new Promise(r => setTimeout(r, 800)); }
        div.style.display = 'none';
    }

    function toggleRecording() {
        if (!isRecording) {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    recWavesurfer.load(url);
                    addRecItem(url);
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('recBtn').style.background = varColor('--recording-red');
            });
        } else {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('recBtn').style.background = '#331111';
        }
    }

    function addRecItem(url) {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="history-info">REC_${new Date().toLocaleTimeString()}</div><button class="tab-btn" style="background:var(--primary-color);color:#000;padding:5px 10px;" onclick="recWavesurfer.playPause()">PLAY</button>`;
        document.getElementById('recList').prepend(item);
    }

    // YouTube Logic
    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('player', { height: '100%', width: '100%', events: { 'onStateChange': onYTState } });
    }

    function loadYouTube() {
        const url = document.getElementById('ytUrl').value;
        const id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
        if (id) {
            ytPlayer.loadVideoById(id);
            saveYTHistory(id, url);
        }
    }

    function onYTState(e) {
        if (e.data == YT.PlayerState.PLAYING && isYTLoopActive) {
            setInterval(() => {
                if (ytLoopEnd > 0 && ytPlayer.getCurrentTime() >= ytLoopEnd) ytPlayer.seekTo(ytLoopStart);
            }, 500);
        }
    }

    function setYTLoop(type) {
        const current = ytPlayer.getCurrentTime();
        if (type === 'start') ytLoopStart = current; else ytLoopEnd = current;
    }

    function toggleYTLoop() {
        isYTLoopActive = !isYTLoopActive;
        document.getElementById('ytLoopBtn').classList.toggle('active', isYTLoopActive);
    }

    function saveYTHistory(id, url) {
        let history = JSON.parse(localStorage.getItem('ams_yt_history') || '[]');
        history = history.filter(h => h.id !== id);
        history.unshift({ id, url, date: new Date().toLocaleString() });
        localStorage.setItem('ams_yt_history', JSON.stringify(history.slice(0, 5)));
        renderYTHistory();
    }

    function renderYTHistory() {
        const container = document.getElementById('ytHistory');
        const history = JSON.parse(localStorage.getItem('ams_yt_history') || '[]');
        container.innerHTML = history.length ? '<p style="font-size:0.8rem; color:var(--text-dim);">Recent History</p>' : '';
        history.forEach(h => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<div class="history-info">${h.url}</div><button class="tab-btn" style="padding:5px 10px; background:#333;" onclick="document.getElementById('ytUrl').value='${h.url}';loadYouTube();">LOAD</button>`;
            container.appendChild(item);
        });
    }

    // Utils
    function toggleMenu(open) {
        document.getElementById('sideMenu').classList.toggle('open', open);
        document.getElementById('menuOverlay').style.display = open ? 'block' : 'none';
    }

    function switchMode(mode) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode + '-section').classList.add('active');
        document.getElementById('tab-' + mode).classList.add('active');
    }

    function fmt(s) {
        const m = Math.floor(s / 60);
        const sc = Math.floor(s % 60);
        return `${m.toString().padStart(2, '0')}:${sc.toString().padStart(2, '0')}`;
    }

    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    function initAudioContext() { if (wavesurfer.backend.ac.state === 'suspended') wavesurfer.backend.ac.resume(); }

    function login() { const provider = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(provider); }
    function logout() { auth.signOut(); }

    window.addEventListener('DOMContentLoaded', startApp);
</script>
</body>
</html>
