<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.2 - Studio Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <link rel="icon" href="icon.png?v=1.2.2" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.2">

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d4a373; --bg-dark: #121212; --panel-bg: #1e1e1e;
            --text-main: #e0e0e0; --text-dim: #999999; --border-color: #333333;
            --header-height: 60px; --recording-red: #ff4444; --ai-purple: #a855f7;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; padding-top: var(--header-height); overscroll-behavior-y: contain; }
        header { position: fixed; top: 0; width: 100%; height: var(--header-height); background: rgba(18,18,18,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 2000; border-bottom: 1px solid var(--border-color); }
        .header-logo { font-weight: 900; color: var(--primary-color); letter-spacing: 2px; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .panel { background: var(--panel-bg); border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: var(--panel-bg); padding: 5px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: var(--text-dim); font-weight: bold; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary-color); color: #000; }
        .content-section { display: none; } .content-section.active { display: block; }
        #waveform { background: #000; border-radius: 12px; height: 120px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .btn-ctrl { background: #2a2a2a; border: 1px solid var(--border-color); color: #fff; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .play-main { width: 70px; height: 70px; background: var(--primary-color); color: #000; border: none; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--primary-color); }
        .side-menu { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: var(--panel-bg); z-index: 3000; transition: 0.3s; padding: 20px; border-left: 1px solid var(--border-color); }
        .side-menu.open { right: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        #ytPlayerContainer { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        .custom-file-upload { display: block; width: 100%; padding: 15px; background: #2a2a2a; color: var(--primary-color); text-align: center; border-radius: 12px; border: 1px dashed var(--primary-color); cursor: pointer; font-weight: bold; margin-bottom: 10px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
            authDomain: "ams-player-e04bf.firebaseapp.com",
            projectId: "ams-player-e04bf",
            storageBucket: "ams-player-e04bf.firebasestorage.app",
            messagingSenderId: "102274983236",
            appId: "1:102274983236:web:f4334348391dde42dd6311"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('authStatus');
            if (user) {
                statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;vertical-align:middle;">${user.displayName}`;
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
            } else {
                statusEl.innerText = "未ログイン";
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        });
    </script>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="btn-ctrl" style="border:none; background:none;" onclick="toggleMenu(true)"><span class="material-icons">menu</span></button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="row"><span style="color:var(--primary-color); font-weight:bold;">MENU</span><span class="material-icons" onclick="toggleMenu(false)">close</span></div>
    <hr style="border-top:1px solid var(--border-color); margin:15px 0;">
    <div id="authStatus" style="padding:10px; font-size:0.9rem;"></div>
    <div id="loginBtn" class="row" onclick="login()" style="cursor:pointer; padding:10px;"><span class="material-icons">login</span>ログイン</div>
    <div id="logoutBtn" class="row" onclick="logout()" style="display:none; cursor:pointer; padding:10px;"><span class="material-icons">logout</span>ログアウト</div>
</div>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="custom-file-upload">ファイルを選択</label>
        <input type="file" id="audioFile" accept="audio/*">
        <div id="waveform"></div>
        <div class="row">
            <span id="currentTime">00:00</span>
            <div style="display:flex; gap:15px;">
                <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
                <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
                <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            </div>
            <span id="totalTime">00:00</span>
        </div>
        <div class="panel">
            <div class="row"><span>Speed</span><input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0"><span id="spTxt">BPM ---</span></div>
            <div class="row"><span>Pitch</span><input type="range" id="pitch" min="-6" max="6" step="1" value="0"><span id="pitchTxt">±0</span></div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div class="row">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex:1; padding:12px; background:#000; border:1px solid var(--border-color); color:#fff; border-radius:8px;">
            <button onclick="loadYouTube()" style="padding:12px; background:var(--primary-color); border:none; border-radius:8px; font-weight:bold;">LOAD</button>
        </div>
        <div id="ytPlayerContainer"><div id="player"></div></div>
        <div class="panel" style="margin-top:15px;">
            <div class="row">
                <button class="tab-btn" style="background:#333;" onclick="setLoopPoint('start')">SET START</button>
                <button class="tab-btn" style="background:#333;" onclick="setLoopPoint('end')">SET END</button>
            </div>
            <button id="toggleLoopBtn" class="tab-btn active" style="width:100%; margin-top:10px;" onclick="toggleLoop()">LOOP ON</button>
        </div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let wavesurfer, ytPlayer;
    let loopStart = 0, loopEnd = 0, isLoopActive = true;

    function initWS() {
        wavesurfer = WaveSurfer.create({ container: '#waveform', waveColor: '#333', progressColor: '#d4a373', height: 120, backend: 'WebAudio' });
        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        wavesurfer.on('timeupdate', t => document.getElementById('currentTime').innerText = fmt(t));
        wavesurfer.on('ready', () => document.getElementById('totalTime').innerText = fmt(wavesurfer.getDuration()));
        document.getElementById('audioFile').onchange = e => { const f = e.target.files[0]; if(f) wavesurfer.loadBlob(f); };
        document.getElementById('speed').oninput = e => { wavesurfer.setPlaybackRate(e.target.value); document.getElementById('spTxt').innerText = `BPM ${Math.round(e.target.value * 120)}`; };
    }

    function toggleMenu(s) { document.getElementById('sideMenu').classList.toggle('open', s); document.getElementById('menuOverlay').style.display = s ? 'block' : 'none'; }
    function switchMode(m) { 
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(m + '-section').classList.add('active');
        document.getElementById('tab-' + m).classList.add('active');
    }
    function fmt(s) { const m = Math.floor(s/60); const sc = Math.floor(s%60); return `${m}:${sc<10?'0':''}${sc}`; }

    function onYouTubeIframeAPIReady() { ytPlayer = new YT.Player('player', { events: { 'onStateChange': onState } }); }
    function loadYouTube() { const url = document.getElementById('ytUrl').value; const id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop(); if(id) ytPlayer.loadVideoById(id); }
    function onState(e) { if(e.data == YT.PlayerState.PLAYING && isLoopActive) { setInterval(() => { if(loopEnd > 0 && ytPlayer.getCurrentTime() >= loopEnd) ytPlayer.seekTo(loopStart); }, 500); } }
    function setLoopPoint(t) { const c = ytPlayer.getCurrentTime(); if(t==='start') loopStart = c; else loopEnd = c; }
    function toggleLoop() { isLoopActive = !isLoopActive; document.getElementById('toggleLoopBtn').innerText = isLoopActive ? "LOOP ON" : "LOOP OFF"; }

    window.onload = () => { initWS(); document.getElementById('playBtn').onclick = () => wavesurfer.playPause(); };
</script>
</body>
</html>
