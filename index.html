<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.4.0</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary: #8b5cf6; /* Electric Violet */
            --primary-hover: #7c3aed;
            --bg-base: #0f172a; /* Slate 900 */
            --bg-card: #1e293b; /* Slate 800 */
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --border: #334155;
            --header-h: 64px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-h);
        }

        /* Overlays */
        #auth-overlay, #subscription-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-base); z-index: 9000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        #subscription-overlay { background: rgba(15, 23, 42, 0.9); display: none; }
        
        .glass-card {
            background: var(--bg-card); padding: 32px; border-radius: 24px;
            border: 1px solid var(--border); width: 100%; max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Buttons */
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 14px 24px;
            border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%;
            transition: transform 0.1s, background 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }
        
        .google-btn {
            background: white; color: #1e293b; border: none; padding: 12px;
            border-radius: 12px; font-weight: 600; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 12px; width: 100%; margin-top: 16px;
        }

        /* Header */
        header {
            position: fixed; top: 0; width: 100%; height: var(--header-h);
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 5000;
        }
        .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px; color: var(--primary); }

        .container { max-width: 800px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }

        /* Tabs */
        .tabs {
            display: flex; background: #020617; padding: 4px; border-radius: 14px; margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-dim);
            font-weight: 600; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: var(--bg-card); color: var(--text-main); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        /* Waveform Area */
        .player-surface {
            background: #000; border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 16px; overflow: hidden; position: relative;
        }
        #waveform-wrapper, #rec-waveform-wrapper { min-height: 140px; }
        #rec-waveform-wrapper { border-top: 1px solid var(--accent-red); display: none; }
        
        .time-info {
            display: flex; justify-content: space-between; padding: 10px 16px;
            font-family: 'Monaco', monospace; font-size: 0.9rem; color: var(--primary);
        }

        /* Controls Panel */
        .control-panel {
            background: var(--bg-card); border-radius: 20px; padding: 20px;
            border: 1px solid var(--border); margin-bottom: 16px;
        }
        .row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .row:last-child { margin-bottom: 0; }

        .label-group { min-width: 80px; font-size: 0.75rem; color: var(--text-dim); font-weight: bold; text-transform: uppercase; }

        input[type="range"] {
            flex: 1; accent-color: var(--primary); height: 6px; border-radius: 3px;
        }

        /* Main Transport */
        .transport {
            display: flex; justify-content: center; align-items: center; gap: 20px; margin: 24px 0;
        }
        .circle-btn {
            width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-main); display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .circle-btn.active { color: var(--primary); border-color: var(--primary); }
        .circle-btn.play { width: 72px; height: 72px; background: var(--primary); color: white; border: none; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        .circle-btn.play:hover { background: var(--primary-hover); }

        /* Recording Panel */
        .rec-area { border: 1px solid rgba(239, 68, 68, 0.3); }
        .rec-btn-main { color: var(--accent-red); border-color: var(--accent-red); }
        .rec-btn-main.recording { background: var(--accent-red); color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Utilities */
        .badge-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .loop-badge {
            background: var(--bg-card); border: 1px solid var(--border); padding: 6px 12px;
            border-radius: 20px; display: flex; align-items: center; gap: 8px; cursor: pointer;
        }
        .loop-badge:hover { border-color: var(--primary); }

        .hidden { display: none; }
        .reset-link { font-size: 10px; color: var(--text-dim); text-decoration: underline; cursor: pointer; margin-left: 5px; }

        /* Side Menu */
        .side-menu {
            position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
            background: var(--bg-card); z-index: 6000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        .side-menu.open { right: 0; }
        .overlay-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 5500; display: none; }

        /* YouTube Specific */
        #ytPlayerContainer { border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; background: #000; margin-bottom: 15px; }
        .yt-history-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .history-card { 
            background: var(--bg-card); padding: 10px; border-radius: 10px; font-size: 11px;
            min-width: 140px; border: 1px solid var(--border); cursor: pointer;
        }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="glass-card" style="text-align:center;">
        <div class="logo" style="font-size: 2rem; margin-bottom: 8px;">AMS PLAYER</div>
        <p style="color: var(--text-dim); margin-bottom: 24px;">練習を同期するためにサインイン</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G">
            Googleでログイン
        </button>
    </div>
</div>

<div id="subscription-overlay">
    <div class="glass-card" style="text-align:center;">
        <div class="material-icons" style="font-size: 48px; color: var(--accent-yellow);">stars</div>
        <h2 id="premiumTitle">PREMIUM PLAN</h2>
        <p id="premiumMsg" style="font-size: 0.9rem; color: var(--text-dim); margin-bottom: 24px;">
            この機能（ピッチ変更・録音・保存等）は<br>スクール会員限定機能です。
        </p>
        <button class="btn-primary" onclick="redirectToCheckout()">サブスクリプションを開始</button>
        <button onclick="closeSubOverlay()" style="background:none; border:none; color:var(--text-dim); margin-top:16px; cursor:pointer;">閉じる</button>
    </div>
</div>

<header>
    <div class="logo">AMS PLAYER</div>
    <div style="display:flex; align-items:center; gap:12px;">
        <span id="userName" style="font-size: 0.75rem; color: var(--text-dim); font-weight: 500;"></span>
        <button onclick="toggleMenu(true)" style="background:none; border:none; color:white; cursor:pointer;">
            <span class="material-icons">menu</span>
        </button>
    </div>
</header>

<div class="overlay-mask" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <span style="font-weight:800; color:var(--primary);">MENU</span>
        <span class="material-icons" onclick="toggleMenu(false)" style="cursor:pointer;">close</span>
    </div>
    <div style="margin-bottom:24px;">
        <label style="font-size:0.7rem; color:var(--text-dim); display:block; margin-bottom:8px;">LANGUAGE</label>
        <select id="langSelect" onchange="changeLanguage()" style="width:100%; padding:10px; background:var(--bg-base); color:white; border:1px solid var(--border); border-radius:8px;">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </div>
    <button onclick="logout()" class="btn-primary" style="background:#334155; margin-top:20px;">ログアウト</button>
</div>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">AUDIO FILE</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YOUTUBE</button>
    </div>

    <div id="file-section">
        <div class="player-surface">
            <div class="time-info">
                <span id="loadStatus">READY</span>
                <span><span id="currentTime">00:00</span> / <span id="totalTime">00:00</span></span>
            </div>
            <div id="waveform-wrapper">
                <div id="waveform"></div>
                <div id="countdown-overlay" style="position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:80px; font-weight:800; color:var(--primary); background:rgba(0,0,0,0.5); pointer-events:none;"></div>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:16px;">
            <label for="audioFile" class="btn-primary" style="flex:1; text-align:center; padding:12px; font-size:0.85rem;" id="fileBtnTxt">ファイルを開く</label>
            <input type="file" id="audioFile" class="hidden" accept="audio/*">
            <button class="btn-primary" onclick="wsRegions.clearRegions()" style="background:var(--bg-card); border:1px solid var(--border); flex:1; font-size:0.85rem;" id="clearBtnTxt">範囲解除</button>
        </div>

        <div class="control-panel">
            <div class="row">
                <div class="label-group">Volume</div>
                <span class="material-icons" style="font-size:18px; color:var(--text-dim);">volume_up</span>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
                <div id="mainVolTxt" style="min-width:40px; font-size:0.8rem;">80%</div>
            </div>
            <div class="row">
                <div class="label-group">Speed <span class="reset-link" onclick="resetSetting('speed', 1.0)">Res</span></div>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <div id="spTxt" style="min-width:65px; font-weight:bold; color:var(--primary);">BPM ---</div>
            </div>
            <div class="row">
                <div class="label-group">Pitch <span class="reset-link" onclick="resetSetting('pitch', 0)">Res</span></div>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <div id="pitchTxt" style="min-width:40px; font-weight:bold; color:var(--primary);">±0</div>
            </div>
        </div>

        <div class="transport">
            <button class="circle-btn active" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="circle-btn" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="circle-btn play" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
            <button class="circle-btn" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="circle-btn" id="speedUpToggleBtn" onclick="toggleFeature('speedup')"><span class="material-icons">speed</span></button>
        </div>

        <div class="control-panel rec-area">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <div style="color:var(--accent-red); font-size:0.7rem; font-weight:800; letter-spacing:1px;">REC CHECK</div>
                <div style="display:flex; gap:10px;">
                    <button id="soloBtn" class="circle-btn" style="width:36px; height:36px; font-weight:bold; font-size:0.7rem;" onclick="toggleSolo()">S</button>
                    <button class="circle-btn rec-btn-main" id="recBtn" style="width:36px; height:36px;" onclick="toggleRecording()"><span class="material-icons" id="recIcon" style="font-size:18px;">mic</span></button>
                </div>
            </div>
            <div id="recVolControl" class="hidden">
                <div class="row">
                    <span class="material-icons" style="font-size:18px; color:var(--accent-red);">hearing</span>
                    <input type="range" id="recVolume" min="0" max="1.5" step="0.05" value="1.0">
                    <span id="recVolTxt" style="font-size:0.8rem; min-width:35px;">100%</span>
                </div>
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="btn-primary" onclick="playRecording()" id="playRecBtn" style="padding:8px; font-size:0.75rem;">録音再生</button>
                    <button class="btn-primary" onclick="deleteRecording()" style="background:#442222; padding:8px; font-size:0.75rem;">削除</button>
                </div>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:0.7rem; color:var(--text-dim); font-weight:800;">SAVED LOOPS</div>
            <button onclick="saveLoop('file')" style="background:none; border:none; color:var(--primary); cursor:pointer; font-size:0.75rem; font-weight:bold;">+ SAVE LOOP</button>
        </div>
        <div id="loopListFile" class="badge-list"></div>
    </div>

    <div id="yt-section" class="hidden">
        <div style="display:flex; gap:8px; margin-bottom:16px;">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex:1; background:var(--bg-card); border:1px solid var(--border); color:white; padding:12px; border-radius:12px; font-size:0.85rem;">
            <button class="btn-primary" onclick="loadYouTube()" style="width:80px;">LOAD</button>
        </div>
        
        <div id="ytHistoryContainer" class="hidden">
            <div class="yt-history-scroll" id="ytHistoryList" onclick="handleHistoryClick(event)"></div>
        </div>

        <div id="ytPlayerContainer"><div id="player"></div></div>

        <div class="control-panel">
            <div style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
                <div style="flex:1; text-align:center;">
                    <button class="btn-primary" style="background:var(--bg-base); border:1px solid var(--border); margin-bottom:8px; font-size:0.7rem;" onclick="setLoopPoint('start')">SET START</button>
                    <div id="loopStartTxt" style="font-family:monospace; color:var(--primary);">00:00</div>
                </div>
                <div style="flex:1; text-align:center;">
                    <button class="btn-primary" style="background:var(--bg-base); border:1px solid var(--border); margin-bottom:8px; font-size:0.7rem;" onclick="setLoopPoint('end')">SET END</button>
                    <div id="loopEndTxt" style="font-family:monospace; color:var(--primary);">00:00</div>
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button id="toggleLoopBtn" class="btn-primary" style="background:var(--bg-base); border:1px solid var(--border);" onclick="toggleLoop()">LOOP OFF</button>
                <button class="btn-primary" onclick="saveLoop('yt')">SAVE LOOP</button>
            </div>
        </div>
        <div id="loopListYT" class="badge-list"></div>
    </div>
</div>

<script>
    // --- Firebase Init ---
    const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isSubscribed = false;

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        // 強制的にアカウント選択を表示させる設定
        provider.setCustomParameters({ prompt: 'select_account' });
        auth.signInWithPopup(provider).catch(e => alert("Error: " + e.message));
    }

    function logout() {
        auth.signOut().then(() => {
            // ログアウト後はリロードして状態をリセット
            window.location.reload();
        });
    }

    async function checkSubscriptionStatus(user) {
        try {
            const doc = await db.collection('School Member').doc(user.email).get();
            return doc.exists && doc.data().isSubscribed === true;
        } catch (e) { return false; }
    }

    auth.onAuthStateChanged(async user => {
        const authOverlay = document.getElementById('auth-overlay');
        if (user) {
            authOverlay.style.display = 'none';
            document.getElementById('userName').innerText = user.displayName;
            isSubscribed = await checkSubscriptionStatus(user);
            renderLoopList(currentMode);
        } else {
            authOverlay.style.display = 'flex';
        }
    });

    // --- Core Logic ---
    let wavesurfer, wsRegions, recWavesurfer, ytPlayer, loopInterval;
    let loopStart = 0, loopEnd = 0, isLooping = false, currentMode = 'file';
    let originalBpm = 120, currentFileName = "", currentYTId = "";
    let isCountEnabled = true, isSpeedUpEnabled = false, isRecording = false, isSolo = false;
    let mediaRecorder, recordedChunks = [], recObjectURL = null, lastRecStartPos = 0;

    const translations = {
        ja: { ready: "準備完了", analyzing: "解析中...", file: "ファイルを開く", clear: "範囲解除", loopOff: "ループ OFF", loopOn: "ループ ON", recPlay: "録音再生", recStop: "停止" },
        en: { ready: "READY", analyzing: "ANALYZING...", file: "OPEN FILE", clear: "CLEAR", loopOff: "LOOP OFF", loopOn: "LOOP ON", recPlay: "PLAY REC", recStop: "STOP" }
    };

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang];
        document.getElementById('fileBtnTxt').innerText = t.file;
        document.getElementById('clearBtnTxt').innerText = t.clear;
        const status = document.getElementById('loadStatus');
        if(status.innerText.includes("READY") || status.innerText.includes("準備")) status.innerText = t.ready;
        updateRecPlayBtnUI();
    }

    function updateRecPlayBtnUI() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang];
        const btn = document.getElementById('playRecBtn');
        if (recWavesurfer && recWavesurfer.isPlaying()) btn.innerText = t.recStop;
        else btn.innerText = t.recPlay;
    }

    function toggleMenu(open) {
        document.getElementById('sideMenu').classList.toggle('open', open);
        document.getElementById('menuOverlay').style.display = open ? 'block' : 'none';
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('file-section').classList.toggle('hidden', mode !== 'file');
        document.getElementById('yt-section').classList.toggle('hidden', mode !== 'yt');
        document.getElementById('tab-file').classList.add(mode === 'file' ? 'active' : 'inactive');
        document.getElementById('tab-file').classList.remove(mode === 'file' ? 'inactive' : 'active');
        document.getElementById('tab-yt').classList.add(mode === 'yt' ? 'active' : 'inactive');
        document.getElementById('tab-yt').classList.remove(mode === 'yt' ? 'inactive' : 'active');
        if(mode === 'yt') { if(wavesurfer) wavesurfer.pause(); renderYTHistory(); }
        else if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        renderLoopList(mode);
    }

    function resetSetting(id, val) {
        document.getElementById(id).value = val;
        applySettings();
    }

    function applyVolumes() {
        if (!wavesurfer) return;
        const mVol = parseFloat(document.getElementById('mainVolume').value);
        const rVol = parseFloat(document.getElementById('recVolume').value);
        wavesurfer.setMuted(isSolo);
        if (!isSolo) wavesurfer.setVolume(mVol);
        if (recWavesurfer) recWavesurfer.setVolume(rVol);
        document.getElementById('mainVolTxt').innerText = Math.round(mVol * 100) + "%";
        document.getElementById('recVolTxt').innerText = Math.round(rVol * 100) + "%";
    }

    function applySettings() {
        const s = parseFloat(document.getElementById('speed').value);
        const p = parseInt(document.getElementById('pitch').value);
        const media = wavesurfer.getMediaElement();
        if (media) {
            media.preservesPitch = true;
            if (media.detune !== undefined) { 
                media.detune = p * 100; 
                wavesurfer.setPlaybackRate(s); 
            } else {
                if (p !== 0) { 
                    media.preservesPitch = false; 
                    wavesurfer.setPlaybackRate(s * Math.pow(2, p / 12)); 
                } else wavesurfer.setPlaybackRate(s);
            }
        }
        document.getElementById('spTxt').innerText = "BPM " + Math.round(originalBpm * s);
        document.getElementById('pitchTxt').innerText = (p > 0 ? "+" : "") + p;
        applyVolumes();
    }

    async function toggleRecording() {
        if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        if (isRecording) {
            mediaRecorder.stop();
            wavesurfer.pause();
            isRecording = false;
            document.getElementById('recBtn').classList.remove('recording');
            document.getElementById('recIcon').innerText = 'mic';
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    if (recObjectURL) URL.revokeObjectURL(recObjectURL);
                    recObjectURL = URL.createObjectURL(blob);
                    await recWavesurfer.load(recObjectURL);
                    document.getElementById('rec-waveform-wrapper').style.display = 'block';
                    document.getElementById('recVolControl').classList.remove('hidden');
                    stream.getTracks().forEach(t => t.stop());
                };
                const r = wsRegions.getRegions()[0];
                const start = r ? r.start : wavesurfer.getCurrentTime();
                wavesurfer.setTime(start); lastRecStartPos = start;
                await runCountdown();
                mediaRecorder.start();
                wavesurfer.play();
                isRecording = true;
                document.getElementById('recBtn').classList.add('recording');
                document.getElementById('recIcon').innerText = 'stop';
            } catch (e) { alert("Mic Error"); }
        }
    }

    async function runCountdown() {
        if (!isCountEnabled) return;
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'flex';
        const interval = 60000 / (originalBpm * parseFloat(document.getElementById('speed').value));
        for (let i = 1; i <= 4; i++) {
            overlay.innerText = i;
            const osc = new AudioContext().createOscillator();
            const gain = new AudioContext().createGain();
            osc.frequency.value = i === 4 ? 880 : 440;
            gain.gain.value = 0.1;
            osc.connect(gain); gain.connect(new AudioContext().destination);
            osc.start(); osc.stop(new AudioContext().currentTime + 0.1);
            await new Promise(r => setTimeout(r, interval));
        }
        overlay.style.display = 'none';
    }

    function playRecording() {
        if (recWavesurfer.isPlaying()) { recWavesurfer.pause(); wavesurfer.pause(); }
        else { wavesurfer.setTime(lastRecStartPos); recWavesurfer.setTime(0); wavesurfer.play(); recWavesurfer.play(); }
        updateRecPlayBtnUI();
    }

    function deleteRecording() {
        if(confirm("Delete?")) {
            document.getElementById('rec-waveform-wrapper').style.display = 'none';
            document.getElementById('recVolControl').classList.add('hidden');
            recWavesurfer.empty();
        }
    }

    function toggleSolo() { isSolo = !isSolo; document.getElementById('soloBtn').classList.toggle('active', isSolo); applyVolumes(); }

    function toggleFeature(f) {
        if(f === 'count') { isCountEnabled = !isCountEnabled; document.getElementById('countToggleBtn').classList.toggle('active', isCountEnabled); }
        if(f === 'speedup') { 
            if(!isSubscribed) { document.getElementById('subscription-overlay').style.display='flex'; return; }
            isSpeedUpEnabled = !isSpeedUpEnabled; 
            document.getElementById('speedUpToggleBtn').classList.toggle('active', isSpeedUpEnabled); 
        }
    }

    // YouTube API
    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    function onYouTubeIframeAPIReady() {}

    function loadYouTube(manual) {
        const url = manual || document.getElementById('ytUrl').value;
        const id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.includes('be/') ? url.split('be/')[1] : null;
        if(id) {
            currentYTId = id;
            if(ytPlayer) ytPlayer.loadVideoById(id);
            else ytPlayer = new YT.Player('player', { videoId: id, events: { onStateChange: onPlayerStateChange, onReady: (e) => { 
                const d = ytPlayer.getVideoData();
                saveToHistory(id, d.title);
                renderLoopList('yt');
            }}});
        }
    }

    function onPlayerStateChange(e) {
        if(e.data === YT.PlayerState.PLAYING) {
            loopInterval = setInterval(() => {
                if(isLooping && ytPlayer.getCurrentTime() >= loopEnd) ytPlayer.seekTo(loopStart);
            }, 200);
        } else clearInterval(loopInterval);
    }

    function saveToHistory(id, title) {
        let h = JSON.parse(localStorage.getItem('ams_yt_history') || "[]");
        h = h.filter(i => i.id !== id);
        h.unshift({ id, title, url: `https://www.youtube.com/watch?v=${id}` });
        localStorage.setItem('ams_yt_history', JSON.stringify(h.slice(0,10)));
        renderYTHistory();
    }

    function renderYTHistory() {
        const list = document.getElementById('ytHistoryList');
        const h = JSON.parse(localStorage.getItem('ams_yt_history') || "[]");
        if(h.length === 0) return;
        document.getElementById('ytHistoryContainer').classList.remove('hidden');
        list.innerHTML = h.map(i => `<div class="history-card" data-url="${i.url}">${i.title}</div>`).join('');
    }

    function handleHistoryClick(e) {
        if(e.target.dataset.url) loadYouTube(e.target.dataset.url);
    }

    const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
    function setLoopPoint(t) {
        const now = ytPlayer.getCurrentTime();
        if(t === 'start') { loopStart = Math.floor(now); document.getElementById('loopStartTxt').innerText = fmt(now); }
        else { loopEnd = Math.ceil(now); document.getElementById('loopEndTxt').innerText = fmt(now); }
    }
    function toggleLoop() {
        isLooping = !isLooping;
        const btn = document.getElementById('toggleLoopBtn');
        btn.innerText = isLooping ? "LOOP ON" : "LOOP OFF";
        btn.classList.toggle('active', isLooping);
    }

    function saveLoop(mode) {
        if(!isSubscribed) { document.getElementById('subscription-overlay').style.display='flex'; return; }
        const key = mode === 'file' ? currentFileName : currentYTId;
        if(!key) return;
        let start, end;
        if(mode === 'file') {
            const r = wsRegions.getRegions()[0];
            if(!r) return; start = r.start; end = r.end;
        } else {
            start = loopStart; end = loopEnd;
        }
        const sKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let all = JSON.parse(localStorage.getItem(sKey) || "{}");
        if(!all[key]) all[key] = [];
        all[key].push({start, end});
        localStorage.setItem(sKey, JSON.stringify(all));
        renderLoopList(mode);
    }

    function renderLoopList(mode) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const cont = mode === 'file' ? document.getElementById('loopListFile') : document.getElementById('loopListYT');
        if(!cont || !key) return;
        const sKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        const all = JSON.parse(localStorage.getItem(sKey) || "{}");
        cont.innerHTML = (all[key] || []).map((l, i) => `
            <div class="loop-badge" onclick="applyLoop('${mode}', ${l.start}, ${l.end})">
                <span>Loop ${i+1}</span>
                <span class="material-icons" style="font-size:14px;" onclick="event.stopPropagation(); deleteLoop('${mode}', ${i})">close</span>
            </div>
        `).join('');
    }

    window.applyLoop = (mode, s, e) => {
        if(mode === 'file') {
            wsRegions.clearRegions();
            wsRegions.addRegion({ start: s, end: e, color: 'rgba(139, 92, 246, 0.2)' });
            wavesurfer.setTime(s);
        } else {
            loopStart = s; loopEnd = e;
            document.getElementById('loopStartTxt').innerText = fmt(s);
            document.getElementById('loopEndTxt').innerText = fmt(e);
            ytPlayer.seekTo(s);
            if(!isLooping) toggleLoop();
        }
    };

    window.deleteLoop = (mode, i) => {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const sKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let all = JSON.parse(localStorage.getItem(sKey) || "{}");
        all[key].splice(i, 1);
        localStorage.setItem(sKey, JSON.stringify(all));
        renderLoopList(mode);
    };

    function closeSubOverlay() { document.getElementById('subscription-overlay').style.display='none'; }
    function redirectToCheckout() { window.location.href = "https://your-payment-link.com"; }

    function startApp() {
        wavesurfer = WaveSurfer.create({ container: '#waveform', waveColor: '#334155', progressColor: '#8b5cf6', height: 140, barWidth: 2, normalize: true });
        recWavesurfer = WaveSurfer.create({ container: '#rec-waveform', waveColor: '#442222', progressColor: '#ef4444', height: 80, barWidth: 2 });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        wsRegions.enableDragSelection({ color: 'rgba(139, 92, 246, 0.2)' });
        
        wsRegions.on('region-created', r => {
            if(wsRegions.getRegions().length > 1) wsRegions.getRegions()[0].remove();
            wavesurfer.setTime(r.start);
        });

        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if(file) {
                currentFileName = file.name;
                const url = URL.createObjectURL(file);
                wavesurfer.load(url);
                renderLoopList('file');
            }
        };

        wavesurfer.on('ready', () => {
            document.getElementById('totalTime').innerText = fmt(wavesurfer.getDuration());
            applySettings();
        });

        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if(r && t >= r.end) {
                wavesurfer.setTime(r.start);
                if(isSpeedUpEnabled) {
                    const s = document.getElementById('speed');
                    s.value = Math.min(1.5, parseFloat(s.value) + 0.05).toFixed(2);
                    applySettings();
                }
            }
        });

        document.getElementById('playBtn').onclick = () => wavesurfer.isPlaying() ? wavesurfer.pause() : wavesurfer.play();
        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');

        document.getElementById('mainVolume').oninput = applyVolumes;
        document.getElementById('recVolume').oninput = applyVolumes;
        document.getElementById('speed').oninput = applySettings;
        document.getElementById('pitch').oninput = applySettings;
        
        // Pitch制限
        document.getElementById('pitch').onmousedown = (e) => {
            if(!isSubscribed) { e.preventDefault(); document.getElementById('subscription-overlay').style.display='flex'; }
        };

        changeLanguage();
    }

    window.addEventListener('DOMContentLoaded', startApp);
</script>
