<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.3.2 - Studio Edition</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="icon" href="icon.png?v=1.2.1" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.1">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d4a373;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #999999;
            --border-color: #333333;
            --header-height: 60px;
            --recording-red: #ff4444;
            --solo-yellow: #ffcc00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-height);
        }

        /* 認証・サブスク関連オーバーレイ */
        #auth-overlay, #subscription-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        #subscription-overlay { background: rgba(0,0,0,0.95); z-index: 6000; display: none; }
        
        .login-card {
            background: var(--panel-bg); padding: 40px 30px; border-radius: 20px;
            border: 1px solid var(--primary-color); max-width: 350px; width: 100%;
        }
        .google-btn {
            background: white; color: #757575; border: none; padding: 12px 20px;
            border-radius: 5px; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; width: 100%;
            margin-top: 20px; font-size: 1rem;
        }
        .subscribe-btn {
            background: var(--primary-color); color: #121212; border: none; padding: 15px 30px;
            border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1rem; width: 100%;
        }
        .user-info { font-size: 0.7rem; color: var(--text-dim); display: flex; align-items: center; gap: 10px; }
        .logout-btn { background: none; border: 1px solid var(--border-color); color: var(--text-dim); padding: 4px 8px; border-radius: 4px; font-size: 0.6rem; cursor: pointer; }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            z-index: 2000; backdrop-filter: blur(10px);
        }
        .header-logo { color: var(--primary-color); font-weight: bold; letter-spacing: 1px; font-size: 0.9rem; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px; padding-bottom: 40px; }

        #waveform-wrapper, #rec-waveform-wrapper { position: relative; background: #000; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; overflow: hidden; min-height: 120px; }
        #rec-waveform-wrapper { min-height: 80px; margin-top: 8px; display: none; border: 1px solid var(--recording-red); }
        .waveform-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; }
        .time-display { color: var(--primary-color); font-weight: bold; font-size: 1rem; }

        .panel { background: var(--panel-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .panel-rec { padding: 10px 15px; gap: 8px; border-color: rgba(255, 68, 68, 0.4); }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        input[type="range"] { flex-grow: 1; accent-color: var(--primary-color); height: 6px; min-width: 50px; -webkit-appearance: none; background: #333; border-radius: 5px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary-color); cursor: pointer; border: none; }
        .val-display { color: var(--primary-color); font-weight: bold; min-width: 70px; text-align: right; font-size: 0.95rem; }

        .transport-controls { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 15px 0; }
        .btn-ctrl { background: var(--panel-bg); color: var(--text-dim); border: 1px solid var(--border-color); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .btn-ctrl.active { color: var(--primary-color); border-color: var(--primary-color); }
        .play-main { background: var(--primary-color); color: #121212 !important; width: 60px; height: 60px; border: none; }
        .rec-btn { color: var(--recording-red); border-color: #442222; width: 40px; height: 40px; }
        .rec-btn.recording { background: var(--recording-red); color: white; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .solo-btn { width: 32px; height: 32px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; background: #333; color: var(--text-dim); border: 1px solid var(--border-color); }
        .solo-btn.active { background: var(--solo-yellow); color: #000; border-color: var(--solo-yellow); }

        .custom-file-upload { display: block; width: 100%; padding: 12px; border: 2px dashed var(--border-color); border-radius: 10px; margin-bottom: 12px; background: #181818; color: #888; font-size: 0.8rem; text-align: center; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        input[type="file"] { display: none; }
        #countdown-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; color: var(--primary-color); font-weight: bold; z-index: 1000; display: none; text-shadow: 0 0 20px rgba(0,0,0,0.8); pointer-events: none; }
        
        /* Menu & Modal Styles */
        .side-menu { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: var(--panel-bg); z-index: 3000; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; }
        .side-menu.open { right: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .menu-item { display: flex; align-items: center; gap: 12px; color: var(--text-main); padding: 10px; text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 500px; background: var(--panel-bg); border: 1px solid var(--primary-color); border-radius: 16px; z-index: 4000; padding: 20px; box-shadow: 0 0 50px rgba(0,0,0,1); max-height: 80vh; overflow-y: auto; }

        /* Tabs & YouTube */
        .mode-tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 15px; background: var(--panel-bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border-color); }
        .tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 8px; cursor: pointer; border-radius: 6px; font-size: 0.75rem; flex: 1; transition: all 0.3s ease; }
        .tab-btn.active { background: var(--primary-color); color: #121212; font-weight: bold; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        #ytPlayerContainer { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background: #000; }
        #ytPlayerContainer iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }
        .loop-list-container { margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        .loop-btn-main { background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--primary-color); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
        .clear-btn-ja { background: #333; border: none; color: var(--text-main); padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .premium-lock { font-size: 12px; margin-left: 4px; vertical-align: middle; opacity: 0.7; }
        .reset-btn { background: #333; border: none; color: #999; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-card">
        <div class="header-logo" style="font-size: 1.5rem; margin-bottom: 10px;">AMS PLAYER</div>
        <p style="font-size: 0.8rem; color: var(--text-dim);">練習を同期するためにログインしてください</p>
        <button class="google-btn" id="loginBtnTrigger">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G">
            Googleでログイン
        </button>
    </div>
</div>

<div id="subscription-overlay">
    <div class="login-card">
        <div class="header-logo" style="font-size: 1.5rem; margin-bottom: 10px;">PREMIUM PLAN</div>
        <p style="font-size: 0.9rem; color: var(--text-main);">この機能を利用するには<br>サブスクリプションへの登録が必要です。</p>
        <button class="subscribe-btn" onclick="redirectToCheckout()">
            サブスクリプションを開始する
        </button>
        <button class="clear-btn-ja" onclick="closeSubOverlay()" style="margin-top:15px; width:100%; justify-content:center;">閉じる</button>
    </div>
</div>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <div class="user-info" id="userInfoDisplay" style="display:none;">
        <span id="userName">Guest</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <button class="menu-trigger" style="background:none; border:none; color:white;" onclick="toggleMenu(true)">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <span style="font-weight:bold; color:var(--primary-color);">MENU</span>
        <button style="background:none; border:none; color:white;" onclick="toggleMenu(false)">
            <span class="material-icons">close</span>
        </button>
    </div>
    <span style="font-size:0.7rem; color:var(--primary-color); display:block; margin-bottom:10px;">LANGUAGE</span>
    <select id="langSelect" onchange="changeLanguage()" style="width:100%; background:#333; color:white; border:1px solid #555; padding:5px; border-radius:5px;">
        <option value="ja">日本語</option> <option value="en">English</option>
    </select>
</div>

<div class="container">
    <div style="text-align:center; margin-bottom:15px;"><h2 style="color:var(--primary-color); font-size:0.9rem; letter-spacing:4px; text-transform:uppercase;">AMS Practice Player</h2></div>

    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File Mode</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube Mode <span class="material-icons premium-lock" id="ytLock">lock</span></button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="custom-file-upload" id="fileSelectBtn">ファイルを選択</label>
        <input type="file" id="audioFile" accept="audio/*">

        <div class="waveform-label">
            <span id="loadStatus">READY</span>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="material-icons" style="font-size:18px;">zoom_in</span>
                <input type="range" id="zoomSlider" min="0" max="500" value="100" style="width:80px;">
                <button class="reset-btn" id="resetZoomBtn">FIT</button>
            </div>
            <span class="time-display"><span id="currentTime">00:00</span> / <span id="totalTime">00:00</span></span>
        </div>
        
        <div id="waveform-wrapper">
            <div id="countdown-overlay"></div>
            <div id="waveform"></div>
        </div>

        <div class="panel" style="margin-top:-5px; padding: 10px 15px;">
            <div class="row">
                <span class="material-icons" style="font-size:18px; color:var(--text-dim);">volume_up</span>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
                <span id="mainVolTxt" style="font-size:0.75rem; min-width:35px; text-align:right;">80%</span>
            </div>
        </div>

        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
            <button class="clear-btn-ja" onclick="wsRegions.clearRegions()"><span class="material-icons" style="font-size:16px;">layers_clear</span> 範囲解除</button>
            <button class="clear-btn-ja" onclick="saveLoop('file')" style="border: 1px solid var(--primary-color);"><span class="material-icons" style="font-size:16px;">bookmark_add</span> ループ保存</button>
        </div>
        <div id="loopListFile" class="loop-list-container"></div>
        
        <div class="transport-controls">
            <button class="btn-ctrl active" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:35px;">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="btn-ctrl" id="speedUpToggleBtn" onclick="toggleFeature('speedup')"><span class="material-icons">speed</span></button>
        </div>

        <div class="panel panel-rec">
            <div class="row">
                <span style="font-size:0.65rem; color:var(--recording-red); font-weight:bold; letter-spacing:0.5px;">SELF-RECORDING CHECK</span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button id="soloBtn" class="solo-btn" onclick="toggleSolo()">S</button>
                    <button class="btn-ctrl rec-btn" id="recBtn" onclick="toggleRecording()"><span class="material-icons" id="recIcon" style="font-size:20px;">mic</span></button>
                </div>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
            <div id="recControls" style="display:none; justify-content:center; gap:8px; margin-top:4px;">
                <button class="clear-btn-ja" onclick="playRecording()"><span class="material-icons" style="font-size:14px;">play_circle</span> 録音再生</button>
                <button class="clear-btn-ja" onclick="deleteRecording()" style="color:#ff5555;"><span class="material-icons" style="font-size:14px;">delete</span> 削除</button>
            </div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div class="row" style="margin-bottom:12px; gap:8px;">
            <input type="text" id="ytUrl" placeholder="YouTube URLをペースト" style="flex-grow:1; background:#181818; border:1px solid var(--border-color); color:#fff; padding:10px; border-radius:8px; font-size:0.85rem;">
            <button class="clear-btn-ja" onclick="loadYoutube()" style="background:var(--primary-color); color:#121212; font-weight:bold; height:40px;">LOAD</button>
        </div>
        <div id="ytPlayerContainer"></div>
        <div class="waveform-label" style="margin-top:10px;">
            <span id="ytTimeDisplay" class="time-display">00:00 / 00:00</span>
            <div style="display:flex; gap:10px;">
                <button class="clear-btn-ja" onclick="setYTLoop('start')">IN</button>
                <button class="clear-btn-ja" onclick="setYTLoop('end')">OUT</button>
            </div>
        </div>
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
            <button class="clear-btn-ja" onclick="clearYTLoop()"><span class="material-icons" style="font-size:16px;">layers_clear</span> 範囲解除</button>
            <button class="clear-btn-ja" onclick="saveLoop('yt')" style="border: 1px solid var(--primary-color);"><span class="material-icons" style="font-size:16px;">bookmark_add</span> ループ保存</button>
        </div>
        <div id="loopListYT" class="loop-list-container"></div>
    </div>

    <div class="panel">
        <div class="row">
            <div style="min-width:110px;">
                <span id="speedLabel" style="font-size:0.8rem; font-weight:bold;">SPEED</span>
                <button class="reset-btn" onclick="resetSetting('speed', 1.0)">RESET</button>
            </div>
            <input type="range" id="speed" min="0.5" max="1.5" step="0.05" value="1.0">
            <span class="val-display" id="speedVal">1.00x</span>
        </div>
        <div class="row">
            <div style="min-width:110px;">
                <span id="pitchLabel" style="font-size:0.8rem; font-weight:bold;">PITCH</span>
                <button class="reset-btn" onclick="resetSetting('pitch', 0)">RESET</button>
            </div>
            <input type="range" id="pitch" min="-12" max="12" step="1" value="0">
            <span class="val-display" id="pitchVal">0 semi</span>
        </div>
    </div>
</div>

<script>
    // --- Firebase Setup ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- State Management ---
    let wavesurfer, wsRegions, recWavesurfer;
    let audioContext, mediaRecorder, chunks = [], recordedUrl = null;
    let isRecording = false, isSolo = false, isCountEnabled = true, isSpeedUpEnabled = false;
    let ytPlayer = null, ytLoop = { start: null, end: null }, ytInterval = null;
    let isSubscribed = false, currentUser = null;

    // 無料開放する会員ID (UID)
    const freeMemberIDs = ["YOUR_MEMBER_ID"]; 

    // --- Auth Functions (修正版：確実なクリック反応) ---
    const loginBtn = document.getElementById('loginBtnTrigger');
    if (loginBtn) {
        loginBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                console.error("Login Error:", err);
                alert("ログインに失敗しました: " + err.message);
            });
        });
    }

    function logout() { auth.signOut().then(() => location.reload()); }

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('userInfoDisplay').style.display = 'flex';
            document.getElementById('userName').innerText = user.displayName || 'User';
            
            // 会員権限チェック
            if (freeMemberIDs.includes(user.uid)) {
                isSubscribed = true;
            } else {
                const snap = await db.collection('users').doc(user.uid).get();
                isSubscribed = snap.exists && snap.data().isSubscribed;
            }

            if (isSubscribed) {
                document.getElementById('ytLock').style.display = 'none';
            }
            loadSavedLoops();
        } else {
            document.getElementById('auth-overlay').style.display = 'flex';
        }
    });

    // --- Core Audio Logic ---
    function initAudioContext() { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); }

    function startApp() {
        wavesurfer = WaveSurfer.create({
            container: '#waveform', waveColor: '#555', progressColor: '#d4a373',
            cursorColor: '#fff', barWidth: 2, height: 120, minPxPerSec: 100
        });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        recWavesurfer = WaveSurfer.create({ container: '#rec-waveform', waveColor: '#ff4444', progressColor: '#ff8888', height: 80 });

        setupEventListeners();
    }

    function setupEventListeners() {
        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if (file) {
                wavesurfer.load(URL.createObjectURL(file));
                document.getElementById('fileSelectBtn').innerText = file.name;
                document.getElementById('loadStatus').innerText = "LOADING...";
            }
        };

        wavesurfer.on('ready', () => {
            document.getElementById('loadStatus').innerText = "READY";
            document.getElementById('totalTime').innerText = fmt(wavesurfer.getDuration());
        });

        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if(r && t >= r.end) {
                wavesurfer.setTime(r.start);
                if (isSpeedUpEnabled) {
                    const s = document.getElementById('speed');
                    s.value = Math.min(1.5, parseFloat(s.value) + 0.05).toFixed(2);
                    applySettings();
                }
            }
        });

        document.getElementById('playBtn').onclick = async () => {
            initAudioContext();
            if (wavesurfer.isPlaying()) wavesurfer.pause();
            else {
                const region = wsRegions.getRegions()[0];
                if (isCountEnabled && region) wavesurfer.setTime(region.start);
                await runCountdown();
                applySettings();
                wavesurfer.play();
            }
        };

        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');

        document.getElementById('zoomSlider').oninput = e => wavesurfer.zoom(parseFloat(e.target.value));
        document.getElementById('mainVolume').oninput = e => {
            wavesurfer.setVolume(e.target.value);
            document.getElementById('mainVolTxt').innerText = Math.round(e.target.value*100)+'%';
        };
        document.getElementById('speed').oninput = applySettings;
        document.getElementById('pitch').oninput = applySettings;
    }

    function applySettings() {
        const s = parseFloat(document.getElementById('speed').value);
        const p = parseFloat(document.getElementById('pitch').value);
        wavesurfer.setPlaybackRate(s, true);
        document.getElementById('speedVal').innerText = s.toFixed(2) + 'x';
        document.getElementById('pitchVal').innerText = p + ' semi';
    }

    async function runCountdown() {
        if (!isCountEnabled) return;
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'block';
        for (let i = 3; i > 0; i--) {
            overlay.innerText = i;
            await new Promise(r => setTimeout(r, 600));
        }
        overlay.style.display = 'none';
    }

    // --- Recording & UI Functions ---
    async function toggleRecording() {
        if (!isRecording) {
            initAudioContext();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
                recordedUrl = URL.createObjectURL(blob);
                recWavesurfer.load(recordedUrl);
                document.getElementById('rec-waveform-wrapper').style.display = 'block';
                document.getElementById('recControls').style.display = 'flex';
                chunks = [];
            };
            mediaRecorder.start();
            isRecording = true;
            document.getElementById('recBtn').classList.add('recording');
        } else {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('recBtn').classList.remove('recording');
        }
    }

    function playRecording() { recWavesurfer.play(); }
    function deleteRecording() { recWavesurfer.empty(); document.getElementById('rec-waveform-wrapper').style.display = 'none'; }
    function toggleSolo() { isSolo = !isSolo; document.getElementById('soloBtn').classList.toggle('active', isSolo); wavesurfer.setVolume(isSolo ? 0 : 0.8); }
    function toggleFeature(t) { if(t==='count'){ isCountEnabled=!isCountEnabled; document.getElementById('countToggleBtn').classList.toggle('active'); } else { isSpeedUpEnabled=!isSpeedUpEnabled; document.getElementById('speedUpToggleBtn').classList.toggle('active'); }}

    function switchMode(m) {
        if (m === 'yt' && !isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + m).classList.add('active');
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.getElementById(m + '-section').classList.add('active');
        if (m === 'yt') initYoutube();
    }

    // --- YouTube Logic ---
    function initYoutube() {
        if (ytPlayer) return;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('ytPlayerContainer', {
                height: '100%', width: '100%',
                playerVars: { 'playsinline': 1 },
                events: { 'onStateChange': e => { if(e.data === YT.PlayerState.ENDED && ytLoop.start!==null) ytPlayer.seekTo(ytLoop.start); } }
            });
        };
    }

    function loadYoutube() {
        const url = document.getElementById('ytUrl').value;
        const id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
        if (id && ytPlayer) { ytPlayer.loadVideoById(id); startYTTracking(); }
    }

    function startYTTracking() {
        ytInterval = setInterval(() => {
            if (ytPlayer && ytPlayer.getCurrentTime) {
                const curr = ytPlayer.getCurrentTime();
                document.getElementById('ytTimeDisplay').innerText = fmt(curr) + ' / ' + fmt(ytPlayer.getDuration());
                if (ytLoop.start !== null && (curr >= ytLoop.end || curr < ytLoop.start)) ytPlayer.seekTo(ytLoop.start);
            }
        }, 500);
    }

    function setYTLoop(t) { ytLoop[t] = ytPlayer.getCurrentTime(); }
    function clearYTLoop() { ytLoop = { start: null, end: null }; }

    // --- Helpers ---
    function fmt(s) { const m=Math.floor(s/60), sec=Math.floor(s%60); return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
    function toggleMenu(s) { document.getElementById('sideMenu').classList.toggle('open', s); document.getElementById('menuOverlay').style.display = s ? 'block' : 'none'; }
    function resetSetting(id, v) { document.getElementById(id).value = v; applySettings(); }
    function closeSubOverlay() { document.getElementById('subscription-overlay').style.display = 'none'; }

    // --- Firestore Loops ---
    async function saveLoop(type) {
        if (!currentUser) return;
        let data = {};
        if (type === 'file') {
            const r = wsRegions.getRegions()[0];
            if (!r) return;
            data = { name: document.getElementById('fileSelectBtn').innerText, start: r.start, end: r.end, type: 'file' };
        } else {
            if (ytLoop.start === null) return;
            data = { name: "YT Loop", start: ytLoop.start, end: ytLoop.end, type: 'yt' };
        }
        await db.collection('users').doc(currentUser.uid).collection('loops').add(data);
        loadSavedLoops();
    }

    async function loadSavedLoops() {
        if (!currentUser) return;
        const snap = await db.collection('users').doc(currentUser.uid).collection('loops').get();
        const containerF = document.getElementById('loopListFile'), containerY = document.getElementById('loopListYT');
        containerF.innerHTML = ''; containerY.innerHTML = '';
        snap.forEach(doc => {
            const d = doc.data();
            const btn = document.createElement('button');
            btn.className = 'loop-btn-main'; btn.innerText = `${fmt(d.start)} - ${fmt(d.end)}`;
            btn.onclick = () => {
                if (d.type === 'file') {
                    wsRegions.clearRegions();
                    wsRegions.addRegion({ start: d.start, end: d.end, color: 'rgba(212, 163, 115, 0.3)' });
                    wavesurfer.setTime(d.start);
                } else {
                    ytLoop = { start: d.start, end: d.end }; ytPlayer.seekTo(d.start);
                }
            };
            if (d.type === 'file') containerF.appendChild(btn); else containerY.appendChild(btn);
        });
    }

    window.addEventListener('DOMContentLoaded', startApp);
</script>
</body>
