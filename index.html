<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v2.0 - Studio Elite</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary: #d4a373;
            --primary-glow: rgba(212, 163, 115, 0.3);
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-light: #252525;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --recording: #ff4757;
            --ai: #8257e5;
            --border: #333333;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Header --- */
        header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .brand { font-weight: 800; letter-spacing: 2px; font-size: 1rem; color: var(--primary); }
        
        /* --- Layout Container --- */
        .container { 
            flex: 1;
            width: 100%; max-width: 800px; margin: 0 auto; 
            padding: 20px; padding-bottom: 180px; /* 余白確保 */
        }

        /* --- Tabs --- */
        .tabs {
            display: flex; background: var(--surface);
            padding: 4px; border-radius: 12px; margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .tab {
            flex: 1; padding: 12px; text-align: center; border-radius: 8px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-dim);
            transition: 0.2s;
        }
        .tab.active { background: var(--primary); color: var(--bg); }

        /* --- Panels --- */
        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* --- Waveform Section --- */
        #waveform-wrapper, #rec-waveform-wrapper {
            background: #000; border-radius: 12px; position: relative;
            margin: 15px 0; overflow: hidden; border: 1px solid var(--border);
        }
        #rec-waveform-wrapper { border-color: var(--recording); display: none; }

        .time-info {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 10px;
        }
        .current-time { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--primary); }
        .total-time { font-size: 0.9rem; color: var(--text-dim); }

        /* --- Controls & Sliders --- */
        .control-row { margin-bottom: 15px; }
        .label-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; }
        .val-badge { color: var(--primary); font-weight: bold; }

        input[type="range"] {
            width: 100%; -webkit-appearance: none; background: var(--surface-light);
            height: 8px; border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px; background: var(--primary);
            border-radius: 50%; box-shadow: 0 0 10px var(--primary-glow);
        }

        /* --- Buttons --- */
        .btn {
            background: var(--surface-light); border: 1px solid var(--border);
            color: var(--text); padding: 10px 16px; border-radius: 8px;
            font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: var(--bg); border: none; font-weight: bold; }
        .btn-outline { border: 1px solid var(--primary); color: var(--primary); background: transparent; }
        .btn-ai { border-color: var(--ai); color: var(--ai); }

        /* --- Floating Transport (Ergonomics) --- */
        .transport-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px 20px calc(20px + var(--safe-bottom));
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000;
        }

        .play-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: var(--primary); color: var(--bg);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow); border: none;
        }
        .round-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--surface-light); color: var(--text);
            display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);
        }
        .round-btn.active { color: var(--primary); border-color: var(--primary); }
        .rec-trigger.recording { background: var(--recording); color: white; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* --- Badges & Lists --- */
        .loop-list { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; margin-top: 10px; }
        .loop-badge {
            background: var(--surface-light); padding: 8px 12px; border-radius: 20px;
            border: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
            white-space: nowrap; font-size: 0.8rem;
        }

        /* --- YouTube UI --- */
        #ytPlayerContainer { 
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; 
            overflow: hidden; border: 1px solid var(--border);
        }

        /* --- Overlay & Modals --- */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; background: var(--surface);
            border: 1px solid var(--primary); border-radius: 20px; padding: 25px;
            z-index: 2000; display: none; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        #countdown-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; font-weight: 900; color: var(--primary);
            text-shadow: 0 0 30px var(--primary-glow); z-index: 10; pointer-events: none;
        }

        /* --- Utils --- */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="brand">AMS STUDIO ELITE</div>
    <div style="display: flex; gap: 10px;">
        <button class="round-btn" onclick="toggleMenu(true)"><span class="material-icons">settings</span></button>
    </div>
</header>

<div class="container">
    <div class="tabs">
        <div class="tab active" id="tab-file" onclick="switchMode('file')">AUDIO FILE</div>
        <div class="tab" id="tab-yt" onclick="switchMode('yt')">YOUTUBE</div>
    </div>

    <div id="file-section">
        <div class="card">
            <label for="audioFile" class="btn btn-primary" style="justify-content: center; margin-bottom: 15px;">
                <span class="material-icons">upload_file</span>
                <span id="fileSelectBtn">SELECT AUDIO</span>
            </label>
            <input type="file" id="audioFile" accept="audio/*" class="hidden">

            <div class="time-info">
                <div class="current-time" id="currentTime">00:00</div>
                <div class="total-time" id="totalTime">/ 00:00</div>
            </div>

            <div id="waveform-wrapper">
                <div id="countdown-overlay"></div>
                <div id="waveform"></div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="loadStatus" style="font-size:0.7rem; color:var(--text-dim);">READY</span>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-outline" style="padding: 5px 10px; font-size: 0.7rem;" onclick="wsRegions.clearRegions()">CLEAR LOOP</button>
                    <button class="btn btn-outline" style="padding: 5px 10px; font-size: 0.7rem;" onclick="saveLoop('file')">SAVE LOOP</button>
                </div>
            </div>
            <div id="loopListFile" class="loop-list"></div>
        </div>

        <div class="card">
            <div class="control-row">
                <div class="label-row"><span>PLAYBACK SPEED</span><span class="val-badge" id="spTxt">BPM ---</span></div>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
            </div>
            <div class="control-row">
                <div class="label-row"><span>PITCH SHIFT</span><span class="val-badge" id="pitchTxt">±0</span></div>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
            </div>
            <div class="control-row" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
                <div class="label-row"><span>MAIN VOLUME</span><span id="mainVolTxt">80%</span></div>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
            </div>
        </div>

        <div class="card" style="border-color: var(--recording);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <span style="color:var(--recording); font-weight:800; font-size:0.75rem; letter-spacing:1px;">SESSION RECORDER</span>
                <button id="soloBtn" class="btn" style="padding: 4px 10px;" onclick="toggleSolo()">SOLO (S)</button>
            </div>
            
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
            
            <div id="recControls" class="hidden">
                <div class="control-row">
                    <div class="label-row"><span>REC VOLUME</span><span id="recVolTxt">100%</span></div>
                    <input type="range" id="recVolume" min="0" max="1.5" step="0.05" value="1.0">
                </div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button class="btn" style="flex:1" onclick="playRecording()" id="playRecBtn"><span class="material-icons">play_circle</span> PLAY REC</button>
                    <button class="btn btn-ai" style="flex:1" onclick="runAIAdvice()"><span class="material-icons">psychology</span> AI ADVICE</button>
                    <button class="btn" style="color:var(--recording)" onclick="deleteRecording()"><span class="material-icons">delete</span></button>
                </div>
            </div>
            <div id="aiResultCard" class="hidden" style="margin-top:15px; padding:15px; background:rgba(130,87,229,0.1); border-radius:12px; border:1px solid var(--ai);">
                <div style="color:var(--ai); font-weight:bold; font-size:0.8rem; margin-bottom:5px;">AI FEEDBACK</div>
                <div id="aiAdviceText" style="font-size:0.85rem; line-height:1.4;"></div>
            </div>
        </div>
    </div>

    <div id="yt-section" class="hidden">
        <div class="card">
            <div style="display:flex; gap:8px; margin-bottom:15px;">
                <input type="text" id="ytUrl" placeholder="Paste YouTube URL..." style="flex:1; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; color:white;">
                <button class="btn btn-primary" onclick="loadYouTube()">LOAD</button>
            </div>
            <div id="ytPlayerContainer"><div id="player"></div></div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:20px;">
                <div style="text-align:center">
                    <button class="btn btn-outline" style="width:100%; justify-content:center; margin-bottom:8px;" onclick="setLoopPoint('start')">START</button>
                    <span id="loopStartTxt" class="val-badge">00:00</span>
                </div>
                <div style="text-align:center">
                    <button class="btn btn-outline" style="width:100%; justify-content:center; margin-bottom:8px;" onclick="setLoopPoint('end')">END</button>
                    <span id="loopEndTxt" class="val-badge">00:00</span>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button id="toggleLoopBtn" class="btn" style="flex:1; justify-content:center;" onclick="toggleLoop()">LOOP: OFF</button>
                <button class="btn btn-primary" onclick="saveLoop('yt')"><span class="material-icons">bookmark</span> SAVE</button>
            </div>
            <div id="loopListYT" class="loop-list"></div>
        </div>
    </div>
</div>

<div class="transport-bar">
    <button class="round-btn" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
    <button class="round-btn" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
    
    <button class="play-btn" id="playBtn">
        <span class="material-icons" id="playIcon" style="font-size: 40px;">play_arrow</span>
    </button>
    
    <button class="round-btn" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
    <button class="round-btn rec-trigger" id="recBtn" onclick="toggleRecording()"><span class="material-icons" id="recIcon">mic</span></button>
</div>

<div id="settingsMenu" class="modal">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <span style="font-weight:bold; color:var(--primary);">SETTINGS</span>
        <span class="material-icons" onclick="toggleMenu(false)" style="cursor:pointer">close</span>
    </div>
    <div class="control-row">
        <div class="label-row">LANGUAGE</div>
        <select id="langSelect" style="width:100%; padding:10px; background:var(--surface-light); color:white; border:1px solid var(--border); border-radius:8px;" onchange="changeLanguage()">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </div>
    <div class="control-row" style="margin-top:20px;">
        <div class="label-row">FEATURES</div>
        <button class="btn" style="width:100%; margin-bottom:10px;" id="speedUpToggleBtn" onclick="toggleFeature('speedup')">AUTO SPEED UP (OFF)</button>
    </div>
</div>

<script>
    // ---------------------------------------------------------
    // Logic & Core functionality (Maintaining all features)
    // ---------------------------------------------------------
    const translations = {
        ja: {
            ready: "準備完了", analyzing: "解析中...", loopOff: "ループ: OFF", loopOn: "ループ: ON",
            fileSelect: "ファイルを選択", recPlay: "録音再生", recStop: "再生停止",
            speedUpOn: "自動スピードアップ (ON)", speedUpOff: "自動スピードアップ (OFF)"
        },
        en: {
            ready: "READY", analyzing: "ANALYZING...", loopOff: "LOOP: OFF", loopOn: "LOOP: ON",
            fileSelect: "SELECT AUDIO", recPlay: "PLAY REC", recStop: "STOP REC",
            speedUpOn: "AUTO SPEED UP (ON)", speedUpOff: "AUTO SPEED UP (OFF)"
        }
    };

    let wavesurfer, wsRegions, recWavesurfer, ytPlayer, loopInterval;
    let loopStart = 0, loopEnd = 0, isLooping = false, currentMode = 'file';
    let audioCtx, firstSoundTime = 0, originalBpm = 120;
    let currentObjectURL = null, currentFileName = "";
    let isCountEnabled = true, isSpeedUpEnabled = false;
    let mediaRecorder, recordedChunks = [], isRecording = false, isSolo = false;
    let recObjectURL = null, recordedAudioBuffer = null, lastRecStartPos = 0;

    function initWavesurfer() {
        wavesurfer = WaveSurfer.create({ 
            container: '#waveform', waveColor: '#333', progressColor: '#d4a373', 
            height: 100, barWidth: 2, normalize: true, hideScrollbar: true
        });
        recWavesurfer = WaveSurfer.create({ 
            container: '#rec-waveform', waveColor: '#552222', progressColor: '#ff4757', 
            height: 60, barWidth: 2, normalize: true
        });
        
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        wsRegions.enableDragSelection({ color: 'rgba(212, 163, 115, 0.2)' });
        
        wsRegions.on('region-created', r => {
            if(wsRegions.getRegions().length > 1) wsRegions.getRegions()[0].remove();
            wavesurfer.setTime(r.start);
        });

        // Event Handlers
        wavesurfer.on('ready', () => {
            document.getElementById('totalTime').innerText = "/ " + fmt(wavesurfer.getDuration());
            applySettings();
        });
        
        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if(r && t >= r.end) { 
                wavesurfer.setTime(r.start); 
                if (isSpeedUpEnabled) {
                    const s = document.getElementById('speed');
                    s.value = Math.min(1.5, parseFloat(s.value) + 0.05).toFixed(2);
                    applySettings();
                }
                if (isRecording) toggleRecording();
            }
        });

        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
    }

    const fmt = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;

    function applySettings() {
        if (!wavesurfer) return;
        const s = parseFloat(document.getElementById('speed').value);
        const p = parseInt(document.getElementById('pitch').value);
        const media = wavesurfer.getMediaElement();
        if (media) {
            media.preservesPitch = true;
            if (media.detune !== undefined) {
                media.detune = p * 100;
                wavesurfer.setPlaybackRate(s);
            } else {
                if (p !== 0) {
                    media.preservesPitch = false;
                    wavesurfer.setPlaybackRate(s * Math.pow(2, p / 12));
                } else wavesurfer.setPlaybackRate(s);
            }
        }
        document.getElementById('spTxt').innerText = `BPM ${Math.round(originalBpm * s)}`;
        document.getElementById('pitchTxt').innerText = (p > 0 ? "+" : "") + p;
        applyVolumes();
    }

    function applyVolumes() {
        const mVol = parseFloat(document.getElementById('mainVolume').value);
        const rVol = parseFloat(document.getElementById('recVolume').value);
        wavesurfer.setMuted(isSolo);
        if (!isSolo) wavesurfer.setVolume(mVol);
        if (recWavesurfer) recWavesurfer.setVolume(rVol);
        document.getElementById('mainVolTxt').innerText = Math.round(mVol * 100) + "%";
        document.getElementById('recVolTxt').innerText = Math.round(rVol * 100) + "%";
    }

    // Toggle Modes
    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('file-section').classList.toggle('hidden', mode !== 'file');
        document.getElementById('yt-section').classList.toggle('hidden', mode !== 'yt');
        document.getElementById('tab-file').classList.toggle('active', mode === 'file');
        document.getElementById('tab-yt').classList.toggle('active', mode === 'yt');
        if(mode === 'yt' && wavesurfer) wavesurfer.pause();
    }

    // --- Recording Core ---
    async function toggleRecording() {
        if (isRecording) {
            if (mediaRecorder) mediaRecorder.stop();
            wavesurfer.pause();
            isRecording = false;
            document.getElementById('recBtn').classList.remove('recording');
            document.getElementById('recIcon').innerText = 'mic';
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    recObjectURL = URL.createObjectURL(blob);
                    const arrayBuffer = await blob.arrayBuffer();
                    const tempCtx = new AudioContext();
                    recordedAudioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                    tempCtx.close();
                    
                    document.getElementById('rec-waveform-wrapper').style.display = 'block';
                    document.getElementById('recControls').classList.remove('hidden');
                    await recWavesurfer.load(recObjectURL);
                };
                
                const startPos = wsRegions.getRegions()[0]?.start || wavesurfer.getCurrentTime();
                wavesurfer.setTime(startPos);
                lastRecStartPos = startPos;
                
                await runCountdown();
                mediaRecorder.start();
                wavesurfer.play();
                isRecording = true;
                document.getElementById('recBtn').classList.add('recording');
                document.getElementById('recIcon').innerText = 'stop';
            } catch (err) { alert("マイクへのアクセスを許可してください"); }
        }
    }

    async function runCountdown() {
        if (!isCountEnabled) return;
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'block';
        for (let i = 1; i <= 4; i++) {
            overlay.innerText = i;
            // Beep Logic
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(i === 4 ? 880 : 440, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
            await new Promise(r => setTimeout(r, 60000 / (originalBpm * parseFloat(document.getElementById('speed').value))));
        }
        overlay.style.display = 'none';
    }

    // --- YouTube API ---
    function loadYouTube() {
        const url = document.getElementById('ytUrl').value;
        const videoId = url.match(/(?:https?:\/\/)?(?:www\.)?youtu(?:be\.com\/watch\?v=|\.be\/)([\w\-\_]+)/)?.[1];
        if (videoId) {
            currentYTId = videoId;
            if (!ytPlayer) {
                ytPlayer = new YT.Player('player', {
                    videoId: videoId,
                    events: { 
                        'onStateChange': (e) => {
                            if (e.data === YT.PlayerState.PLAYING) {
                                loopInterval = setInterval(() => {
                                    if (isLooping && ytPlayer.getCurrentTime() >= loopEnd) ytPlayer.seekTo(loopStart);
                                }, 200);
                            } else clearInterval(loopInterval);
                        }
                    }
                });
            } else ytPlayer.loadVideoById(videoId);
        }
    }

    function setLoopPoint(type) {
        const now = ytPlayer.getCurrentTime();
        if (type === 'start') {
            loopStart = Math.floor(now);
            document.getElementById('loopStartTxt').innerText = fmt(loopStart);
        } else {
            loopEnd = Math.ceil(now);
            document.getElementById('loopEndTxt').innerText = fmt(loopEnd);
        }
    }

    function toggleLoop() {
        isLooping = !isLooping;
        const lang = document.getElementById('langSelect').value;
        document.getElementById('toggleLoopBtn').innerText = isLooping ? translations[lang].loopOn : translations[lang].loopOff;
        document.getElementById('toggleLoopBtn').classList.toggle('btn-primary', isLooping);
    }

    // --- Helpers & UI ---
    function toggleMenu(show) {
        document.getElementById('settingsMenu').style.display = show ? 'block' : 'none';
    }

    function toggleFeature(type) {
        const lang = document.getElementById('langSelect').value;
        if (type === 'count') {
            isCountEnabled = !isCountEnabled;
            document.getElementById('countToggleBtn').classList.toggle('active', isCountEnabled);
        } else if (type === 'speedup') {
            isSpeedUpEnabled = !isSpeedUpEnabled;
            const btn = document.getElementById('speedUpToggleBtn');
            btn.innerText = isSpeedUpEnabled ? translations[lang].speedUpOn : translations[lang].speedUpOff;
            btn.classList.toggle('btn-outline', isSpeedUpEnabled);
        }
    }

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        document.getElementById('fileSelectBtn').innerText = translations[lang].fileSelect;
        document.getElementById('loadStatus').innerText = translations[lang].ready;
        toggleFeature('update'); // Refresh labels
    }

    function saveLoop(mode) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        if (!key) return;
        const start = mode === 'file' ? wsRegions.getRegions()[0]?.start : loopStart;
        const end = mode === 'file' ? wsRegions.getRegions()[0]?.end : loopEnd;
        
        let storageKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let allLoops = JSON.parse(localStorage.getItem(storageKey) || "{}");
        if (!allLoops[key]) allLoops[key] = [];
        allLoops[key].push({ start, end });
        localStorage.setItem(storageKey, JSON.stringify(allLoops));
        renderLoopList(mode);
    }

    function renderLoopList(mode) {
        const container = mode === 'file' ? document.getElementById('loopListFile') : document.getElementById('loopListYT');
        const key = mode === 'file' ? currentFileName : currentYTId;
        const storageKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        container.innerHTML = "";
        let allLoops = JSON.parse(localStorage.getItem(storageKey) || "{}");
        (allLoops[key] || []).forEach((loop, index) => {
            const badge = document.createElement('div');
            badge.className = 'loop-badge';
            badge.innerHTML = `<span>#${index+1} ${fmt(loop.start)}-${fmt(loop.end)}</span><span class="material-icons" style="font-size:14px; cursor:pointer;" onclick="deleteLoop('${mode}', ${index})">close</span>`;
            badge.onclick = (e) => {
                if(e.target.innerText === 'close') return;
                if(mode === 'file') {
                    wsRegions.clearRegions();
                    wsRegions.addRegion({ start: loop.start, end: loop.end, color: 'rgba(212, 163, 115, 0.2)' });
                    wavesurfer.setTime(loop.start);
                } else {
                    loopStart = loop.start; loopEnd = loop.end;
                    document.getElementById('loopStartTxt').innerText = fmt(loopStart);
                    document.getElementById('loopEndTxt').innerText = fmt(loopEnd);
                    ytPlayer.seekTo(loopStart);
                }
            };
            container.appendChild(badge);
        });
    }

    // Initial load
    window.addEventListener('DOMContentLoaded', () => {
        initWavesurfer();
        
        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if(file) {
                currentFileName = file.name;
                document.getElementById('fileSelectBtn').innerText = file.name;
                const url = URL.createObjectURL(file);
                wavesurfer.load(url);
                renderLoopList('file');
            }
        };

        document.getElementById('playBtn').onclick = () => {
            if (wavesurfer.isPlaying()) wavesurfer.pause();
            else wavesurfer.play();
        };

        document.getElementById('speed').oninput = applySettings;
        document.getElementById('pitch').oninput = applySettings;
        document.getElementById('mainVolume').oninput = applyVolumes;
        document.getElementById('recVolume').oninput = applyVolumes;

        // YouTube API Load
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
    });

    async function runAIAdvice() {
        const text = document.getElementById('aiAdviceText');
        document.getElementById('aiResultCard').classList.remove('hidden');
        text.innerText = "Analyzing performance...";
        setTimeout(() => {
            text.innerHTML = "<b>Rhythm:</b> Stable. Keep the consistency.<br><b>Advice:</b> Try increasing the BPM by 5% to push your technical limit.";
        }, 1500);
    }
    
    function toggleSolo() {
        isSolo = !isSolo;
        document.getElementById('soloBtn').classList.toggle('btn-primary', isSolo);
        applyVolumes();
    }
    
    function playRecording() {
        if (recWavesurfer.isPlaying()) recWavesurfer.pause();
        else {
            wavesurfer.setTime(lastRecStartPos);
            recWavesurfer.play();
            wavesurfer.play();
        }
    }
    
    function deleteRecording() {
        if(confirm("Delete recording?")) {
            document.getElementById('recControls').classList.add('hidden');
            document.getElementById('rec-waveform-wrapper').style.display = 'none';
            recWavesurfer.empty();
        }
    }
</script>

</body>
</html>
