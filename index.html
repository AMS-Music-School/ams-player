<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.3.5 - Stability Edition</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" href="icon.png?v=1.2.1" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.1">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7.7.3/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7.7.3/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d4a373;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #999999;
            --border-color: #333333;
            --header-height: 60px;
            --recording-red: #ff4444;
            --solo-yellow: #ffcc00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-height);
        }

        #auth-overlay, #subscription-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        #subscription-overlay { background: rgba(0,0,0,0.95); z-index: 6000; display: none; }
        
        .login-card {
            background: var(--panel-bg); padding: 40px 30px; border-radius: 20px;
            border: 1px solid var(--primary-color); max-width: 350px; width: 100%;
        }
        .google-btn {
            background: white; color: #757575; border: none; padding: 12px 20px;
            border-radius: 5px; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; width: 100%;
            margin-top: 20px; font-size: 1rem;
        }
        .subscribe-btn {
            background: var(--primary-color); color: #121212; border: none; padding: 15px 30px;
            border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1rem; width: 100%;
        }
        .user-info { font-size: 0.7rem; color: var(--text-dim); display: flex; align-items: center; gap: 10px; }
        .logout-btn { background: none; border: 1px solid var(--border-color); color: var(--text-dim); padding: 4px 8px; border-radius: 4px; font-size: 0.6rem; cursor: pointer; }

        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
            z-index: 2000; backdrop-filter: blur(10px);
        }
        .header-logo { color: var(--primary-color); font-weight: bold; letter-spacing: 1px; font-size: 0.9rem; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px; padding-bottom: 40px; }
        
        #waveform-wrapper, #rec-waveform-wrapper { position: relative; background: #000; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; overflow: hidden; min-height: 120px; }
        #rec-waveform-wrapper { min-height: 80px; margin-top: 8px; display: none; border: 1px solid var(--recording-red); }
        .waveform-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 5px; }
        .time-display { color: var(--primary-color); font-weight: bold; font-size: 1rem; }
        
        .panel { background: var(--panel-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .panel-rec { padding: 10px 15px; gap: 8px; border-color: rgba(255, 68, 68, 0.4); }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        input[type="range"] { flex-grow: 1; accent-color: var(--primary-color); height: 6px; min-width: 50px; -webkit-appearance: none; background: #333; border-radius: 5px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary-color); cursor: pointer; border: none; }
        .val-display { color: var(--primary-color); font-weight: bold; min-width: 70px; text-align: right; font-size: 0.95rem; }
        
        .transport-controls { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 15px 0; }
        .btn-ctrl { background: var(--panel-bg); color: var(--text-dim); border: 1px solid var(--border-color); border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .btn-ctrl.active { color: var(--primary-color); border-color: var(--primary-color); }
        .play-main { background: var(--primary-color); color: #121212 !important; width: 60px; height: 60px; border: none; }
        .rec-btn { color: var(--recording-red); border-color: #442222; width: 40px; height: 40px; }
        .rec-btn.recording { background: var(--recording-red); color: white; animation: blink 1s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .solo-btn { width: 32px; height: 32px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; background: #333; color: var(--text-dim); border: 1px solid var(--border-color); }
        .solo-btn.active { background: var(--solo-yellow); color: #000; border-color: var(--solo-yellow); }
        
        .custom-file-upload { display: block; width: 100%; padding: 12px; border: 2px dashed var(--border-color); border-radius: 10px; margin-bottom: 12px; background: #181818; color: #888; font-size: 0.8rem; text-align: center; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        input[type="file"] { display: none; }
        #countdown-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; color: var(--primary-color); font-weight: bold; z-index: 1000; display: none; text-shadow: 0 0 20px rgba(0,0,0,0.8); pointer-events: none; }
        .reset-btn { background: #333; border: none; color: #999; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; cursor: pointer; }
        
        .menu-trigger { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 5px; }
        .side-menu { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: var(--panel-bg); z-index: 3000; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.5); padding: 20px; }
        .side-menu.open { right: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        
        .mode-tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 15px; background: var(--panel-bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border-color); }
        .tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 8px; cursor: pointer; border-radius: 6px; font-size: 0.75rem; flex: 1; transition: all 0.3s ease; }
        .tab-btn.active { background: var(--primary-color); color: #121212; font-weight: bold; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        
        .clear-btn-ja { background: #333; border: none; color: var(--text-main); padding: 6px 15px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        #ytPlayerContainer { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background: #000; }
        #ytPlayerContainer iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }
        .loop-badge { background: #252525; padding: 6px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border-color); cursor: pointer; margin-bottom: 5px; }
        .loop-list-container { margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        
        /* Modal for Help */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 500px; background: var(--panel-bg); border: 1px solid var(--primary-color); border-radius: 16px; z-index: 4000; padding: 20px; box-shadow: 0 0 50px rgba(0,0,0,1); max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-card">
        <div class="header-logo" style="font-size: 1.5rem; margin-bottom: 10px;">AMS PLAYER</div>
        <p style="font-size: 0.8rem; color: var(--text-dim);">練習を同期するためにログインしてください</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G">
            Googleでログイン
        </button>
    </div>
</div>

<div id="subscription-overlay">
    <div class="login-card">
        <div class="header-logo" style="font-size: 1.5rem; margin-bottom: 10px;">PREMIUM PLAN</div>
        <p style="font-size: 0.9rem; color: var(--text-main);">この機能を利用するには<br>サブスクリプションへの登録が必要です。</p>
        <button class="subscribe-btn" onclick="redirectToCheckout()">
            サブスクリプションを開始する
        </button>
        <button class="clear-btn-ja" onclick="closeSubOverlay()" style="margin-top:15px; width:100%; justify-content:center;">閉じる</button>
    </div>
</div>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <div class="user-info" id="userInfoDisplay" style="display:none;">
        <span id="userName">Guest</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <button class="menu-trigger" onclick="toggleMenu(true)">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header" style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:15px;">
        <span style="font-weight:bold; color:var(--primary-color);">MENU</span>
        <button class="menu-trigger" onclick="toggleMenu(false)"><span class="material-icons">close</span></button>
    </div>
    <span style="font-size:0.75rem; color:var(--primary-color); margin:15px 0 10px; display:block;">Language Settings</span>
    <select id="langSelect" onchange="changeLanguage()" style="width:100%; padding:10px; background:#333; color:white; border:none; border-radius:8px;">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>
</div>

<div class="container">
    <div class="title-area" style="text-align:center; margin-bottom:15px;"><h2>AMS Practice Player</h2></div>

    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File Mode</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube Mode</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="custom-file-upload" id="fileSelectBtn">ファイルを選択</label>
        <input type="file" id="audioFile" accept="audio/*">

        <div class="waveform-label">
            <span id="loadStatus">READY</span>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="material-icons" style="font-size:18px;">zoom_in</span>
                <input type="range" id="zoomSlider" min="0" max="500" value="100" style="width:80px;">
                <button class="reset-btn" id="resetZoomBtn">FIT</button>
            </div>
            <span class="time-display"><span id="currentTime">00:00</span> / <span id="totalTime">00:00</span></span>
        </div>
        
        <div id="waveform-wrapper">
            <div id="countdown-overlay"></div>
            <div id="waveform"></div>
        </div>

        <div class="panel" style="margin-top:-5px; padding: 10px 15px;">
            <div class="row">
                <span class="material-icons" style="font-size:18px; color:var(--text-dim);">volume_up</span>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
                <span id="mainVolTxt" style="font-size:0.75rem; min-width:35px; text-align:right;">80%</span>
            </div>
        </div>

        <div class="clear-btn-container" style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
            <button class="clear-btn-ja" onclick="wsRegions.clearRegions()" id="clearRangeBtn"><span class="material-icons" style="font-size:16px;">layers_clear</span> 範囲解除</button>
            <button class="clear-btn-ja" onclick="saveLoop('file')" id="saveLoopBtn" style="border: 1px solid var(--primary-color);"><span class="material-icons" style="font-size:16px;">bookmark_add</span> 保存</button>
        </div>
        <div id="loopListFile" class="loop-list-container"></div>
        
        <div class="transport-controls">
            <button class="btn-ctrl active" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:35px;">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="btn-ctrl" id="speedUpToggleBtn" onclick="toggleFeature('speedup')"><span class="material-icons">speed</span></button>
        </div>

        <div class="panel panel-rec">
            <div class="row">
                <span style="font-size:0.65rem; color:var(--recording-red); font-weight:bold;">SELF-RECORDING CHECK</span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <button id="soloBtn" class="solo-btn" onclick="toggleSolo()">S</button>
                    <button class="btn-ctrl rec-btn" id="recBtn" onclick="toggleRecording()"><span class="material-icons" id="recIcon" style="font-size:20px;">mic</span></button>
                </div>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
            <div id="recVolControl" style="display:none; flex-direction:column; gap:8px;">
                <div class="row">
                    <span class="material-icons" style="font-size:18px; color:var(--recording-red);">hearing</span>
                    <input type="range" id="recVolume" min="0" max="1.5" step="0.05" value="1.0">
                    <span id="recVolTxt" style="font-size:0.75rem; min-width:35px; text-align:right;">100%</span>
                </div>
            </div>
            <div class="row" id="recControls" style="display:none; justify-content:center; gap:8px; margin-top:4px;">
                <button class="clear-btn-ja" onclick="playRecording()" id="playRecBtn"><span class="material-icons" style="font-size:14px;">play_circle</span> 録音再生</button>
                <button class="clear-btn-ja" onclick="deleteRecording()" style="color:#ff5555;"><span class="material-icons" style="font-size:14px;">delete</span> 削除</button>
            </div>
        </div>

        <div class="panel">
            <div class="row">
                <div style="min-width:65px; font-weight:bold; color:var(--text-dim); font-size:0.75rem;">BPM <button class="reset-btn" onclick="resetSetting('speed', 1.0)">Reset</button></div>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <span id="spTxt" class="val-display">BPM ---</span>
            </div>
            <div class="row">
                <div style="min-width:65px; font-weight:bold; color:var(--text-dim); font-size:0.75rem;">Pitch <button class="reset-btn" onclick="resetSetting('pitch', 0)">Reset</button></div>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <span id="pitchTxt" class="val-display">±0</span>
            </div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div style="display:flex; gap:8px; margin-bottom:10px; background:var(--panel-bg); padding:10px; border-radius:10px; border: 1px solid var(--border-color);">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex-grow:1; padding:10px; border:1px solid var(--border-color); background:#000; color:#fff; border-radius:6px; font-size:0.8rem;">
            <button class="tab-btn active" style="flex:0; min-width:60px;" onclick="loadYouTube()">LOAD</button>
        </div>
        <div id="ytPlayerContainer"><div id="player"></div></div>
        <div class="panel" style="margin-top:15px;">
            <div class="row" style="justify-content: center; gap: 10px;">
                <button class="tab-btn active" style="background:#333; color:white;" onclick="setLoopPoint('start')">START: <span id="loopStartTxt">00:00</span></button>
                <button class="tab-btn active" style="background:#333; color:white;" onclick="setLoopPoint('end')">END: <span id="loopEndTxt">00:00</span></button>
            </div>
            <div class="row" style="justify-content: center; gap: 10px;">
                <button id="toggleLoopBtn" class="tab-btn" onclick="toggleLoop()">LOOP OFF</button>
                <button class="clear-btn-ja" onclick="saveLoop('yt')" style="border: 1px solid var(--primary-color);">保存</button>
            </div>
        </div>
        <div id="loopListYT" class="loop-list-container"></div>
    </div>
</div>

<script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311",
        measurementId: "G-GYHLQKN6SS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isSubscribed = false;

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(e => alert("Error: " + e.message));
    }
    function logout() { auth.signOut(); }
    function redirectToCheckout() { window.location.href = "https://your-payment-link.com"; }
    function closeSubOverlay() { document.getElementById('subscription-overlay').style.display = 'none'; }

    auth.onAuthStateChanged(async user => {
        const authOverlay = document.getElementById('auth-overlay');
        const userInfo = document.getElementById('userInfoDisplay');
        if (user) {
            authOverlay.style.display = 'none';
            const doc = await db.collection('School Member').doc(user.email).get();
            isSubscribed = doc.exists && doc.data().isSubscribed === true;
            userInfo.style.display = 'flex';
            document.getElementById('userName').innerText = user.displayName;
            renderLoopList(currentMode);
        } else {
            authOverlay.style.display = 'flex';
            userInfo.style.display = 'none';
            isSubscribed = false;
        }
    });

    // --- Core Variables ---
    let wavesurfer, wsRegions, recWavesurfer, ytPlayer, loopInterval;
    let loopStart = 0, loopEnd = 0, isLooping = false, currentMode = 'file';
    let audioCtx = null, firstSoundTime = 0, originalBpm = 120;
    let currentObjectURL = null, currentFileName = "", currentYTId = "";
    let isCountEnabled = true, isSpeedUpEnabled = false;
    let mediaRecorder, recordedChunks = [], isRecording = false, isSolo = false, recObjectURL = null, lastRecStartPos = 0;

    // --- Audio Initializer ---
    function initAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    // --- UI Logic ---
    function toggleMenu(isOpen) {
        document.getElementById('sideMenu').classList.toggle('open', isOpen);
        document.getElementById('menuOverlay').style.display = isOpen ? 'block' : 'none';
    }

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.getElementById(mode + '-section').classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');
        if(mode === 'file' && ytPlayer) ytPlayer.pauseVideo();
        if(mode === 'yt' && wavesurfer) wavesurfer.pause();
        renderLoopList(mode);
    }

    const fmt = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;

    // --- Audio Analysis ---
    async function analyzeAudio(blob) {
        const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await blob.arrayBuffer();
        const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
        const data = audioBuffer.getChannelData(0);
        let skip = 0; for (let i = 0; i < data.length; i += 100) { if (Math.abs(data[i]) > 0.015) { skip = i / audioBuffer.sampleRate; break; } }
        firstSoundTime = skip;
        const bpm = detectBPM(audioBuffer);
        if (bpm > 0) { originalBpm = Math.round(bpm); updateBpmDisplay(); }
        tempCtx.close();
        if(wavesurfer) wavesurfer.setTime(firstSoundTime);
    }

    function detectBPM(buffer) {
        const data = buffer.getChannelData(0), step = 200, energy = [];
        for (let i = 0; i < data.length; i += step) {
            let sum = 0; for(let j=0; j<step && (i+j)<data.length; j++) sum += data[i+j] * data[i+j];
            energy.push(Math.sqrt(sum/step));
        }
        let bestBpm = 0, maxCorrelation = 0;
        const minI = Math.floor((60/200)*(buffer.sampleRate/step)), maxI = Math.floor((60/60)*(buffer.sampleRate/step));
        for (let interval = minI; interval <= maxI; interval++) {
            let correlation = 0; for (let i = 0; i < Math.min(energy.length - interval, 10000); i++) correlation += energy[i] * energy[i + interval];
            if (correlation > maxCorrelation) { maxCorrelation = correlation; bestBpm = 60 / (interval * step / buffer.sampleRate); }
        }
        return (bestBpm < 50 || bestBpm > 250) ? 0 : bestBpm;
    }

    function updateBpmDisplay() {
        const currentSpeed = parseFloat(document.getElementById('speed').value);
        document.getElementById('spTxt').innerText = "BPM " + Math.round(originalBpm * currentSpeed);
    }

    // --- Recording ---
    async function toggleRecording() {
        if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        initAudioContext();
        if (isRecording) {
            mediaRecorder.stop(); wavesurfer.pause(); isRecording = false;
            document.getElementById('recBtn').classList.remove('recording');
            document.getElementById('recIcon').innerText = 'mic';
        } else {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            recordedChunks = [];
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                recObjectURL = URL.createObjectURL(blob);
                document.getElementById('rec-waveform-wrapper').style.display = 'block';
                document.getElementById('recVolControl').style.display = 'flex';
                document.getElementById('recControls').style.display = 'flex';
                recWavesurfer.load(recObjectURL);
            };
            const startPos = wsRegions.getRegions()[0] ? wsRegions.getRegions()[0].start : wavesurfer.getCurrentTime();
            wavesurfer.setTime(startPos); lastRecStartPos = startPos;
            if (isCountEnabled) await runCountdown();
            wavesurfer.play(); mediaRecorder.start(); isRecording = true;
            document.getElementById('recBtn').classList.add('recording');
            document.getElementById('recIcon').innerText = 'stop';
        }
    }

    async function runCountdown() {
        const interval = 60000 / (originalBpm * parseFloat(document.getElementById('speed').value));
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'block';
        for (let i = 1; i <= 4; i++) {
            overlay.innerText = i;
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.frequency.value = i === 4 ? 880 : 440; g.gain.value = 0.1;
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            await new Promise(r => setTimeout(r, interval));
        }
        overlay.style.display = 'none';
    }

    function playRecording() { 
        if(recWavesurfer.isPlaying()){ recWavesurfer.pause(); wavesurfer.pause(); }
        else { wavesurfer.setTime(lastRecStartPos + recWavesurfer.getCurrentTime()); recWavesurfer.play(); wavesurfer.play(); }
    }
    function deleteRecording() { if(confirm("削除しますか？")){ recWavesurfer.empty(); document.getElementById('recControls').style.display='none'; } }
    function toggleSolo() { isSolo = !isSolo; document.getElementById('soloBtn').classList.toggle('active', isSolo); applyVolumes(); }
    function toggleFeature(t) { 
        if(t==='count') { isCountEnabled = !isCountEnabled; document.getElementById('countToggleBtn').classList.toggle('active', isCountEnabled); }
        if(t==='speedup') { if(!isSubscribed){ document.getElementById('subscription-overlay').style.display='flex'; return; } isSpeedUpEnabled = !isSpeedUpEnabled; document.getElementById('speedUpToggleBtn').classList.toggle('active', isSpeedUpEnabled); }
    }

    function applyVolumes() {
        const mVol = parseFloat(document.getElementById('mainVolume').value);
        const rVol = parseFloat(document.getElementById('recVolume').value);
        if(wavesurfer) { wavesurfer.setMuted(isSolo); wavesurfer.setVolume(mVol); }
        if(recWavesurfer) recWavesurfer.setVolume(rVol);
        document.getElementById('mainVolTxt').innerText = Math.round(mVol*100) + "%";
        document.getElementById('recVolTxt').innerText = Math.round(rVol*100) + "%";
    }

    // --- YouTube ---
    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    function loadYouTube() {
        const url = document.getElementById('ytUrl').value;
        const vid = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.includes('be/') ? url.split('be/')[1] : null;
        if (vid) {
            currentYTId = vid;
            if (ytPlayer) ytPlayer.loadVideoById(vid);
            else ytPlayer = new YT.Player('player', { videoId: vid, playerVars: { playsinline: 1 }, events: { onStateChange: e => {
                if(e.data === YT.PlayerState.PLAYING) {
                    clearInterval(loopInterval);
                    loopInterval = setInterval(() => { if(isLooping && ytPlayer.getCurrentTime() >= loopEnd) ytPlayer.seekTo(loopStart); }, 200);
                }
            }}});
            renderLoopList('yt');
        }
    }
    function setLoopPoint(t) { 
        const now = ytPlayer.getCurrentTime(); 
        if(t==='start'){ loopStart = now; document.getElementById('loopStartTxt').innerText = fmt(now); }
        else { loopEnd = now; document.getElementById('loopEndTxt').innerText = fmt(now); }
    }
    function toggleLoop() { isLooping = !isLooping; document.getElementById('toggleLoopBtn').innerText = isLooping ? "LOOP ON" : "LOOP OFF"; document.getElementById('toggleLoopBtn').classList.toggle('active', isLooping); }

    // --- Loop Storage ---
    function saveLoop(mode) {
        if(!isSubscribed){ document.getElementById('subscription-overlay').style.display='flex'; return; }
        const key = mode === 'file' ? currentFileName : currentYTId;
        if(!key) return;
        const sKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let loops = JSON.parse(localStorage.getItem(sKey) || "{}");
        if(!loops[key]) loops[key] = [];
        let start, end;
        if(mode === 'file') { const r = wsRegions.getRegions()[0]; if(!r) return; start = r.start; end = r.end; }
        else { start = loopStart; end = loopEnd; }
        loops[key].push({start, end});
        localStorage.setItem(sKey, JSON.stringify(loops));
        renderLoopList(mode);
    }

    function renderLoopList(mode) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const sKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        const container = mode === 'file' ? document.getElementById('loopListFile') : document.getElementById('loopListYT');
        if(!container) return; container.innerHTML = ""; if(!key) return;
        const loops = JSON.parse(localStorage.getItem(sKey) || "{}")[key] || [];
        loops.forEach((l, i) => {
            const b = document.createElement('div'); b.className = 'loop-badge';
            b.innerHTML = `<span>#${i+1}</span><span class="material-icons" style="font-size:14px;" onclick="event.stopPropagation(); deleteLoop('${mode}', ${i})">close</span>`;
            b.onclick = () => {
                if(mode==='file'){ wsRegions.clearRegions(); wsRegions.addRegion({start: l.start, end: l.end, color:'rgba(212,163,115,0.2)'}); wavesurfer.setTime(l.start); }
                else { loopStart = l.start; loopEnd = l.end; document.getElementById('loopStartTxt').innerText = fmt(l.start); document.getElementById('loopEndTxt').innerText = fmt(l.end); ytPlayer.seekTo(l.start); if(!isLooping) toggleLoop(); }
            };
            container.appendChild(b);
        });
    }

    function deleteLoop(mode, i) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const sKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let loops = JSON.parse(localStorage.getItem(sKey) || "{}");
        loops[key].splice(i, 1); localStorage.setItem(sKey, JSON.stringify(loops)); renderLoopList(mode);
    }

    // --- Main App Logic ---
    function startApp() {
        // WaveSurfer初期化 (安定性のためにバックエンドをWebAudioに設定)
        wavesurfer = WaveSurfer.create({ 
            container: '#waveform', waveColor: '#444', progressColor: '#d4a373', height: 120, barWidth: 2, 
            normalize: true, backend: 'WebAudio'
        });
        recWavesurfer = WaveSurfer.create({ container: '#rec-waveform', waveColor: '#522', progressColor: '#f44', height: 80, barWidth: 2 });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        wsRegions.enableDragSelection({ color: 'rgba(212, 163, 115, 0.2)' });
        wsRegions.on('region-created', r => { if(wsRegions.getRegions().length > 1) wsRegions.getRegions()[0].remove(); wavesurfer.setTime(r.start); });

        const applySettings = () => {
            const s = parseFloat(document.getElementById('speed').value);
            const p = parseInt(document.getElementById('pitch').value);
            const media = wavesurfer.getMediaElement();
            if (media) {
                media.preservesPitch = true;
                if (media.detune !== undefined) { media.detune = p * 100; wavesurfer.setPlaybackRate(s); } 
                else { wavesurfer.setPlaybackRate(s); }
            }
            updateBpmDisplay();
            document.getElementById('pitchTxt').innerText = (p > 0 ? "+" : "") + p;
        };

        document.getElementById('audioFile').onchange = e => {
            const f = e.target.files[0];
            if(f) {
                currentFileName = f.name; document.getElementById('fileSelectBtn').innerText = f.name;
                const reader = new FileReader();
                reader.onload = ev => {
                    const blob = new Blob([ev.target.result], { type: f.type });
                    if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
                    currentObjectURL = URL.createObjectURL(blob);
                    wavesurfer.load(currentObjectURL);
                    analyzeAudio(blob);
                    renderLoopList('file');
                };
                reader.readAsArrayBuffer(f);
            }
        };

        document.getElementById('speed').oninput = applySettings;
        document.getElementById('pitch').oninput = applySettings;
        document.getElementById('zoomSlider').oninput = e => wavesurfer.zoom(Number(e.target.value));
        document.getElementById('resetZoomBtn').onclick = () => { wavesurfer.zoom(0); document.getElementById('zoomSlider').value = 100; };
        document.getElementById('mainVolume').oninput = applyVolumes;
        document.getElementById('recVolume').oninput = applyVolumes;

        wavesurfer.on('ready', () => { 
            document.getElementById('totalTime').innerText = fmt(wavesurfer.getDuration());
            applySettings(); 
        });

        // モバイル安定化のための重要イベント
        wavesurfer.on('decode', () => {
            applySettings();
        });

        document.getElementById('playBtn').onclick = async () => {
            // モバイルでのオーディオコンテキスト解除
            initAudioContext();
            
            // 重要: 初回クリック時にメディア要素を強制的にアクティブにする
            const media = wavesurfer.getMediaElement();
            if (media && media.paused && wavesurfer.getCurrentTime() === 0) {
                media.load(); 
            }

            if (wavesurfer.isPlaying()) { wavesurfer.pause(); } 
            else {
                const current = wavesurfer.getCurrentTime(), region = wsRegions.getRegions()[0];
                if (isCountEnabled && region && (current < region.start || current >= region.end)) wavesurfer.setTime(region.start);
                if (isCountEnabled) await runCountdown();
                applySettings();
                wavesurfer.play();
            }
        };

        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if(r && t >= r.end) {
                wavesurfer.setTime(r.start);
                if (isSpeedUpEnabled) {
                    const s = document.getElementById('speed');
                    s.value = Math.min(1.5, parseFloat(s.value) + 0.05).toFixed(2);
                    applySettings();
                }
            }
        });

        window.resetSetting = (id, val) => { document.getElementById(id).value = val; applySettings(); };
    }

    document.addEventListener('DOMContentLoaded', startApp);
</script>
