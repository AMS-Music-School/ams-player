<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.4 - Professional Edition</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" href="icon.png?v=1.2.1" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.1">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --accent-color: #ffcc00; /* Electric Gold */
            --bg-main: #0a0a0a;
            --panel-bg: #161616;
            --surface-bg: #222222;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #2a2a2a;
            --recording-red: #ff3b30;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
        }

        body { 
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            display: flex; flex-direction: column;
            min-height: 100vh;
        }

        /* 認証・サブスク関連オーバーレイ */
        #auth-overlay, #subscription-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .login-card {
            background: var(--panel-bg); padding: 40px 30px; border-radius: 24px;
            border: 1px solid var(--border-color); max-width: 360px; width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center;
        }

        .google-btn {
            background: #ffffff; color: #000; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 12px; width: 100%;
            margin-top: 25px; transition: transform 0.1s;
        }
        .google-btn:active { transform: scale(0.98); }

        .subscribe-btn {
            background: var(--accent-color); color: #000; border: none; padding: 16px;
            border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px;
        }

        header {
            padding: 15px 20px; display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-main); border-bottom: 1px solid var(--border-color);
        }
        .header-logo { font-weight: 900; letter-spacing: 2px; color: var(--accent-color); font-size: 1.1rem; }

        .container { flex: 1; padding: 15px; padding-bottom: 180px; } /* 余白確保 */

        /* 波形エリア */
        .display-unit {
            background: #000; border-radius: 16px; border: 1px solid var(--border-color);
            margin-bottom: 15px; position: relative; overflow: hidden;
        }
        #waveform-wrapper, #rec-waveform-wrapper { min-height: 140px; }
        #rec-waveform-wrapper { display: none; border-top: 1px solid var(--recording-red); min-height: 80px; }
        
        .time-info {
            display: flex; justify-content: space-between; padding: 10px 15px;
            font-family: 'Courier New', monospace; font-size: 0.9rem; border-bottom: 1px solid var(--border-color);
        }
        .current-time { color: var(--accent-color); font-weight: bold; }

        /* パネル類 */
        .control-panel {
            background: var(--panel-bg); border-radius: 18px; padding: 15px;
            margin-bottom: 12px; border: 1px solid var(--border-color);
        }
        .panel-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .panel-row:last-child { margin-bottom: 0; }
        
        label { font-size: 0.75rem; color: var(--text-dim); min-width: 45px; font-weight: 600; }
        .val-badge { min-width: 55px; text-align: right; font-weight: bold; color: var(--accent-color); font-size: 0.85rem; }

        /* スライダー */
        input[type="range"] { 
            flex: 1; height: 6px; -webkit-appearance: none; background: #333; border-radius: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* フローティング・フット・コントローラー（人間工学） */
        .bottom-controller {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(22, 22, 22, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 15px 15px calc(15px + var(--safe-area-bottom));
            z-index: 5000;
        }
        .main-controls {
            display: flex; justify-content: space-around; align-items: center; max-width: 500px; margin: 0 auto;
        }
        .btn-circle {
            width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--border-color);
            background: var(--surface-bg); color: #fff; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .btn-circle.active { color: var(--accent-color); border-color: var(--accent-color); box-shadow: 0 0 15px rgba(255,204,0,0.3); }
        .btn-play { width: 72px; height: 72px; background: var(--accent-color); color: #000; border: none; }
        .btn-rec { color: var(--recording-red); }
        .btn-rec.recording { background: var(--recording-red); color: #fff; animation: blink 1s infinite; }

        /* モード切替 */
        .tab-group {
            display: flex; background: var(--surface-bg); padding: 4px; border-radius: 12px; margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-dim);
            font-weight: bold; border-radius: 8px; font-size: 0.85rem; transition: 0.2s;
        }
        .tab-btn.active { background: var(--panel-bg); color: var(--accent-color); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        /* サイドメニュー・モーダル */
        .side-menu {
            position: fixed; top: 0; right: -100%; width: 85%; max-width: 300px; height: 100%;
            background: var(--panel-bg); z-index: 10000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px 20px; border-left: 1px solid var(--border-color);
        }
        .side-menu.open { right: 0; }
        .menu-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9500; display:none; }

        .loop-badge {
            background: var(--surface-bg); border: 1px solid var(--border-color);
            padding: 8px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px;
            font-size: 0.9rem; cursor: pointer;
        }
        .badge-del { color: var(--recording-red); font-size: 16px; }

        #ytPlayerContainer { border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; background: #000; border: 1px solid var(--border-color); }
        
        .modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 450px; background: var(--panel-bg); border: 1px solid var(--accent-color);
            border-radius: 24px; z-index: 11000; padding: 25px; max-height: 80vh; overflow-y: auto;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-card">
        <div class="header-logo" style="font-size: 1.8rem; margin-bottom: 10px;">AMS PLAYER</div>
        <p style="color: var(--text-dim); font-size: 0.9rem;">Practice makes perfect.</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Googleでログイン
        </button>
    </div>
</div>

<div id="subscription-overlay" style="display:none;">
    <div class="login-card" style="border-color: var(--accent-color);">
        <div class="header-logo">PREMIUM PLAN</div>
        <p style="margin: 20px 0; line-height: 1.6;">この機能はサブスクリプション会員専用です。</p>
        <button class="subscribe-btn" onclick="redirectToCheckout()">登録を開始する</button>
        <button onclick="closeSubOverlay()" style="background:none; border:none; color:var(--text-dim); margin-top:15px; cursor:pointer;">閉じる</button>
    </div>
</div>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <div id="userInfoDisplay" style="display:none; align-items:center; gap:10px;">
        <span id="userName" style="font-size:0.7rem; color:var(--text-dim);"></span>
        <button onclick="logout()" style="background:none; border:1px solid var(--border-color); color:var(--text-dim); border-radius:5px; padding:2px 8px; font-size:0.6rem;">LOGOUT</button>
    </div>
    <button onclick="toggleMenu(true)" style="background:none; border:none; color:#fff; cursor:pointer;">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <h3 style="color:var(--accent-color); margin-top:0;">SETTINGS</h3>
    <label id="langTitle">Language</label>
    <select id="langSelect" onchange="changeLanguage()" style="width:100%; padding:10px; background:var(--surface-bg); color:#fff; border:1px solid var(--border-color); border-radius:8px; margin-bottom:20px;">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>
    <div onclick="showGuide('file')" style="padding:15px 0; border-bottom:1px solid var(--border-color); cursor:pointer;">Audio Mode Guide</div>
    <div onclick="showGuide('yt')" style="padding:15px 0; border-bottom:1px solid var(--border-color); cursor:pointer;">YouTube Mode Guide</div>
</div>

<div id="guideModalFile" class="modal"><div id="guideFileContent"></div><button onclick="closeModals()" class="subscribe-btn" style="background:var(--surface-bg); color:#fff; margin-top:20px;">Close</button></div>
<div id="guideModalYT" class="modal"><div id="guideYTContent"></div><button onclick="closeModals()" class="subscribe-btn" style="background:var(--surface-bg); color:#fff; margin-top:20px;">Close</button></div>

<div class="container">
    <div class="tab-group">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section">
        <div class="display-unit">
            <div class="time-info">
                <span id="loadStatus">READY</span>
                <span class="current-time"><span id="currentTime">00:00</span> / <span id="totalTime">00:00</span></span>
            </div>
            <div id="waveform-wrapper">
                <div id="countdown-overlay" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:60px; font-weight:bold; color:var(--accent-color); z-index:100; display:none;"></div>
                <div id="waveform"></div>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
        </div>

        <label for="audioFile" style="display:block; background:var(--surface-bg); padding:15px; border-radius:12px; text-align:center; border:1px dashed var(--border-color); margin-bottom:15px; cursor:pointer;" id="fileSelectBtn">
            ファイルを選択
        </label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none;">

        <div class="control-panel">
            <div class="panel-row">
                <label>BPM</label>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <div class="val-badge" id="spTxt">---</div>
                <button onclick="resetSetting('speed', 1.0)" style="background:none; border:none; color:var(--text-dim); font-size:0.6rem;">RESET</button>
            </div>
            <div class="panel-row">
                <label>PITCH</label>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <div class="val-badge" id="pitchTxt">±0</div>
                <button onclick="resetSetting('pitch', 0)" style="background:none; border:none; color:var(--text-dim); font-size:0.6rem;">RESET</button>
            </div>
        </div>

        <div class="control-panel">
            <div class="panel-row">
                <span class="material-icons" style="font-size:18px;">volume_up</span>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
                <div class="val-badge" id="mainVolTxt">80%</div>
            </div>
            <div id="recVolControl" class="panel-row" style="display:none;">
                <span class="material-icons" style="font-size:18px; color:var(--recording-red);">mic</span>
                <input type="range" id="recVolume" min="0" max="1.5" step="0.05" value="1.0">
                <div class="val-badge" id="recVolTxt">100%</div>
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button onclick="wsRegions.clearRegions()" style="flex:1; padding:10px; background:var(--surface-bg); border:1px solid var(--border-color); color:#fff; border-radius:10px; font-size:0.75rem;">範囲解除</button>
            <button onclick="saveLoop('file')" id="saveLoopBtn" style="flex:1; padding:10px; background:var(--panel-bg); border:1px solid var(--accent-color); color:var(--accent-color); border-radius:10px; font-size:0.75rem;">ループ保存</button>
        </div>
        <div id="loopListFile" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>

    <div id="yt-section" class="hidden">
        <div class="panel-row" style="margin-bottom:15px;">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex:1; padding:12px; background:#000; border:1px solid var(--border-color); color:#fff; border-radius:10px;">
            <button onclick="loadYouTube()" style="padding:12px 20px; background:var(--accent-color); border:none; border-radius:10px; font-weight:bold;">LOAD</button>
        </div>
        
        <div id="ytHistoryContainer" style="margin-bottom:15px; display:none;">
            <div id="ytHistoryList" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:5px;"></div>
        </div>

        <div id="ytPlayerContainer"><div id="player"></div></div>

        <div class="control-panel" style="margin-top:15px;">
            <div class="panel-row" style="justify-content:space-between;">
                <button onclick="setLoopPoint('start')" style="background:var(--surface-bg); color:#fff; border:1px solid var(--border-color); padding:10px; border-radius:8px; flex:1; margin-right:5px;">SET START</button>
                <div style="background:#000; padding:8px 15px; border-radius:8px; color:var(--accent-color); font-weight:bold;" id="loopStartTxt">00:00</div>
            </div>
            <div class="panel-row" style="justify-content:space-between;">
                <button onclick="setLoopPoint('end')" style="background:var(--surface-bg); color:#fff; border:1px solid var(--border-color); padding:10px; border-radius:8px; flex:1; margin-right:5px;">SET END</button>
                <div style="background:#000; padding:8px 15px; border-radius:8px; color:var(--accent-color); font-weight:bold;" id="loopEndTxt">00:00</div>
            </div>
            <div class="panel-row">
                <button id="toggleLoopBtn" onclick="toggleLoop()" style="flex:1; padding:12px; background:var(--surface-bg); color:var(--text-dim); border:1px solid var(--border-color); border-radius:10px;">LOOP OFF</button>
                <button onclick="saveLoop('yt')" style="flex:1; padding:12px; border:1px solid var(--accent-color); background:transparent; color:var(--accent-color); border-radius:10px;">SAVE LOOP</button>
            </div>
        </div>
        <div id="loopListYT" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>
</div>

<div class="bottom-controller">
    <div class="main-controls">
        <button class="btn-circle" id="countToggleBtn" onclick="toggleFeature('count')">
            <span class="material-icons">timer</span>
        </button>
        <button class="btn-circle" onclick="skipTime(-5)">
            <span class="material-icons">replay_5</span>
        </button>
        <button class="btn-circle btn-play" id="playBtn">
            <span class="material-icons" id="playIcon" style="font-size:36px;">play_arrow</span>
        </button>
        <button class="btn-circle" onclick="skipTime(5)">
            <span class="material-icons">forward_5</span>
        </button>
        <button class="btn-circle btn-rec" id="recBtn" onclick="toggleRecording()">
            <span class="material-icons" id="recIcon">mic</span>
        </button>
    </div>
    <div id="recControls" style="display:none; justify-content:center; gap:20px; margin-top:15px;">
        <button onclick="playRecording()" id="playRecBtn" style="background:none; border:1px solid var(--recording-red); color:var(--recording-red); padding:5px 15px; border-radius:20px; font-size:0.7rem;">録音再生</button>
        <button onclick="deleteRecording()" style="background:none; border:none; color:var(--text-dim); font-size:0.7rem;">削除</button>
        <button id="soloBtn" onclick="toggleSolo()" style="background:var(--surface-bg); border:1px solid var(--border-color); color:#fff; width:30px; height:30px; border-radius:50%; font-size:0.7rem;">S</button>
    </div>
</div>

<script>
    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isSubscribed = false;

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        // ログアウト後の再ログイン時に必ずアカウント選択を表示させる設定
        provider.setCustomParameters({ prompt: 'select_account' });
        auth.signInWithPopup(provider).catch(e => alert("Error: " + e.message));
    }

    function logout() {
        auth.signOut().then(() => {
            window.location.reload(); // 状態をクリーンにするためリロード
        });
    }

    async function checkSubscriptionStatus(user) {
        try {
            const doc = await db.collection('School Member').doc(user.email).get();
            return doc.exists && doc.data().isSubscribed === true;
        } catch (e) { return false; }
    }

    auth.onAuthStateChanged(async user => {
        const authOverlay = document.getElementById('auth-overlay');
        const userInfo = document.getElementById('userInfoDisplay');
        if (user) {
            authOverlay.style.display = 'none';
            isSubscribed = await checkSubscriptionStatus(user);
            userInfo.style.display = 'flex';
            document.getElementById('userName').innerText = user.displayName;
            renderLoopList(currentMode);
        } else {
            authOverlay.style.display = 'flex';
        }
    });

    // --- Core Variables ---
    let wavesurfer, wsRegions, recWavesurfer, ytPlayer, loopInterval;
    let loopStart = 0, loopEnd = 0, isLooping = false, currentMode = 'file';
    let audioCtx, firstSoundTime = 0, originalBpm = 120;
    let currentFileName = "", currentYTId = "", isRecording = false, isSolo = false;
    let isCountEnabled = true, isSpeedUpEnabled = false;
    let mediaRecorder, recordedChunks = [], recObjectURL = null, lastRecStartPos = 0;

    const translations = {
        ja: {
            ready: "準備完了", analyzing: "解析中...", loopOff: "ループ OFF", loopOn: "ループ ON",
            guideFileContent: "<h3>Audio File Guide</h3><ul><li><b>録音機能:</b> 再生しながら録音し、客観的にチェックできます。</li><li><b>BPM/Pitch:</b> 練習に合わせて自由に変更可能。</li></ul>",
            guideYTContent: "<h3>YouTube Guide</h3><ul><li><b>区間指定:</b> START/ENDでループ範囲を決めます。</li><li><b>履歴:</b> 最近練習した曲にすぐアクセス。</li></ul>"
        },
        en: {
            ready: "READY", analyzing: "ANALYZING...", loopOff: "LOOP OFF", loopOn: "LOOP ON",
            guideFileContent: "<h3>Audio File Guide</h3><ul><li><b>Recording:</b> Practice and record simultaneously.</li><li><b>BPM/Pitch:</b> Change speed and key freely.</li></ul>",
            guideYTContent: "<h3>YouTube Guide</h3><ul><li><b>Looping:</b> Set START/END points.</li><li><b>History:</b> Quick access to recent songs.</li></ul>"
        }
    };

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang];
        document.getElementById('guideFileContent').innerHTML = t.guideFileContent;
        document.getElementById('guideYTContent').innerHTML = t.guideYTContent;
        document.getElementById('loadStatus').innerText = t.ready;
        document.getElementById('toggleLoopBtn').innerText = isLooping ? t.loopOn : t.loopOff;
    }

    // --- UI Helpers ---
    function toggleMenu(open) {
        document.getElementById('sideMenu').classList.toggle('open', open);
        document.getElementById('menuOverlay').style.display = open ? 'block' : 'none';
    }
    function showGuide(mode) {
        toggleMenu(false);
        document.getElementById(mode === 'file' ? 'guideModalFile' : 'guideModalYT').style.display = 'block';
        document.getElementById('menuOverlay').style.display = 'block';
    }
    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('menuOverlay').style.display = 'none';
    }
    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('file-section').classList.toggle('hidden', mode !== 'file');
        document.getElementById('yt-section').classList.toggle('hidden', mode !== 'yt');
        document.getElementById('tab-file').classList.toggle('active', mode === 'file');
        document.getElementById('tab-yt').classList.toggle('active', mode === 'yt');
        if(wavesurfer) wavesurfer.pause();
        if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        renderLoopList(mode);
    }

    // --- Audio Logic ---
    function initAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    async function analyzeAudio(blob) {
        const statusEl = document.getElementById('loadStatus');
        statusEl.innerText = translations[document.getElementById('langSelect').value].analyzing;
        const tempCtx = new AudioContext();
        try {
            const buffer = await tempCtx.decodeAudioData(await blob.arrayBuffer());
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i += 100) { if (Math.abs(data[i]) > 0.015) { firstSoundTime = i / buffer.sampleRate; break; } }
            const bpm = detectBPM(buffer);
            if (bpm > 0) { originalBpm = Math.round(bpm); updateBpmDisplay(); }
            statusEl.innerText = translations[document.getElementById('langSelect').value].ready;
            wavesurfer.setTime(firstSoundTime);
        } catch (e) { statusEl.innerText = "READY"; } finally { tempCtx.close(); }
    }

    function detectBPM(buffer) {
        const data = buffer.getChannelData(0), step = 200, energy = [];
        for (let i = 0; i < data.length; i += step) {
            let sum = 0; for(let j=0; j<step && (i+j)<data.length; j++) sum += data[i+j]**2;
            energy.push(Math.sqrt(sum/step));
        }
        let bestBpm = 0, maxCorr = 0;
        for (let interval = 441; interval <= 1323; interval++) { // Approx 60-180bpm
            let corr = 0; for (let i = 0; i < Math.min(energy.length - interval, 5000); i++) corr += energy[i] * energy[i + interval];
            if (corr > maxCorr) { maxCorr = corr; bestBpm = 60 / (interval * step / buffer.sampleRate); }
        }
        return bestBpm;
    }

    function updateBpmDisplay() {
        const speed = parseFloat(document.getElementById('speed').value);
        document.getElementById('spTxt').innerText = "BPM " + Math.round(originalBpm * speed);
    }

    async function runCountdown() {
        if (!isCountEnabled) return;
        const interval = 60000 / (originalBpm * parseFloat(document.getElementById('speed').value));
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'block';
        for (let i = 1; i <= 4; i++) {
            overlay.innerText = i;
            playBeep(i === 4);
            await new Promise(r => setTimeout(r, interval));
        }
        overlay.style.display = 'none';
    }

    function playBeep(high) {
        const ctx = initAudioContext();
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.frequency.setValueAtTime(high ? 880 : 440, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
    }

    // --- Recording ---
    async function toggleRecording() {
        if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        if (isRecording) {
            mediaRecorder.stop();
            wavesurfer.pause();
            isRecording = false;
            document.getElementById('recBtn').classList.remove('recording');
            document.getElementById('recIcon').innerText = 'mic';
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    recObjectURL = URL.createObjectURL(blob);
                    document.getElementById('rec-waveform-wrapper').style.display = 'block';
                    document.getElementById('recVolControl').style.display = 'flex';
                    document.getElementById('recControls').style.display = 'flex';
                    await recWavesurfer.load(recObjectURL);
                };
                const r = wsRegions.getRegions()[0];
                lastRecStartPos = r ? r.start : wavesurfer.getCurrentTime();
                wavesurfer.setTime(lastRecStartPos);
                await runCountdown();
                mediaRecorder.start();
                wavesurfer.play();
                isRecording = true;
                document.getElementById('recBtn').classList.add('recording');
                document.getElementById('recIcon').innerText = 'stop';
            } catch (e) { alert("Microphone access denied."); }
        }
    }

    function playRecording() {
        if (recWavesurfer.isPlaying()) { recWavesurfer.pause(); wavesurfer.pause(); }
        else { wavesurfer.setTime(lastRecStartPos); recWavesurfer.setTime(0); wavesurfer.play(); recWavesurfer.play(); }
    }

    function deleteRecording() {
        if (confirm("Delete recording?")) {
            document.getElementById('rec-waveform-wrapper').style.display = 'none';
            document.getElementById('recControls').style.display = 'none';
            recWavesurfer.empty();
        }
    }

    function toggleSolo() {
        isSolo = !isSolo;
        document.getElementById('soloBtn').classList.toggle('active', isSolo);
        applyVolumes();
    }

    function applyVolumes() {
        if (!wavesurfer) return;
        const mVol = parseFloat(document.getElementById('mainVolume').value);
        const rVol = parseFloat(document.getElementById('recVolume').value);
        wavesurfer.setVolume(isSolo ? 0 : mVol);
        if (recWavesurfer) recWavesurfer.setVolume(rVol);
        document.getElementById('mainVolTxt').innerText = Math.round(mVol * 100) + "%";
        document.getElementById('recVolTxt').innerText = Math.round(rVol * 100) + "%";
    }

    // --- YouTube ---
    function onYouTubeIframeAPIReady() { /* Ready */ }
    function loadYouTube(urlOverride) {
        const url = urlOverride || document.getElementById('ytUrl').value;
        const id = url.match(/(?:v=|\/be\/)([\w-]{11})/);
        if (id) {
            currentYTId = id[1];
            if (ytPlayer) ytPlayer.loadVideoById(currentYTId);
            else ytPlayer = new YT.Player('player', { videoId: currentYTId, events: { onStateChange: onYTStateChange } });
            saveToHistory(currentYTId, "YouTube Video");
        }
    }

    function onYTStateChange(e) {
        if (e.data === YT.PlayerState.PLAYING) {
            loopInterval = setInterval(() => {
                if (isLooping && ytPlayer.getCurrentTime() >= loopEnd) ytPlayer.seekTo(loopStart);
            }, 300);
        } else clearInterval(loopInterval);
    }

    function setLoopPoint(type) {
        const now = ytPlayer.getCurrentTime();
        if (type === 'start') { loopStart = now; document.getElementById('loopStartTxt').innerText = fmt(now); }
        else { loopEnd = now; document.getElementById('loopEndTxt').innerText = fmt(now); }
    }

    function toggleLoop() {
        isLooping = !isLooping;
        const lang = document.getElementById('langSelect').value;
        document.getElementById('toggleLoopBtn').innerText = isLooping ? translations[lang].loopOn : translations[lang].loopOff;
        document.getElementById('toggleLoopBtn').classList.toggle('active', isLooping);
    }

    // --- Storage & History ---
    function saveToHistory(id, title) {
        let history = JSON.parse(localStorage.getItem('ams_yt_history') || "[]");
        history = history.filter(i => i.id !== id);
        history.unshift({ id, title, url: `https://youtu.be/${id}` });
        localStorage.setItem('ams_yt_history', JSON.stringify(history.slice(0, 10)));
        renderYTHistory();
    }

    function renderYTHistory() {
        const list = document.getElementById('ytHistoryList');
        const history = JSON.parse(localStorage.getItem('ams_yt_history') || "[]");
        if (!history.length) return;
        document.getElementById('ytHistoryContainer').style.display = 'block';
        list.innerHTML = history.map(i => `
            <div onclick="loadYouTube('${i.url}')" style="background:var(--surface-bg); padding:8px 12px; border-radius:8px; white-space:nowrap; font-size:0.7rem; border:1px solid var(--border-color);">
                ${i.id}
            </div>
        `).join('');
    }

    function saveLoop(mode) {
        if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        const key = mode === 'file' ? currentFileName : currentYTId;
        if (!key) return;
        let start, end;
        if (mode === 'file') {
            const r = wsRegions.getRegions()[0]; if (!r) return;
            start = r.start; end = r.end;
        } else { start = loopStart; end = loopEnd; }
        
        const storeKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let all = JSON.parse(localStorage.getItem(storeKey) || "{}");
        if (!all[key]) all[key] = [];
        all[key].push({ start, end });
        localStorage.setItem(storeKey, JSON.stringify(all));
        renderLoopList(mode);
    }

    function renderLoopList(mode) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const container = document.getElementById(mode === 'file' ? 'loopListFile' : 'loopListYT');
        container.innerHTML = "";
        const all = JSON.parse(localStorage.getItem(mode === 'file' ? 'ams_loops' : 'ams_yt_loops') || "{}");
        (all[key] || []).forEach((l, idx) => {
            const badge = document.createElement('div');
            badge.className = 'loop-badge';
            badge.innerHTML = `<span>L${idx+1}</span><span class="badge-del material-icons" onclick="event.stopPropagation(); deleteLoop('${mode}', ${idx})">cancel</span>`;
            badge.onclick = () => {
                if (mode === 'file') { wsRegions.clearRegions(); wsRegions.addRegion({ start: l.start, end: l.end, color: 'rgba(255,204,0,0.2)' }); wavesurfer.setTime(l.start); }
                else { loopStart = l.start; loopEnd = l.end; document.getElementById('loopStartTxt').innerText = fmt(l.start); document.getElementById('loopEndTxt').innerText = fmt(l.end); ytPlayer.seekTo(l.start); if(!isLooping) toggleLoop(); }
            };
            container.appendChild(badge);
        });
    }

    function deleteLoop(mode, idx) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const storeKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let all = JSON.parse(localStorage.getItem(storeKey) || "{}");
        all[key].splice(idx, 1);
        localStorage.setItem(storeKey, JSON.stringify(all));
        renderLoopList(mode);
    }

    // --- Utils ---
    const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
    function resetSetting(id, val) { document.getElementById(id).value = val; updateSettings(); }
    function skipTime(amt) { if(currentMode === 'file') wavesurfer.skip(amt); else ytPlayer.seekTo(ytPlayer.getCurrentTime() + amt); }
    function toggleFeature(f) { if(f === 'count') { isCountEnabled = !isCountEnabled; document.getElementById('countToggleBtn').classList.toggle('active', isCountEnabled); } }
    function closeSubOverlay() { document.getElementById('subscription-overlay').style.display = 'none'; }
    function redirectToCheckout() { window.location.href = "https://your-payment-link.com"; }

    function updateSettings() {
        const s = parseFloat(document.getElementById('speed').value);
        const p = parseInt(document.getElementById('pitch').value);
        const media = wavesurfer.getMediaElement();
        if (media) {
            media.preservesPitch = true;
            if (media.detune !== undefined) { media.detune = p * 100; wavesurfer.setPlaybackRate(s); }
            else { media.preservesPitch = (p === 0); wavesurfer.setPlaybackRate(s * Math.pow(2, p / 12)); }
        }
        document.getElementById('pitchTxt').innerText = (p > 0 ? "+" : "") + p;
        updateBpmDisplay();
        applyVolumes();
    }

    // --- Init ---
    function startApp() {
        wavesurfer = WaveSurfer.create({ container: '#waveform', waveColor: '#333', progressColor: '#ffcc00', height: 140, barWidth: 2, normalize: true });
        recWavesurfer = WaveSurfer.create({ container: '#rec-waveform', waveColor: '#441111', progressColor: '#ff3b30', height: 80, barWidth: 2 });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        wsRegions.enableDragSelection({ color: 'rgba(255,204,0,0.2)' });
        
        wsRegions.on('region-created', r => { if(wsRegions.getRegions().length > 1) wsRegions.getRegions()[0].remove(); wavesurfer.setTime(r.start); });
        
        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if (file) {
                currentFileName = file.name;
                document.getElementById('fileSelectBtn').innerText = currentFileName;
                const url = URL.createObjectURL(file);
                wavesurfer.load(url);
                analyzeAudio(file);
                renderLoopList('file');
            }
        };

        document.getElementById('playBtn').onclick = async () => {
            initAudioContext();
            if (wavesurfer.isPlaying()) wavesurfer.pause();
            else {
                const r = wsRegions.getRegions()[0];
                if (isCountEnabled && r && (wavesurfer.getCurrentTime() < r.start || wavesurfer.getCurrentTime() >= r.end)) wavesurfer.setTime(r.start);
                await runCountdown(); updateSettings(); wavesurfer.play();
            }
        };

        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if (r && t >= r.end) wavesurfer.setTime(r.start);
        });
        wavesurfer.on('ready', () => { document.getElementById('totalTime').innerText = fmt(wavesurfer.getDuration()); updateSettings(); });

        document.getElementById('speed').oninput = updateSettings;
        document.getElementById('pitch').onmousedown = document.getElementById('pitch').ontouchstart = e => {
            if (!isSubscribed) { e.preventDefault(); document.getElementById('subscription-overlay').style.display = 'flex'; }
        };
        document.getElementById('pitch').oninput = updateSettings;
        document.getElementById('mainVolume').oninput = applyVolumes;
        document.getElementById('recVolume').oninput = applyVolumes;

        // YouTube API Load
        const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
        
        renderYTHistory();
        changeLanguage();
    }

    window.addEventListener('DOMContentLoaded', startApp);
</script>
