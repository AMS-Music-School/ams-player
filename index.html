<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.2 - Studio Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <link rel="icon" href="icon.png?v=1.2.2" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.2">

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #d4a373;
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #999999;
            --border-color: #333333;
            --header-height: 60px;
            --recording-red: #ff4444;
            --ai-purple: #a855f7;
            --solo-yellow: #ffcc00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 0; margin: 0; padding-top: var(--header-height);
            overscroll-behavior-y: contain;
        }

        /* ヘッダー・メニュー */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(18, 18, 18, 0.95); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 2000;
        }
        .header-logo { font-weight: 900; letter-spacing: 2px; color: var(--primary-color); font-size: 1.2rem; }
        .menu-trigger { background: none; border: none; color: #fff; cursor: pointer; padding: 5px; }

        /* サイドメニュー */
        .side-menu {
            position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
            background: #1a1a1a; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3000; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }
        .side-menu.open { right: 0; }
        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 2500;
        }
        .menu-section-title { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 15px; display: block; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 12px 15px; color: #fff; cursor: pointer; border-radius: 8px; margin-bottom: 5px; }
        .menu-item:active { background: #333; }
        .premium-badge { color: #ffd700; font-weight: bold; font-size: 0.7rem; border: 1px solid #ffd700; padding: 1px 4px; border-radius: 4px; margin-left: 8px; }

        /* メインUI */
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid var(--border-color); background: #1a1a1a; color: var(--text-dim); border-radius: 10px; font-weight: bold; }
        .tab-btn.active { background: var(--primary-color); color: #000; border-color: var(--primary-color); }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 波形・コントロール */
        #waveform-wrapper { background: #000; border-radius: 12px; margin: 10px 0; position: relative; border: 1px solid var(--border-color); overflow: hidden; }
        #waveform { height: 128px; }
        .panel { background: var(--panel-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 10px; }
        .row:last-child { margin-bottom: 0; }
        
        .transport-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 20px 0; }
        .btn-ctrl { background: #252525; border: 1px solid var(--border-color); color: #fff; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .btn-ctrl.play-main { width: 70px; height: 70px; background: var(--primary-color); color: #000; border: none; }
        .btn-ctrl.active { color: var(--primary-color); border-color: var(--primary-color); }

        /* ループバッジ */
        .loop-list-container { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .loop-badge { background: #252525; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .badge-num { color: var(--primary-color); font-weight: bold; font-size: 1.1rem; }

        /* 録音・AI */
        .panel-rec { border-left: 4px solid var(--recording-red); }
        .rec-btn.active { background: var(--recording-red); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .ai-result-card { background: #1a1a2e; border: 1px solid var(--ai-purple); border-radius: 12px; padding: 15px; margin-top: 10px; display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
            authDomain: "ams-player-e04bf.firebaseapp.com",
            projectId: "ams-player-e04bf",
            storageBucket: "ams-player-e04bf.firebasestorage.app",
            messagingSenderId: "102274983236",
            appId: "1:102274983236:web:f4334348391dde42dd6311",
            measurementId: "G-GYHLQKN6SS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ログイン・ステータス管理
        async function syncUser(user) {
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);
            const statusEl = document.getElementById('authStatus');

            if (userSnap.exists()) {
                const data = userSnap.data();
                if (data.isPremium) {
                    statusEl.innerHTML += ' <span class="premium-badge">PREMIUM</span>';
                }
            } else {
                await setDoc(userRef, { displayName: user.displayName, email: user.email, isPremium: false, createdAt: new Date() });
            }
        }

        window.login = () => signInWithPopup(auth, provider).catch(console.error);
        window.logout = () => signOut(auth).catch(console.error);

        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                const statusEl = document.getElementById('authStatus');
                const loginBtn = document.getElementById('loginBtn');
                const logoutBtn = document.getElementById('logoutBtn');
                if (user) {
                    statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;margin-right:8px;">${user.displayName}`;
                    loginBtn.style.display = 'none';
                    logoutBtn.style.display = 'flex';
                    syncUser(user);
                } else {
                    statusEl.innerText = "ログインしていません";
                    loginBtn.style.display = 'flex';
                    logoutBtn.style.display = 'none';
                }
            });
        });
    </script>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="menu-trigger" onclick="toggleMenu(true)"><span class="material-icons">menu</span></button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <span style="font-weight:bold; color:var(--primary-color);">MENU</span>
        <button class="menu-trigger" onclick="toggleMenu(false)"><span class="material-icons">close</span></button>
    </div>
    <span class="menu-section-title">Account</span>
    <div id="authStatus" style="padding:10px 15px; font-size:0.85rem;">確認中...</div>
    <div class="menu-item" id="loginBtn" onclick="login()"><span class="material-icons">login</span><span>Googleログイン</span></div>
    <div class="menu-item" id="logoutBtn" onclick="logout()" style="display:none;"><span class="material-icons">logout</span><span>ログアウト</span></div>
    <hr style="border:0; border-top:1px solid var(--border-color); margin:10px 0;">
    <span class="menu-section-title">Settings</span>
    <select id="langSelect" style="width:100%; padding:10px; background:#000; color:#fff; border:1px solid var(--border-color); border-radius:8px;" onchange="changeLanguage()">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>
</div>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" style="display:block; background:var(--primary-color); color:#000; text-align:center; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; margin-bottom:10px;">ファイルを選択</label>
        <input type="file" id="audioFile" accept="audio/*" style="display:none;">
        
        <div id="waveform-wrapper"><div id="waveform"></div></div>
        
        <div class="row" style="font-size:0.8rem; color:var(--text-dim);">
            <span id="loadStatus">READY</span>
            <span class="time-display"><span id="currentTime">00:00</span> / <span id="totalTime">00:00</span></span>
        </div>

        <div class="clear-btn-container" style="display:flex; gap:10px; margin:10px 0;">
            <button class="tab-btn" onclick="wsRegions.clearRegions()" style="font-size:0.8rem;">範囲解除</button>
            <button class="tab-btn" onclick="saveLoop('file')" style="border-color:var(--primary-color); color:var(--primary-color); font-size:0.8rem;">ループ保存</button>
        </div>
        <div id="loopListFile" class="loop-list-container"></div>

        <div class="transport-controls">
            <button class="btn-ctrl active" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="btn-ctrl" id="speedUpToggleBtn" onclick="toggleFeature('speedup')"><span class="material-icons">speed</span></button>
        </div>

        <div class="panel panel-rec">
            <div class="row">
                <span style="font-size:0.7rem; color:var(--recording-red); font-weight:bold;">SELF-RECORDING CHECK</span>
                <button class="btn-ctrl rec-btn" id="recBtn" onclick="toggleRecording()" style="width:40px; height:40px;"><span class="material-icons">mic</span></button>
            </div>
            <div id="rec-waveform-wrapper" style="height:60px; background:#000; border-radius:6px; margin:10px 0;"><div id="rec-waveform"></div></div>
        </div>

        <div class="panel">
            <div class="row">Speed <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0" style="flex:1;"><span id="spTxt" style="min-width:60px;">1.00x</span></div>
            <div class="row">Pitch <input type="range" id="pitch" min="-6" max="6" step="1" value="0" style="flex:1;"><span id="pitchTxt" style="min-width:60px;">±0</span></div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div style="display:flex; gap:8px; margin-bottom:15px;">
            <input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex:1; padding:12px; background:#000; border:1px solid var(--border-color); color:#fff; border-radius:8px;">
            <button class="tab-btn active" style="flex:0; min-width:80px;" onclick="loadYouTube()">LOAD</button>
        </div>
        <div id="ytPlayerContainer" style="aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;"><div id="player"></div></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // --- プレイヤーロジック (app.js相当) ---
    let wavesurfer, wsRegions;
    let isCountEnabled = true, isSpeedUpEnabled = false;

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
        wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#444',
            progressColor: 'var(--primary-color)',
            cursorColor: '#fff',
            height: 128,
            responsive: true,
            barWidth: 2
        });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());

        // イベント設定
        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if(file) wavesurfer.loadBlob(file);
        };

        document.getElementById('playBtn').onclick = () => wavesurfer.playPause();
        
        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        
        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if(r && t >= r.end) wavesurfer.setTime(r.start);
        });

        wavesurfer.on('ready', () => {
            document.getElementById('totalTime').innerText = fmt(wavesurfer.getDuration());
            document.getElementById('loadStatus').innerText = 'READY';
        });

        // 範囲選択
        wavesurfer.on('interaction', () => {
            if(wsRegions.getRegions().length > 0) return;
            const duration = wavesurfer.getDuration();
            wsRegions.addRegion({ start: duration * 0.2, end: duration * 0.8, color: 'rgba(212, 163, 115, 0.3)' });
        });
    });

    const fmt = s => new Date(s * 1000).toISOString().substr(14, 5);
    window.toggleMenu = (open) => {
        document.getElementById('sideMenu').classList.toggle('open', open);
        document.getElementById('menuOverlay').style.display = open ? 'block' : 'none';
    };

    window.switchMode = (mode) => {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode + '-section').classList.add('active');
        document.getElementById('tab-' + mode).classList.add('active');
    };

    // YouTube ロジック (簡易版)
    let ytPlayer;
    window.loadYouTube = () => {
        const url = document.getElementById('ytUrl').value;
        const id = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
        if(ytPlayer) {
            ytPlayer.loadVideoById(id);
        } else {
            ytPlayer = new YT.Player('player', { height: '100%', width: '100%', videoId: id });
        }
    };

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=1.2.2');
    }
</script>
</body>
</html>
