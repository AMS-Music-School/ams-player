<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.4.0 - Professional Edition</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" href="icon.png?v=1.4.0" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.4.0">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ffcc00; /* エレクトリック・ゴールド */
            --bg-base: #0a0a0a;
            --bg-panel: #161616;
            --bg-card: #1f1f1f;
            --text-main: #f0f0f0;
            --text-dim: #888888;
            --border: #2a2a2a;
            --recording: #ff3b30;
            --header-h: 60px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-h);
        }

        /* 認証オーバーレイ */
        #auth-overlay, #subscription-overlay {
            position: fixed; inset: 0; background: var(--bg-base); z-index: 9000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        #subscription-overlay { background: rgba(0,0,0,0.9); display: none; }
        
        .glass-card {
            background: var(--bg-card); padding: 40px 30px; border-radius: 24px;
            border: 1px solid var(--border); width: 100%; max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;
        }
        .google-btn {
            background: #fff; color: #000; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 12px; width: 100%;
            margin-top: 25px; transition: transform 0.1s;
        }
        .google-btn:active { transform: scale(0.98); }

        header {
            position: fixed; top: 0; width: 100%; height: var(--header-h);
            background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 5000;
        }
        .logo { font-weight: 900; letter-spacing: 2px; color: var(--primary); font-size: 1.1rem; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* モード切替 */
        .mode-selector {
            display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-panel);
            padding: 4px; border-radius: 14px; margin-bottom: 20px; border: 1px solid var(--border);
        }
        .mode-btn {
            background: transparent; border: none; color: var(--text-dim); padding: 10px;
            border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* 波形エリア */
        .waveform-container {
            background: #000; border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 15px; position: relative; overflow: hidden;
        }
        #waveform, #rec-waveform { min-height: 120px; cursor: crosshair; }
        #rec-waveform-wrapper { display: none; border-top: 2px solid var(--recording); margin-top: 5px; }

        .time-monitor {
            display: flex; justify-content: space-between; align-items: baseline;
            padding: 10px 5px; font-variant-numeric: tabular-nums;
        }
        .time-now { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
        .time-total { font-size: 0.9rem; color: var(--text-dim); }

        /* コントロールパネル */
        .panel {
            background: var(--bg-panel); border-radius: 18px; padding: 18px;
            margin-bottom: 15px; border: 1px solid var(--border);
        }
        .row { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        .row:last-child { margin-bottom: 0; }
        
        .label-box { min-width: 50px; font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
        .value-display { min-width: 60px; text-align: right; font-weight: 800; color: var(--primary); font-size: 0.9rem; }

        input[type="range"] {
            flex: 1; height: 6px; background: #333; border-radius: 3px; -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; background: var(--primary);
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,204,0,0.4);
        }

        /* 輸送コントロール（メイン操作系） */
        .main-controls {
            display: flex; justify-content: center; align-items: center; gap: 20px; padding: 10px 0 20px;
        }
        .btn-round {
            width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--bg-panel); color: var(--text-main); display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .btn-round.active { border-color: var(--primary); color: var(--primary); }
        .btn-play { width: 70px; height: 70px; background: var(--primary); color: #000; border: none; }
        .btn-play .material-icons { font-size: 40px; }

        /* 録音セクション */
        .rec-panel { border-color: rgba(255, 59, 48, 0.3); background: rgba(255, 59, 48, 0.03); }
        .rec-trigger {
            width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--recording);
            background: transparent; color: var(--recording); display: flex; align-items: center; justify-content: center;
        }
        .rec-trigger.recording { background: var(--recording); color: #fff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* ループバッジ */
        .loop-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .loop-chip {
            background: var(--bg-card); border: 1px solid var(--border); padding: 6px 12px;
            border-radius: 20px; font-size: 0.75rem; display: flex; align-items: center; gap: 8px; cursor: pointer;
        }
        .loop-chip:active { background: var(--border); }

        /* YouTube用 */
        #yt-section { display: none; }
        #yt-section.active { display: block; }
        #ytPlayerContainer { 
            width: 100%; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; 
            background: #000; margin-bottom: 15px; border: 1px solid var(--border);
        }
        .yt-input-group {
            display: flex; gap: 8px; background: var(--bg-panel); padding: 8px; border-radius: 12px; margin-bottom: 15px;
        }
        #ytUrl {
            flex: 1; background: transparent; border: none; color: #fff; padding: 8px; font-size: 0.9rem;
        }

        /* ユーティリティ */
        .hidden { display: none !important; }
        .btn-text {
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
            padding: 8px 16px; border-radius: 10px; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-text.primary { border-color: var(--primary); color: var(--primary); }

        /* ログインユーザー情報 */
        .user-status { font-size: 0.7rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
        .mini-logout { background: transparent; border: 1px solid var(--border); color: var(--text-dim); padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; }

        #countdown-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 100px; font-weight: 900; color: var(--primary); z-index: 100;
            background: rgba(0,0,0,0.5); pointer-events: none; display: none;
        }

        /* サイドメニュー */
        .side-menu {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: var(--bg-panel); z-index: 8000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px; border-left: 1px solid var(--border);
        }
        .side-menu.open { right: 0; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 7000; display: none; }
        
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 450px; background: var(--bg-card); border-radius: 24px;
            z-index: 8500; padding: 25px; border: 1px solid var(--primary); display: none;
        }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="glass-card">
        <div class="logo" style="font-size: 2rem; margin-bottom: 10px;">AMS PLAYER</div>
        <p style="font-size: 0.85rem; color: var(--text-dim);">練習効率を最大化するプロフェッショナル・ツール</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G">
            Googleアカウントでログイン
        </button>
    </div>
</div>

<div id="subscription-overlay">
    <div class="glass-card">
        <div class="logo" style="font-size: 1.5rem; margin-bottom: 10px;">PREMIUM</div>
        <p id="sub-msg">この機能はプレミアム会員限定です</p>
        <button class="google-btn" style="background: var(--primary); margin-bottom: 10px;" onclick="location.href='https://your-payment-link.com'">
            サブスクリプションを開始
        </button>
        <button class="btn-text" style="width:100%; justify-content:center;" onclick="closeSubOverlay()">キャンセル</button>
    </div>
</div>

<header>
    <div class="logo">AMS PLAYER</div>
    <div class="user-status" id="userStatus" style="display:none;">
        <span id="userNameDisplay">---</span>
        <button class="mini-logout" onclick="logout()">Logout</button>
    </div>
    <button class="mode-btn" style="padding:5px;" onclick="toggleMenu(true)">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
        <span style="font-weight:bold; color:var(--primary);">SETTINGS</span>
        <span class="material-icons" onclick="toggleMenu(false)">close</span>
    </div>
    <div class="label-box" style="margin-bottom:10px;">Language</div>
    <select id="langSelect" onchange="changeLanguage()" style="width:100%; background:var(--bg-card); color:#fff; border:1px solid var(--border); padding:10px; border-radius:8px;">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>
    <div style="margin-top:30px;">
        <div class="btn-text" onclick="showGuide('file')" style="margin-bottom:10px;"><span class="material-icons">info</span> ガイド (Audio)</div>
        <div class="btn-text" onclick="showGuide('yt')"><span class="material-icons">info</span> ガイド (YouTube)</div>
    </div>
</div>

<div id="guideModalFile" class="modal"><div id="guideFileContent"></div><button class="google-btn" onclick="closeModals()">閉じる</button></div>
<div id="guideModalYT" class="modal"><div id="guideYTContent"></div><button class="google-btn" onclick="closeModals()">閉じる</button></div>

<div class="container">
    <div class="mode-selector">
        <button class="mode-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="mode-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section">
        <label for="audioFile" class="btn-text" style="justify-content:center; padding:15px; border-style:dashed; margin-bottom:15px;">
            <span class="material-icons">cloud_upload</span>
            <span id="fileSelectBtn">練習するファイルを選択</span>
        </label>
        <input type="file" id="audioFile" accept="audio/*" class="hidden">

        <div class="waveform-container">
            <div id="countdown-overlay"></div>
            <div id="waveform"></div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
        </div>

        <div class="time-monitor">
            <div class="time-now" id="currentTime">00:00</div>
            <div style="text-align:right;">
                <div class="time-total" id="totalTime">00:00</div>
                <div style="font-size:0.6rem; color:var(--primary); font-weight:bold; letter-spacing:1px;" id="loadStatus">READY</div>
            </div>
        </div>

        <div class="main-controls">
            <button class="btn-round active" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="btn-round" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-round btn-play" id="playBtn"><span class="material-icons" id="playIcon">play_arrow</span></button>
            <button class="btn-round" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="btn-round" id="speedUpToggleBtn" onclick="toggleFeature('speedup')"><span class="material-icons">trending_up</span></button>
        </div>

        <div class="panel">
            <div class="row">
                <div class="label-box">Volume</div>
                <input type="range" id="mainVolume" min="0" max="1" step="0.01" value="0.8">
                <div class="value-display" id="mainVolTxt">80%</div>
            </div>
            <div class="row">
                <div class="label-box">BPM</div>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <div class="value-display" id="spTxt">---</div>
                <button class="mini-logout" onclick="resetSetting('speed', 1.0)">R</button>
            </div>
            <div class="row">
                <div class="label-box">Pitch</div>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <div class="value-display" id="pitchTxt">±0</div>
                <button class="mini-logout" onclick="resetSetting('pitch', 0)">R</button>
            </div>
        </div>

        <div class="panel rec-panel">
            <div class="row" style="justify-content: space-between;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="rec-trigger" id="recBtn" onclick="toggleRecording()"><span class="material-icons" id="recIcon">mic</span></button>
                    <div class="label-box" style="color:var(--recording)">Recording Check</div>
                </div>
                <button id="soloBtn" class="btn-text" style="padding:4px 12px;" onclick="toggleSolo()">SOLO</button>
            </div>
            
            <div id="recControls" style="display:none; margin-top:15px; border-top:1px solid var(--border); padding-top:15px;">
                <div class="row">
                    <div class="label-box">Rec Vol</div>
                    <input type="range" id="recVolume" min="0" max="1.5" step="0.05" value="1.0">
                    <div class="value-display" id="recVolTxt">100%</div>
                </div>
                <div class="row" style="gap:8px;">
                    <button class="btn-text primary" style="flex:1; justify-content:center;" onclick="playRecording()" id="playRecBtn">録音再生</button>
                    <button class="btn-text" style="flex:1; justify-content:center; color:var(--recording);" onclick="deleteRecording()">削除</button>
                </div>
            </div>
        </div>

        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
            <button class="btn-text" onclick="wsRegions.clearRegions()"><span class="material-icons">layers_clear</span> 範囲解除</button>
            <button class="btn-text primary" onclick="saveLoop('file')"><span class="material-icons">bookmark_add</span> ループ保存</button>
        </div>
        <div id="loopListFile" class="loop-list"></div>
    </div>

    <div id="yt-section">
        <div class="yt-input-group">
            <input type="text" id="ytUrl" placeholder="YouTubeのURLをペースト">
            <button class="btn-text primary" onclick="loadYouTube()">LOAD</button>
        </div>
        
        <div id="ytHistoryContainer" style="margin-bottom:15px; display:none;">
            <div class="label-box" style="margin-bottom:8px;">History</div>
            <div id="ytHistoryList" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:5px;"></div>
        </div>

        <div id="ytPlayerContainer"><div id="player"></div></div>

        <div class="panel">
            <div class="row" style="justify-content:center; gap:10px;">
                <button class="btn-text" onclick="setLoopPoint('start')">START</button>
                <div class="value-display" id="loopStartTxt" style="font-size:1.2rem;">00:00</div>
                <button class="btn-text" onclick="setLoopPoint('end')">END</button>
                <div class="value-display" id="loopEndTxt" style="font-size:1.2rem;">00:00</div>
            </div>
            <div class="row" style="justify-content:center; gap:8px; margin-top:10px;">
                <button id="toggleLoopBtn" class="btn-text primary" style="flex:1; justify-content:center;" onclick="toggleLoop()">LOOP OFF</button>
                <button class="btn-text" onclick="saveLoop('yt')"><span class="material-icons">bookmark_add</span> SAVE</button>
            </div>
        </div>
        <div id="loopListYT" class="loop-list"></div>
    </div>
</div>

<script>
    // --- Firebase設定 ---
    const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311",
        measurementId: "G-GYHLQKN6SS"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let isSubscribed = false;

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        // アカウント選択を強制する設定
        provider.setCustomParameters({ prompt: 'select_account' });
        auth.signInWithPopup(provider).catch(e => alert("Auth Error: " + e.message));
    }

    function logout() {
        auth.signOut();
    }

    auth.onAuthStateChanged(async user => {
        const overlay = document.getElementById('auth-overlay');
        const status = document.getElementById('userStatus');
        const name = document.getElementById('userNameDisplay');
        if (user) {
            overlay.style.display = 'none';
            status.style.display = 'flex';
            name.innerText = user.displayName;
            const doc = await db.collection('School Member').doc(user.email).get();
            isSubscribed = doc.exists && doc.data().isSubscribed === true;
            renderLoopList(currentMode);
        } else {
            overlay.style.display = 'flex';
            status.style.display = 'none';
            isSubscribed = false;
        }
    });

    function closeSubOverlay() { document.getElementById('subscription-overlay').style.display = 'none'; }

    // --- コアロジック ---
    let wavesurfer, wsRegions, recWavesurfer, ytPlayer, loopInterval;
    let loopStart = 0, loopEnd = 0, isLooping = false, currentMode = 'file';
    let audioCtx, firstSoundTime = 0, originalBpm = 120;
    let currentFileName = "", currentYTId = "", isCountEnabled = true, isSpeedUpEnabled = false;
    let mediaRecorder, recordedChunks = [], isRecording = false, isSolo = false, recObjectURL = null, lastRecStartPos = 0;

    const translations = {
        ja: {
            ready: "READY", analyzing: "ANALYZING...", loopOn: "LOOP ON", loopOff: "LOOP OFF",
            recPlay: "録音再生", recStop: "再生停止",
            guideFile: "<b>【Audio File Mode】</b><br>・再生しながら録音可能<br>・BPM/Pitch変更対応<br>・ドラッグで範囲指定してループ",
            guideYT: "<b>【YouTube Mode】</b><br>・URLを読み込んで練習<br>・START/ENDで範囲指定<br>・複数ループを保存可能"
        },
        en: {
            ready: "READY", analyzing: "ANALYZING...", loopOn: "LOOP ON", loopOff: "LOOP OFF",
            recPlay: "PLAY REC", recStop: "STOP REC",
            guideFile: "<b>【Audio File Mode】</b><br>・Record while playing<br>・BPM/Pitch control<br>・Drag waveform for loop",
            guideYT: "<b>【YouTube Mode】</b><br>・Paste URL to practice<br>・Set START/END points<br>・Save multiple loops"
        }
    };

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        const t = translations[lang];
        document.getElementById('guideFileContent').innerHTML = t.guideFile;
        document.getElementById('guideYTContent').innerHTML = t.guideYT;
        updateRecPlayBtnUI();
    }

    function toggleMenu(open) {
        document.getElementById('sideMenu').classList.toggle('open', open);
        document.getElementById('menuOverlay').style.display = open ? 'block' : 'none';
    }

    function showGuide(type) {
        toggleMenu(false);
        document.getElementById(type === 'file' ? 'guideModalFile' : 'guideModalYT').style.display = 'block';
        document.getElementById('menuOverlay').style.display = 'block';
    }

    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        document.getElementById('menuOverlay').style.display = 'none';
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('file-section').classList.toggle('hidden', mode !== 'file');
        document.getElementById('yt-section').classList.toggle('active', mode === 'yt');
        document.getElementById('tab-file').classList.toggle('active', mode === 'file');
        document.getElementById('tab-yt').classList.toggle('active', mode === 'yt');
        if(mode === 'yt' && wavesurfer) wavesurfer.pause();
        if(mode === 'file' && ytPlayer) ytPlayer.pauseVideo();
        renderLoopList(mode);
    }

    async function analyzeAudio(blob) {
        const lang = document.getElementById('langSelect').value;
        document.getElementById('loadStatus').innerText = translations[lang].analyzing;
        const tempCtx = new AudioContext();
        const arrayBuffer = await blob.arrayBuffer();
        const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
        const data = audioBuffer.getChannelData(0);
        let skip = 0;
        for (let i = 0; i < data.length; i += 100) { if (Math.abs(data[i]) > 0.015) { skip = i / audioBuffer.sampleRate; break; } }
        firstSoundTime = skip;
        originalBpm = Math.round(detectBPM(audioBuffer)) || 120;
        updateBpmDisplay();
        document.getElementById('loadStatus').innerText = translations[lang].ready;
        wavesurfer.setTime(firstSoundTime);
        tempCtx.close();
    }

    function detectBPM(buffer) {
        const data = buffer.getChannelData(0), step = 200, energy = [];
        for (let i = 0; i < data.length; i += step) {
            let sum = 0; for(let j=0; j<step && (i+j)<data.length; j++) sum += data[i+j] * data[i+j];
            energy.push(Math.sqrt(sum/step));
        }
        let bestBpm = 0, maxCorr = 0;
        const minInt = Math.floor((60/200)*(buffer.sampleRate/step)), maxInt = Math.floor((60/60)*(buffer.sampleRate/step));
        for (let int = minInt; int <= maxInt; int++) {
            let corr = 0; for (let i = 0; i < Math.min(energy.length - int, 10000); i++) corr += energy[i] * energy[i + int];
            if (corr > maxCorr) { maxCorr = corr; bestBpm = 60 / (int * step / buffer.sampleRate); }
        }
        return (bestBpm < 50 || bestBpm > 250) ? 0 : bestBpm;
    }

    function updateBpmDisplay() {
        const speed = parseFloat(document.getElementById('speed').value);
        document.getElementById('spTxt').innerText = "BPM " + Math.round(originalBpm * speed);
    }

    function toggleFeature(type) {
        if (type === 'count') {
            isCountEnabled = !isCountEnabled;
            document.getElementById('countToggleBtn').classList.toggle('active', isCountEnabled);
        } else {
            if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
            isSpeedUpEnabled = !isSpeedUpEnabled;
            document.getElementById('speedUpToggleBtn').classList.toggle('active', isSpeedUpEnabled);
        }
    }

    async function toggleRecording() {
        if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        if (isRecording) {
            mediaRecorder.stop(); wavesurfer.pause(); isRecording = false;
            document.getElementById('recBtn').classList.remove('recording');
            document.getElementById('recIcon').innerText = 'mic';
        } else {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    recObjectURL = URL.createObjectURL(blob);
                    await recWavesurfer.load(recObjectURL);
                    document.getElementById('recControls').style.display = 'block';
                    document.getElementById('rec-waveform-wrapper').style.display = 'block';
                    applyVolumes();
                };
                const r = wsRegions.getRegions()[0];
                const start = r ? r.start : wavesurfer.getCurrentTime();
                wavesurfer.setTime(start); lastRecStartPos = start;
                if(isCountEnabled) await runCountdown();
                mediaRecorder.start(); wavesurfer.play(); isRecording = true;
                document.getElementById('recBtn').classList.add('recording');
                document.getElementById('recIcon').innerText = 'stop';
            } catch(e) { alert("Mic Error: " + e); }
        }
    }

    async function runCountdown() {
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'flex';
        const interval = 60000 / (originalBpm * parseFloat(document.getElementById('speed').value));
        for (let i = 1; i <= 4; i++) {
            overlay.innerText = i;
            const osc = new AudioContext().createOscillator();
            const g = new AudioContext().createGain();
            osc.frequency.value = i===4 ? 880 : 440;
            g.gain.value = 0.1; osc.connect(g); g.connect(new AudioContext().destination);
            osc.start(); osc.stop(new AudioContext().currentTime + 0.1);
            await new Promise(r => setTimeout(r, interval));
        }
        overlay.style.display = 'none';
    }

    function toggleSolo() { isSolo = !isSolo; document.getElementById('soloBtn').classList.toggle('active', isSolo); applyVolumes(); }
    function applyVolumes() {
        if(!wavesurfer) return;
        const m = parseFloat(document.getElementById('mainVolume').value);
        const r = parseFloat(document.getElementById('recVolume').value);
        wavesurfer.setMuted(isSolo); wavesurfer.setVolume(m);
        if(recWavesurfer) recWavesurfer.setVolume(r);
        document.getElementById('mainVolTxt').innerText = Math.round(m*100) + "%";
        document.getElementById('recVolTxt').innerText = Math.round(r*100) + "%";
    }

    function playRecording() {
        if(recWavesurfer.isPlaying()) { recWavesurfer.pause(); wavesurfer.pause(); }
        else { wavesurfer.setTime(lastRecStartPos); recWavesurfer.setTime(0); wavesurfer.play(); recWavesurfer.play(); }
        updateRecPlayBtnUI();
    }
    function updateRecPlayBtnUI() {
        const btn = document.getElementById('playRecBtn');
        if(!btn) return;
        const lang = document.getElementById('langSelect').value;
        btn.innerText = recWavesurfer?.isPlaying() ? translations[lang].recStop : translations[lang].recPlay;
    }

    function deleteRecording() {
        if(confirm("Delete recording?")) {
            document.getElementById('recControls').style.display = 'none';
            document.getElementById('rec-waveform-wrapper').style.display = 'none';
            recWavesurfer.empty();
        }
    }

    // YouTube API
    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {}

    function loadYouTube(manualUrl) {
        const url = manualUrl || document.getElementById('ytUrl').value;
        const id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.includes('be/') ? url.split('be/')[1].split('?')[0] : null;
        if(id) {
            currentYTId = id;
            if(ytPlayer) ytPlayer.loadVideoById(id);
            else ytPlayer = new YT.Player('player', { videoId: id, events: { onReady: e => saveToHistory(id, e.target.getVideoData().title), onStateChange: onPlayerStateChange } });
            renderLoopList('yt');
        }
    }

    function onPlayerStateChange(e) {
        if(e.data === YT.PlayerState.PLAYING) {
            loopInterval = setInterval(() => { if(isLooping && ytPlayer.getCurrentTime() >= loopEnd) ytPlayer.seekTo(loopStart); }, 200);
        } else clearInterval(loopInterval);
    }

    const fmt = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
    function setLoopPoint(t) {
        const now = ytPlayer.getCurrentTime();
        if(t === 'start') { loopStart = Math.floor(now); document.getElementById('loopStartTxt').innerText = fmt(loopStart); }
        else { loopEnd = Math.ceil(now); document.getElementById('loopEndTxt').innerText = fmt(loopEnd); }
    }

    function toggleLoop() {
        isLooping = !isLooping;
        const lang = document.getElementById('langSelect').value;
        document.getElementById('toggleLoopBtn').innerText = isLooping ? translations[lang].loopOn : translations[lang].loopOff;
        document.getElementById('toggleLoopBtn').classList.toggle('active', isLooping);
    }

    function saveToHistory(id, title) {
        let h = JSON.parse(localStorage.getItem('ams_yt_history') || "[]");
        h = h.filter(x => x.id !== id); h.unshift({id, title});
        localStorage.setItem('ams_yt_history', JSON.stringify(h.slice(0,10)));
        renderYTHistory();
    }

    function renderYTHistory() {
        const list = document.getElementById('ytHistoryList');
        const h = JSON.parse(localStorage.getItem('ams_yt_history') || "[]");
        if(h.length === 0) return;
        document.getElementById('ytHistoryContainer').style.display = 'block';
        list.innerHTML = h.map(item => `<div class="loop-chip" onclick="loadYouTube('https://youtube.com/watch?v=${item.id}')">${item.title.substring(0,15)}...</div>`).join('');
    }

    function saveLoop(mode) {
        if(!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        const key = mode === 'file' ? currentFileName : currentYTId;
        if(!key) return;
        let start, end;
        if(mode === 'file') {
            const r = wsRegions.getRegions()[0]; if(!r) return;
            start = r.start; end = r.end;
        } else { start = loopStart; end = loopEnd; }
        const storageKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let all = JSON.parse(localStorage.getItem(storageKey) || "{}");
        if(!all[key]) all[key] = []; all[key].push({start, end});
        localStorage.setItem(storageKey, JSON.stringify(all));
        renderLoopList(mode);
    }

    function renderLoopList(mode) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const list = document.getElementById(mode === 'file' ? 'loopListFile' : 'loopListYT');
        if(!list || !key) return;
        const storageKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        const loops = JSON.parse(localStorage.getItem(storageKey) || "{}")[key] || [];
        list.innerHTML = loops.map((l, i) => `
            <div class="loop-chip" onclick="applyLoop('${mode}', ${l.start}, ${l.end})">
                Loop ${i+1} <span class="material-icons" style="font-size:14px;" onclick="event.stopPropagation(); deleteLoop('${mode}', ${i})">close</span>
            </div>
        `).join('');
    }

    function applyLoop(mode, s, e) {
        if(!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        if(mode === 'file') { wsRegions.clearRegions(); wsRegions.addRegion({start:s, end:e, color:'rgba(255,204,0,0.2)'}); wavesurfer.setTime(s); }
        else { loopStart = s; loopEnd = e; document.getElementById('loopStartTxt').innerText = fmt(s); document.getElementById('loopEndTxt').innerText = fmt(e); ytPlayer.seekTo(s); if(!isLooping) toggleLoop(); }
    }

    function deleteLoop(mode, i) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const storageKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let all = JSON.parse(localStorage.getItem(storageKey) || "{}");
        all[key].splice(i, 1); localStorage.setItem(storageKey, JSON.stringify(all));
        renderLoopList(mode);
    }

    function startApp() {
        wavesurfer = WaveSurfer.create({ container: '#waveform', waveColor: '#333', progressColor: '#ffcc00', height: 120, barWidth: 2 });
        recWavesurfer = WaveSurfer.create({ container: '#rec-waveform', waveColor: '#552222', progressColor: '#ff3b30', height: 80, barWidth: 2 });
        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        wsRegions.enableDragSelection({ color: 'rgba(255,204,0,0.2)' });
        wsRegions.on('region-created', r => { if(wsRegions.getRegions().length > 1) wsRegions.getRegions()[0].remove(); wavesurfer.setTime(r.start); });

        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if(file) {
                currentFileName = file.name;
                document.getElementById('fileSelectBtn').innerText = file.name;
                const url = URL.createObjectURL(file);
                wavesurfer.load(url); analyzeAudio(file); renderLoopList('file');
            }
        };

        const applySettings = () => {
            const s = parseFloat(document.getElementById('speed').value);
            const p = parseInt(document.getElementById('pitch').value);
            const media = wavesurfer.getMediaElement();
            media.preservesPitch = true;
            if(media.detune !== undefined) { media.detune = p * 100; wavesurfer.setPlaybackRate(s); }
            else if(p !== 0) { media.preservesPitch = false; wavesurfer.setPlaybackRate(s * Math.pow(2, p/12)); }
            else wavesurfer.setPlaybackRate(s);
            updateBpmDisplay();
            document.getElementById('pitchTxt').innerText = (p > 0 ? "+" : "") + p;
            applyVolumes();
        };

        wavesurfer.on('ready', () => { document.getElementById('totalTime').innerText = fmt(wavesurfer.getDuration()); applySettings(); });
        wavesurfer.on('timeupdate', t => {
            document.getElementById('currentTime').innerText = fmt(t);
            const r = wsRegions.getRegions()[0];
            if(r && t >= r.end) {
                wavesurfer.setTime(r.start);
                if(isSpeedUpEnabled) {
                    const s = document.getElementById('speed');
                    s.value = Math.min(1.5, parseFloat(s.value) + 0.05).toFixed(2);
                    applySettings();
                }
            }
        });

        document.getElementById('playBtn').onclick = () => wavesurfer.isPlaying() ? wavesurfer.pause() : wavesurfer.play();
        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        
        document.getElementById('speed').oninput = applySettings;
        document.getElementById('pitch').onmousedown = document.getElementById('pitch').ontouchstart = (e) => {
            if(!isSubscribed) { e.preventDefault(); document.getElementById('subscription-overlay').style.display = 'flex'; }
        };
        document.getElementById('pitch').oninput = applySettings;
        document.getElementById('mainVolume').oninput = applyVolumes;
        document.getElementById('recVolume').oninput = applyVolumes;

        window.resetSetting = (id, val) => { document.getElementById(id).value = val; applySettings(); };
        changeLanguage(); renderYTHistory();
    }

    window.addEventListener('DOMContentLoaded', startApp);
</script>
