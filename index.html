<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.5.0 - Ergonomic Edition</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png" type="image/png">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --accent: #d4a373;
            --accent-glow: rgba(212, 163, 115, 0.3);
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --border: #2a2a2a;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --danger: #ff5252;
            --safe: #4caf50;
            --header-h: 56px;
            --bottom-nav-h: 70px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-top: var(--header-h);
            padding-bottom: 120px; /* 操作エリア確保 */
            overflow-x: hidden;
            -webkit-user-select: none;
        }

        /* --- 認証 & サブスク --- */
        .overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        .card {
            background: var(--card-bg); padding: 32px; border-radius: 24px;
            border: 1px solid var(--border); width: 100%; max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .btn-primary {
            background: var(--accent); color: #000; border: none; padding: 14px 28px;
            border-radius: 12px; font-weight: bold; width: 100%; font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* --- Header --- */
        header {
            position: fixed; top: 0; width: 100%; height: var(--header-h);
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; border-bottom: 1px solid var(--border); z-index: 1000;
        }
        .logo { font-weight: 800; letter-spacing: 2px; color: var(--accent); font-size: 1.1rem; }

        /* --- Tabs --- */
        .tabs {
            display: flex; background: var(--card-bg); margin: 16px; border-radius: 12px;
            padding: 4px; border: 1px solid var(--border);
        }
        .tab {
            flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted);
            border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; font-weight: 600;
        }
        .tab.active { background: var(--accent); color: #000; }

        /* --- Main Content --- */
        .container { padding: 0 16px; max-width: 800px; margin: 0 auto; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Waveform Area --- */
        .waveform-container {
            background: #000; border-radius: 16px; border: 1px solid var(--border);
            margin-bottom: 16px; position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        #waveform, #rec-waveform { min-height: 120px; cursor: crosshair; }
        .time-info {
            display: flex; justify-content: space-between; margin: 8px 4px;
            font-family: 'Courier New', monospace; font-size: 0.9rem; color: var(--accent);
        }

        /* --- Controls & Panels --- */
        .control-panel {
            background: var(--card-bg); border-radius: 16px; padding: 16px;
            margin-bottom: 16px; border: 1px solid var(--border);
        }
        .row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .row:last-child { margin-bottom: 0; }
        .label { min-width: 60px; font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
        
        input[type="range"] {
            flex: 1; height: 6px; background: #333; border-radius: 3px;
            -webkit-appearance: none; appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: var(--accent); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* --- Recording Section --- */
        .rec-panel { border-left: 4px solid var(--danger); }
        .rec-active { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 82, 82, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); } }

        /* --- Floating Transport (Ergonomic) --- */
        .transport {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 500px;
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(20px);
            border-radius: 40px; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2000;
        }
        .btn-circle {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: #2a2a2a; color: var(--text); display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .btn-circle:active { transform: scale(0.9); background: #3a3a3a; }
        .btn-circle.play-pause { width: 64px; height: 64px; background: var(--accent); color: #000; }
        .btn-circle.active { color: var(--accent); border: 1px solid var(--accent); }

        /* --- Loops --- */
        .loop-chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
        .chip {
            background: #2a2a2a; border: 1px solid var(--border); padding: 8px 16px;
            border-radius: 20px; font-size: 0.8rem; white-space: nowrap;
            display: flex; align-items: center; gap: 6px; cursor: pointer;
        }
        .chip.active { border-color: var(--accent); color: var(--accent); }

        /* YouTube URL Input */
        .yt-input-group {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .yt-input-group input {
            flex: 1; background: #000; border: 1px solid var(--border);
            padding: 12px; border-radius: 12px; color: #fff; outline: none;
        }
        #ytPlayerContainer { 
            width: 100%; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden;
            background: #000; border: 1px solid var(--border); margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div id="auth-overlay" class="overlay">
    <div class="card">
        <h2 class="logo" style="font-size: 2rem; margin-bottom: 8px;">AMS PLAYER</h2>
        <p style="color: var(--text-muted); margin-bottom: 32px;">ログインして練習を開始しましょう</p>
        <button class="btn-primary" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Googleでログイン
        </button>
    </div>
</div>

<div id="subscription-overlay" class="overlay" style="display: none; background: rgba(0,0,0,0.9);">
    <div class="card">
        <h3 style="color: var(--accent);">PREMIUM FEATURES</h3>
        <p>この機能を利用するにはサブスクリプション登録が必要です。</p>
        <button class="btn-primary" onclick="redirectToCheckout()">登録ページへ</button>
        <button class="tab" style="margin-top: 16px; width: 100%;" onclick="closeSubOverlay()">キャンセル</button>
    </div>
</div>

<header>
    <div class="logo">AMS PLAYER</div>
    <div id="user-profile" style="display: none; align-items: center; gap: 12px;">
        <span id="userName" style="font-size: 0.8rem; color: var(--text-muted);">Guest</span>
        <button class="tab" style="padding: 4px 8px;" onclick="logout()">Logout</button>
    </div>
</header>

<div class="tabs">
    <button class="tab active" id="tab-file" onclick="switchMode('file')">Audio File</button>
    <button class="tab" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
</div>

<main class="container">
    
    <section id="file-section" class="section active">
        <label for="audioFile" class="btn-primary" style="background: var(--card-bg); color: var(--text); border: 1px dashed var(--accent); margin-bottom: 16px;">
            <span class="material-icons">upload_file</span>
            <span id="fileNameLabel">ファイルを選択</span>
        </label>
        <input type="file" id="audioFile" hidden accept="audio/*">

        <div class="time-info">
            <span id="loadStatus">READY</span>
            <span><span id="currentTime">00:00</span> / <span id="totalTime">00:00</span></span>
        </div>

        <div class="waveform-container">
            <div id="waveform"></div>
            <div id="countdown-overlay" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:80px; color:var(--accent); font-weight:800; pointer-events:none; display:none;"></div>
        </div>

        <div class="control-panel">
            <div class="row">
                <span class="material-icons" style="color:var(--accent)">volume_up</span>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
                <span id="mainVolTxt" class="label" style="text-align:right">80%</span>
            </div>
            <div class="row">
                <span class="label">BPM</span>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <span id="bpmTxt" class="label" style="text-align:right; color:var(--accent)">---</span>
            </div>
            <div class="row">
                <span class="label">PITCH</span>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <span id="pitchTxt" class="label" style="text-align:right; color:var(--accent)">±0</span>
            </div>
        </div>

        <div class="control-panel rec-panel" id="recPanel">
            <div class="row" style="justify-content: space-between;">
                <span style="font-weight:bold; color:var(--danger); font-size:0.8rem;">SELF-RECORDING</span>
                <div style="display:flex; gap:8px;">
                    <button id="soloBtn" class="tab" style="padding:4px 12px;" onclick="toggleSolo()">SOLO</button>
                    <button id="recBtn" class="btn-circle" style="width:40px; height:40px; background:var(--danger);" onclick="toggleRecording()">
                        <span class="material-icons" id="recIcon">mic</span>
                    </button>
                </div>
            </div>
            <div id="recWaveContainer" style="display:none; margin-top:12px;">
                <div id="rec-waveform" style="background:#000; border-radius:8px; margin-bottom:8px;"></div>
                <div class="row">
                    <button class="btn-primary" style="font-size:0.8rem; padding:8px;" onclick="playRecording()" id="playRecBtn">録音を再生</button>
                    <button class="tab" style="color:var(--danger)" onclick="deleteRecording()">削除</button>
                </div>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:0.75rem; font-weight:bold;">SAVED LOOPS</span>
            <button class="tab" style="font-size:0.7rem;" onclick="saveLoop('file')">+ SAVE CURRENT</button>
        </div>
        <div id="loopListFile" class="loop-chips"></div>
    </section>

    <section id="yt-section" class="section">
        <div class="yt-input-group">
            <input type="text" id="ytUrl" placeholder="YouTube URLをペースト...">
            <button class="btn-primary" style="width:auto;" onclick="loadYouTube()">LOAD</button>
        </div>
        
        <div id="ytPlayerContainer"><div id="player"></div></div>

        <div class="control-panel">
            <div class="row" style="justify-content:center; gap:24px;">
                <div style="text-align:center;">
                    <button class="tab" onclick="setLoopPoint('start')">SET START</button>
                    <div id="loopStartTxt" style="margin-top:8px; font-family:monospace; color:var(--accent);">00:00</div>
                </div>
                <div style="text-align:center;">
                    <button class="tab" onclick="setLoopPoint('end')">SET END</button>
                    <div id="loopEndTxt" style="margin-top:8px; font-family:monospace; color:var(--accent);">00:00</div>
                </div>
            </div>
            <div class="row" style="margin-top:16px;">
                <button id="toggleLoopBtn" class="btn-primary" onclick="toggleLoop()">LOOP OFF</button>
                <button class="tab" onclick="saveLoop('yt')">SAVE LOOP</button>
            </div>
        </div>
        
        <div id="loopListYT" class="loop-chips"></div>
    </section>

</main>

<div class="transport">
    <button class="btn-circle" id="countToggleBtn" onclick="toggleFeature('count')">
        <span class="material-icons">timer</span>
    </button>
    <button class="btn-circle" onclick="skip(-5)">
        <span class="material-icons">replay_5</span>
    </button>
    <button class="btn-circle play-pause" id="playBtn">
        <span class="material-icons" id="playIcon" style="font-size: 36px;">play_arrow</span>
    </button>
    <button class="btn-circle" onclick="skip(5)">
        <span class="material-icons">forward_5</span>
    </button>
    <button class="btn-circle" id="speedUpToggleBtn" onclick="toggleFeature('speedup')">
        <span class="material-icons">trending_up</span>
    </button>
</div>

<script>
    // --- Config & State ---
    const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let wavesurfer, wsRegions, recWavesurfer, ytPlayer;
    let isSubscribed = false;
    let currentMode = 'file';
    let isRecording = false;
    let isLooping = false;
    let loopStart = 0, loopEnd = 0;
    let originalBpm = 120;
    let isCountEnabled = true;
    let isSpeedUpEnabled = false;
    let isSolo = false;
    let mediaRecorder, recordedChunks = [];
    let currentFileName = "";
    let currentYTId = "";

    // --- Auth Logic ---
    auth.onAuthStateChanged(async user => {
        const overlay = document.getElementById('auth-overlay');
        const profile = document.getElementById('user-profile');
        if (user) {
            overlay.style.display = 'none';
            profile.style.display = 'flex';
            document.getElementById('userName').innerText = user.displayName;
            isSubscribed = await checkSubscriptionStatus(user);
            renderLoopList('file');
        } else {
            overlay.style.display = 'flex';
            profile.style.display = 'none';
        }
    });

    async function checkSubscriptionStatus(user) {
        try {
            const doc = await db.collection('School Member').doc(user.email).get();
            return doc.exists && doc.data().isSubscribed === true;
        } catch (e) { return false; }
    }

    function loginWithGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function logout() { auth.signOut(); }
    function redirectToCheckout() { window.location.href = "https://your-payment-link.com"; }
    function closeSubOverlay() { document.getElementById('subscription-overlay').style.display = 'none'; }

    // --- Core Logic ---
    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`${mode}-section`).classList.add('active');
        document.getElementById(`tab-${mode}`).classList.add('active');
        if(mode === 'yt' && wavesurfer) wavesurfer.pause();
        if(mode === 'file' && ytPlayer) ytPlayer.pauseVideo();
        renderLoopList(mode);
    }

    function skip(val) {
        if(currentMode === 'file' && wavesurfer) wavesurfer.skip(val);
        if(currentMode === 'yt' && ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() + val);
    }

    function toggleFeature(type) {
        if (type === 'count') {
            isCountEnabled = !isCountEnabled;
            document.getElementById('countToggleBtn').classList.toggle('active', isCountEnabled);
        } else if (type === 'speedup') {
            if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
            isSpeedUpEnabled = !isSpeedUpEnabled;
            document.getElementById('speedUpToggleBtn').classList.toggle('active', isSpeedUpEnabled);
        }
    }

    // --- Audio Logic (Wavesurfer) ---
    function initWavesurfer() {
        wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#444',
            progressColor: '#d4a373',
            cursorColor: '#fff',
            barWidth: 2,
            height: 120,
            responsive: true,
            normalize: true
        });

        wsRegions = wavesurfer.registerPlugin(WaveSurfer.Regions.create());
        wsRegions.enableDragSelection({ color: 'rgba(212, 163, 115, 0.2)' });

        wavesurfer.on('timeupdate', (t) => {
            document.getElementById('currentTime').innerText = formatTime(t);
            const activeRegion = wsRegions.getRegions()[0];
            if(activeRegion && t >= activeRegion.end) {
                wavesurfer.setTime(activeRegion.start);
                if(isSpeedUpEnabled) {
                    const speedEl = document.getElementById('speed');
                    speedEl.value = Math.min(1.5, parseFloat(speedEl.value) + 0.05).toFixed(2);
                    applyAudioSettings();
                }
            }
        });

        wavesurfer.on('play', () => document.getElementById('playIcon').innerText = 'pause');
        wavesurfer.on('pause', () => document.getElementById('playIcon').innerText = 'play_arrow');
        wavesurfer.on('ready', () => {
            document.getElementById('totalTime').innerText = formatTime(wavesurfer.getDuration());
            analyzeBpm();
        });

        recWavesurfer = WaveSurfer.create({
            container: '#rec-waveform',
            waveColor: '#552222',
            progressColor: '#ff5252',
            height: 60,
            barWidth: 2
        });
    }

    async function analyzeBpm() {
        // 簡易BPM解析アルゴリズム（仮）
        originalBpm = 120; // 実際にはデコードデータから算出
        updateBpmUI();
    }

    function updateBpmUI() {
        const rate = parseFloat(document.getElementById('speed').value);
        document.getElementById('bpmTxt').innerText = `BPM ${Math.round(originalBpm * rate)}`;
    }

    function applyAudioSettings() {
        if(!wavesurfer) return;
        const speed = parseFloat(document.getElementById('speed').value);
        const pitch = parseInt(document.getElementById('pitch').value);
        const media = wavesurfer.getMediaElement();
        
        media.preservesPitch = true;
        wavesurfer.setPlaybackRate(speed);
        if(media.detune !== undefined) media.detune = pitch * 100;

        wavesurfer.setVolume(isSolo ? 0 : parseFloat(document.getElementById('mainVolume').value));
        updateBpmUI();
        document.getElementById('pitchTxt').innerText = (pitch > 0 ? "+" : "") + pitch;
        document.getElementById('mainVolTxt').innerText = Math.round(wavesurfer.getVolume() * 100) + "%";
    }

    // --- Recording ---
    async function toggleRecording() {
        if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        
        if (isRecording) {
            mediaRecorder.stop();
            wavesurfer.pause();
            isRecording = false;
            document.getElementById('recBtn').classList.remove('rec-active');
            document.getElementById('recIcon').innerText = 'mic';
        } else {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            recordedChunks = [];
            
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                document.getElementById('recWaveContainer').style.display = 'block';
                await recWavesurfer.load(url);
            };

            if(isCountEnabled) await runCountdown();
            
            mediaRecorder.start();
            wavesurfer.play();
            isRecording = true;
            document.getElementById('recBtn').classList.add('rec-active');
            document.getElementById('recIcon').innerText = 'stop';
        }
    }

    async function runCountdown() {
        const overlay = document.getElementById('countdown-overlay');
        overlay.style.display = 'flex';
        for(let i=4; i>0; i--) {
            overlay.innerText = i;
            await new Promise(r => setTimeout(r, 600));
        }
        overlay.style.display = 'none';
    }

    function toggleSolo() {
        isSolo = !isSolo;
        document.getElementById('soloBtn').classList.toggle('active', isSolo);
        applyAudioSettings();
    }

    // --- YouTube ---
    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        // 初期化待ち
    }

    function loadYouTube() {
        const url = document.getElementById('ytUrl').value;
        const vid = url.match(/(?:v=|\/be\/|embed\/)([\w-]{11})/)?.[1];
        if(vid) {
            currentYTId = vid;
            if(ytPlayer) {
                ytPlayer.loadVideoById(vid);
            } else {
                ytPlayer = new YT.Player('player', {
                    videoId: vid,
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
            renderLoopList('yt');
        }
    }

    function onPlayerStateChange(e) {
        if(e.data === YT.PlayerState.PLAYING) {
            setInterval(() => {
                if(isLooping && ytPlayer.getCurrentTime() >= loopEnd) {
                    ytPlayer.seekTo(loopStart);
                }
            }, 500);
        }
    }

    function setLoopPoint(type) {
        const now = ytPlayer.getCurrentTime();
        if(type === 'start') {
            loopStart = now;
            document.getElementById('loopStartTxt').innerText = formatTime(now);
        } else {
            loopEnd = now;
            document.getElementById('loopEndTxt').innerText = formatTime(now);
        }
    }

    function toggleLoop() {
        isLooping = !isLooping;
        const btn = document.getElementById('toggleLoopBtn');
        btn.innerText = isLooping ? "LOOP ON" : "LOOP OFF";
        btn.classList.toggle('active', isLooping);
    }

    // --- Helpers ---
    function formatTime(s) {
        return new Date(s * 1000).toISOString().substr(14, 5);
    }

    function saveLoop(mode) {
        if (!isSubscribed) { document.getElementById('subscription-overlay').style.display = 'flex'; return; }
        const key = mode === 'file' ? currentFileName : currentYTId;
        if(!key) return;

        let start, end;
        if(mode === 'file') {
            const reg = wsRegions.getRegions()[0];
            if(!reg) return;
            start = reg.start; end = reg.end;
        } else {
            start = loopStart; end = loopEnd;
        }

        const storeKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        let loops = JSON.parse(localStorage.getItem(storeKey) || "{}");
        if(!loops[key]) loops[key] = [];
        loops[key].push({start, end});
        localStorage.setItem(storeKey, JSON.stringify(loops));
        renderLoopList(mode);
    }

    function renderLoopList(mode) {
        const key = mode === 'file' ? currentFileName : currentYTId;
        const container = document.getElementById(mode === 'file' ? 'loopListFile' : 'loopListYT');
        container.innerHTML = "";
        
        const storeKey = mode === 'file' ? 'ams_loops' : 'ams_yt_loops';
        const loops = JSON.parse(localStorage.getItem(storeKey) || "{}")[key] || [];
        
        loops.forEach((l, i) => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `<span>L${i+1}: ${formatTime(l.start)}</span><span class="material-icons" style="font-size:14px" onclick="deleteLoop('${mode}',${i});event.stopPropagation()">close</span>`;
            chip.onclick = () => {
                if(mode === 'file') {
                    wsRegions.clearRegions();
                    wsRegions.addRegion({start: l.start, end: l.end, color: 'rgba(212, 163, 115, 0.2)'});
                    wavesurfer.setTime(l.start);
                } else {
                    loopStart = l.start; loopEnd = l.end;
                    document.getElementById('loopStartTxt').innerText = formatTime(l.start);
                    document.getElementById('loopEndTxt').innerText = formatTime(l.end);
                    ytPlayer.seekTo(l.start);
                }
            };
            container.appendChild(chip);
        });
    }

    // --- Init ---
    window.addEventListener('DOMContentLoaded', () => {
        initWavesurfer();
        
        document.getElementById('audioFile').onchange = e => {
            const file = e.target.files[0];
            if(file) {
                currentFileName = file.name;
                document.getElementById('fileNameLabel').innerText = file.name;
                const url = URL.createObjectURL(file);
                wavesurfer.load(url);
                renderLoopList('file');
            }
        };

        document.getElementById('playBtn').onclick = () => {
            if(currentMode === 'file') {
                wavesurfer.isPlaying() ? wavesurfer.pause() : wavesurfer.play();
            } else {
                ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
            }
        };

        document.getElementById('speed').oninput = applyAudioSettings;
        document.getElementById('pitch').oninput = applyAudioSettings;
        document.getElementById('mainVolume').oninput = applyAudioSettings;
    });
</script>
</body>
</html>
