<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.3.3 - Next Gen</title>
    
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link rel="icon" href="icon.png?v=1.2.1" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.1">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ffd700; /* Gold */
            --accent-color: #00f2ff; /* Cyber Blue */
            --bg-dark: #0a0a0b;
            --panel-bg: #16161a;
            --text-main: #f0f0f0;
            --text-dim: #a0a0a8;
            --border-color: #2d2d35;
            --header-height: 60px;
            --recording-red: #ff3e3e;
            --solo-yellow: #ffcc00;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 0; margin: 0; 
            overscroll-behavior-y: contain;
            padding-top: var(--header-height);
            letter-spacing: -0.02em;
        }

        /* 認証・サブスク関連オーバーレイ */
        #auth-overlay, #subscription-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a20 0%, #0a0a0b 100%); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
            backdrop-filter: blur(10px);
        }
        #subscription-overlay { background: rgba(0,0,0,0.9); z-index: 6000; display: none; }
        
        .login-card {
            background: var(--panel-bg);
            padding: 40px 30px; border-radius: 24px;
            border: 1px solid var(--border-color); max-width: 350px; width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .google-btn {
            background: white;
            color: #1a1a1a; border: none; padding: 14px 20px;
            border-radius: 12px; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            gap: 12px; width: 100%; margin-top: 24px; font-size: 1rem;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .google-btn:active { transform: scale(0.96); }
        .subscribe-btn {
            background: linear-gradient(135deg, var(--primary-color), #ffaa00);
            color: #000; border: none; padding: 16px 30px;
            border-radius: 14px; font-weight: 800; cursor: pointer; margin-top: 20px; font-size: 1.1rem; width: 100%;
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.2);
        }
        .user-info { font-size: 0.75rem; color: var(--text-dim); display: flex; align-items: center; gap: 12px; }
        .logout-btn { background: var(--glass); border: 1px solid var(--border-color); color: var(--text-dim);
            padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        header {
            position: fixed;
            top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(10, 10, 11, 0.8); border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 2000; backdrop-filter: blur(15px);
        }
        .header-logo { 
            background: linear-gradient(to right, var(--primary-color), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900; letter-spacing: 2px; font-size: 1.1rem;
        }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
        
        #waveform-wrapper, #rec-waveform-wrapper { 
            position: relative; background: #000;
            border: 1px solid var(--border-color); border-radius: 16px; margin-bottom: 12px; overflow: hidden; min-height: 140px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        #rec-waveform-wrapper { min-height: 90px; margin-top: 10px; display: none; border: 1px solid rgba(255, 62, 62, 0.3); }

        .waveform-label { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 8px; }
        .time-display { color: var(--primary-color); font-weight: 800; font-family: 'Monaco', monospace; font-size: 1.1rem; }

        .panel { 
            background: var(--panel-bg); padding: 18px; border-radius: 20px;
            border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .panel-rec { padding: 12px 18px; border: 1px solid rgba(255, 62, 62, 0.15); background: linear-gradient(180deg, var(--panel-bg) 0%, #1a1010 100%); }

        .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        
        /* カスタムレンジスライダー */
        input[type="range"] { flex-grow: 1; accent-color: var(--primary-color); height: 4px; -webkit-appearance: none;
            background: #2d2d35; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px;
            border-radius: 50%; background: #fff; cursor: pointer; border: 3px solid var(--primary-color); box-shadow: 0 0 10px rgba(255,215,0,0.3); }

        .val-display { color: var(--accent-color); font-weight: 800; min-width: 80px; text-align: right; font-size: 1rem; }

        /* 人間工学に基づいたトランスポートコントロール */
        .transport-controls { 
            display: flex; justify-content: space-around; align-items: center; 
            margin: 24px 0; background: var(--glass); padding: 15px; border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .btn-ctrl { 
            background: none; color: var(--text-dim); border: none; 
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 15px;
        }
        .btn-ctrl:active { transform: scale(0.9); background: var(--glass); }
        .btn-ctrl.active { color: var(--primary-color); text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        .play-main { 
            background: linear-gradient(135deg, var(--primary-color), #ffaa00);
            color: #000 !important; width: 70px; height: 70px;
            border-radius: 50%; box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }
        .play-main:active { transform: scale(0.92); box-shadow: 0 5px 10px rgba(255, 215, 0, 0.2); }

        .rec-btn { color: var(--recording-red); border: 2px solid rgba(255, 62, 62, 0.3); border-radius: 50%; width: 44px; height: 44px; }
        .rec-btn.recording { background: var(--recording-red); color: white; animation: pulse-red 1.5s infinite; border: none; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 62, 62, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 62, 62, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 62, 62, 0); } }

        .solo-btn { width: 36px; height: 36px; border-radius: 10px; font-weight: 800; background: #2d2d35; color: var(--text-dim); border: none; cursor: pointer; }
        .solo-btn.active { background: var(--solo-yellow); color: #000; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }

        .custom-file-upload { 
            display: block; width: 100%; padding: 16px; border: 2px dashed var(--border-color);
            border-radius: 16px; margin-bottom: 16px; background: rgba(255,255,255,0.02); color: var(--text-dim); 
            font-size: 0.9rem; font-weight: 600; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .custom-file-upload:hover { border-color: var(--primary-color); background: rgba(255,215,0,0.05); color: #fff; }
        
        #countdown-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 100px; color: var(--primary-color); font-weight: 900; z-index: 1000; display: none; 
            text-shadow: 0 0 30px rgba(255,215,0,0.5); pointer-events: none; font-style: italic; }

        .reset-btn { background: #2d2d35; border: none; color: #a0a0a8; padding: 4px 10px;
            border-radius: 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        .side-menu { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; 
            background: #111114; z-index: 3000; transition: right 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8); padding: 30px; border-left: 1px solid var(--border-color); }
        .side-menu.open { right: 0; }
        
        .mode-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; background: #000; padding: 6px; border-radius: 16px; }
        .tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 10px; cursor: pointer;
            border-radius: 12px; font-size: 0.85rem; font-weight: 700; flex: 1; transition: 0.3s; }
        .tab-btn.active { background: var(--panel-bg); color: var(--primary-color); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .clear-btn-ja { background: #25252b; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 20px;
            border-radius: 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .clear-btn-ja:hover { border-color: var(--text-dim); }

        #ytUrl { background: #000; border: 1px solid var(--border-color); color: #fff; padding: 14px; border-radius: 12px; font-size: 0.9rem; }
        
        /* ループバッジのハイテク化 */
        .loop-badge { 
            background: linear-gradient(135deg, #1e1e24 0%, #111114 100%); 
            padding: 10px 16px; border-radius: 14px; display: flex;
            align-items: center; gap: 8px; border: 1px solid var(--border-color); cursor: pointer;
            transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .loop-badge:active { transform: translateY(2px); }

        .status-neon {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; font-weight: 900;
            background: rgba(0, 242, 255, 0.1); color: var(--accent-color); border: 1px solid var(--accent-color);
        }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-card">
        <div class="header-logo" style="font-size: 2rem; margin-bottom: 12px;">AMS PLAYER</div>
        <p style="font-size: 0.9rem; color: var(--text-dim);">Your Ultimate Practice Companion</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G">
            Sign in with Google
        </button>
    </div>
</div>

<div id="subscription-overlay">
    <div class="login-card">
        <div class="header-logo" style="font-size: 1.8rem; margin-bottom: 10px; color: var(--primary-color);">PREMIUM</div>
        <p style="font-size: 0.95rem; color: #fff; line-height: 1.6;">この機能はプレミアム限定です。<br>練習を加速させる全ての機能を開放しましょう。</p>
        <button class="subscribe-btn" onclick="redirectToCheckout()">
            Upgrade Now
        </button>
        <button class="clear-btn-ja" onclick="closeSubOverlay()" style="margin-top:15px; width:100%; justify-content:center; border:none; background:none; color:var(--text-dim);">CLOSE</button>
        <button class="logout-btn" onclick="logout()" style="margin-top:20px; display:block; width:100%;">Sign Out</button>
    </div>
</div>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <div style="display:flex; align-items:center; gap:15px;">
        <div class="user-info" id="userInfoDisplay" style="display:none;">
            <span id="userName" style="font-weight:700;">Guest</span>
        </div>
        <button class="menu-trigger" onclick="toggleMenu(true)" style="background:none; border:none; color:#fff; cursor:pointer;">
            <span class="material-icons">menu</span>
        </button>
    </div>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2500; display:none; backdrop-filter:blur(5px);"></div>
<div class="side-menu" id="sideMenu">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
        <span style="font-weight:900; letter-spacing:3px; color:var(--primary-color);">SETTINGS</span>
        <button onclick="toggleMenu(false)" style="background:none; border:none; color:#fff; cursor:pointer;"><span class="material-icons">close</span></button>
    </div>
    
    <div style="margin-bottom:30px;">
        <label style="font-size:0.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:10px;">Language</label>
        <select id="langSelect" onchange="changeLanguage()" style="width:100%; background:#000; color:#fff; border:1px solid var(--border-color); padding:12px; border-radius:10px;">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </div>

    <div style="display:flex; flex-direction:column; gap:15px;">
        <button class="clear-btn-ja" onclick="showGuide('file')" style="width:100%;"><span class="material-icons">description</span> <span id="guideFileTitle">Audio Guide</span></button>
        <button class="clear-btn-ja" onclick="showGuide('yt')" style="width:100%;"><span class="material-icons">smart_display</span> <span id="guideYTTitle">YouTube Guide</span></button>
        <button class="logout-btn" onclick="logout()" style="margin-top:20px; padding:12px;">Sign Out</button>
    </div>
</div>

<div id="guideModalFile" class="modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; max-width:500px; background:var(--panel-bg); border-radius:24px; z-index:4000; padding:25px; border:1px solid var(--primary-color); box-shadow:0 0 50px #000;">
    <div class="guide-box-inner" id="guideFileContent" style="color:var(--text-main); font-size:0.9rem; line-height:1.6;"></div>
    <button class="subscribe-btn" id="closeBtn1" onclick="closeModals()" style="margin-top:20px;">GOT IT</button>
</div>
<div id="guideModalYT" class="modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; max-width:500px; background:var(--panel-bg); border-radius:24px; z-index:4000; padding:25px; border:1px solid var(--primary-color); box-shadow:0 0 50px #000;">
    <div class="guide-box-inner" id="guideYTContent" style="color:var(--text-main); font-size:0.9rem; line-height:1.6;"></div>
    <button class="subscribe-btn" id="closeBtn2" onclick="closeModals()" style="margin-top:20px;">GOT IT</button>
</div>

<div class="container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="custom-file-upload" id="fileSelectBtn">
            <span class="material-icons" style="vertical-align:middle; margin-right:8px;">cloud_upload</span> Select Audio File
        </label>
        <input type="file" id="audioFile" accept="audio/*, .mp3, .wav, .m4a, .aac, .mp4, .ogg, .flac, .webma">

        <div class="waveform-label">
            <span id="loadStatus" class="status-neon">READY</span>
            <div style="display:flex; align-items:center; gap:12px; background:var(--glass); padding:4px 12px; border-radius:20px;">
                <span class="material-icons" style="font-size:16px; color:var(--text-dim);">search</span>
                <input type="range" id="zoomSlider" min="0" max="500" value="100" style="width:70px;">
                <button class="reset-btn" id="resetZoomBtn">FIT</button>
            </div>
            <span class="time-display"><span id="currentTime">00:00</span> <span style="color:var(--text-dim); font-size:0.8rem;">/</span> <span id="totalTime">00:00</span></span>
        </div>
     
        <div id="waveform-wrapper">
            <div id="countdown-overlay"></div>
            <div id="waveform"></div>
        </div>

        <div class="panel" style="margin-top:-5px; padding: 12px 18px;">
            <div class="row">
                <span class="material-icons" style="font-size:20px; color:var(--text-dim);">volume_up</span>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
                <span id="mainVolTxt" class="val-display" style="color:var(--text-main);">80%</span>
            </div>
        </div>

        <div style="display:flex; justify-content:center; gap:12px; margin-bottom:15px;">
            <button class="clear-btn-ja" onclick="wsRegions.clearRegions()" id="clearRangeBtn"><span class="material-icons" style="font-size:18px;">layers_clear</span> CLEAR</button>
            <button class="clear-btn-ja" onclick="saveLoop('file')" id="saveLoopBtn" style="border: 1px solid var(--primary-color); color:var(--primary-color);"><span class="material-icons" style="font-size:18px;">bookmark_add</span> SAVE LOOP</button>
        </div>
        <div id="loopListFile" class="loop-list-container"></div>
        
        <div class="transport-controls">
            <button class="btn-ctrl active" id="countToggleBtn" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon" style="font-size:40px;">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="btn-ctrl" id="speedUpToggleBtn" onclick="toggleFeature('speedup')"><span class="material-icons">speed</span></button>
        </div>

        <div class="panel panel-rec">
            <div class="row">
                <div style="display:flex; align-items:center; gap:8px;">
                    <div style="width:8px; height:8px; background:var(--recording-red); border-radius:50%;"></div>
                    <span style="font-size:0.7rem; color:var(--recording-red); font-weight:900; letter-spacing:1px;">RECORDING CHECK</span>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <button id="soloBtn" class="solo-btn" onclick="toggleSolo()">S</button>
                    <button class="btn-ctrl rec-btn" id="recBtn" onclick="toggleRecording()"><span class="material-icons" id="recIcon" style="font-size:22px;">mic</span></button>
                </div>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
       
            <div id="recVolControl" style="display:none; flex-direction:column; gap:10px; margin-top:10px;">
                <div class="row">
                    <span class="material-icons" style="font-size:20px; color:var(--recording-red);">hearing</span>
                    <input type="range" id="recVolume" min="0" max="1.5" step="0.05" value="1.0">
                    <span id="recVolTxt" class="val-display" style="color:var(--recording-red);">100%</span>
                </div>
            </div>
            <div class="row" id="recControls" style="display:none; justify-content:center; gap:12px; margin-top:10px;">
                <button class="clear-btn-ja" onclick="playRecording()" id="playRecBtn" style="flex:1; justify-content:center; background:rgba(255,255,255,0.05);"><span class="material-icons">play_circle</span> 録音再生</button>
                <button class="clear-btn-ja" onclick="deleteRecording()" style="flex:1; justify-content:center; color:var(--recording-red); border-color:rgba(255,62,62,0.2);"><span class="material-icons">delete</span> 削除</button>
            </div>
        </div>

        <div class="panel">
            <div class="row">
                <div style="min-width:70px; font-weight:800; color:var(--text-dim); font-size:0.75rem;">BPM <button class="reset-btn" onclick="resetSetting('speed', 1.0)" style="margin-left:5px;">R</button></div>
                <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0">
                <span id="spTxt" class="val-display">BPM ---</span>
            </div>
            <div class="row">
                <div style="min-width:70px; font-weight:800; color:var(--text-dim); font-size:0.75rem;">PITCH <button class="reset-btn" onclick="resetSetting('pitch', 0)" style="margin-left:5px;">R</button></div>
                <input type="range" id="pitch" min="-6" max="6" step="1" value="0">
                <span id="pitchTxt" class="val-display">±0</span>
            </div>
        </div>
    </div>

    <div id="yt-section" class="content-section" style="display:none;">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="text" id="ytUrl" placeholder="Paste YouTube URL here..." style="flex-grow:1;">
            <button class="subscribe-btn" style="flex:0; min-width:80px; margin-top:0; border-radius:12px;" onclick="loadYouTube()">LOAD</button>
        </div>
        <div id="ytHistoryContainer" style="margin-bottom: 20px; display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:0.75rem; color:var(--accent-color); font-weight:900; letter-spacing:1px;">HISTORY</span>
                <button class="reset-btn" onclick="clearYTHistory()">Clear</button>
            </div>
            <div id="ytHistoryList" style="display:flex; gap:12px; overflow-x:auto; padding-bottom:10px;" onclick="handleHistoryClick(event)"></div>
        </div>
        <div id="ytPlayerContainer" style="box-shadow: 0 10px 30px #000;"><div id="player"></div></div>
        
        <div class="panel" style="margin-top:20px;">
            <div class="row" style="justify-content: center; flex-wrap: wrap; gap: 15px;">
                <button class="clear-btn-ja" id="setStartBtn" onclick="setLoopPoint('start')" style="min-width:120px; justify-content:center;">SET START</button>
                <div style="background:#000; padding:8px 15px; border-radius:12px; border:1px solid var(--border-color); display:flex; align-items:center; gap:12px;">
