<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.2</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <link rel="icon" href="icon.png?v=1.2.2" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.2">

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=1.2.2">

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDI4ReBg15LAaQbd-4slccBHOS9R69sLNU",
        authDomain: "ams-player-e04bf.firebaseapp.com",
        projectId: "ams-player-e04bf",
        storageBucket: "ams-player-e04bf.firebasestorage.app",
        messagingSenderId: "102274983236",
        appId: "1:102274983236:web:f4334348391dde42dd6311",
        measurementId: "G-GYHLQKN6SS"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth();
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();

      async function checkUserStatus(user) {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        const statusEl = document.getElementById('authStatus');

        if (userSnap.exists()) {
          const data = userSnap.data();
          if (data.isPremium === true) {
            statusEl.innerHTML += ' <span class="premium-badge">PREMIUM</span>';
          }
        } else {
          await setDoc(userRef, {
            displayName: user.displayName,
            email: user.email,
            isPremium: false,
            createdAt: new Date()
          });
        }
      }

      window.login = () => signInWithPopup(auth, provider).catch(err => console.error("Login Error:", err));
      window.logout = () => signOut(auth).catch(err => console.error("Logout Error:", err));

      // DOMの読み込み完了を待ってから監視を開始
      document.addEventListener('DOMContentLoaded', () => {
          onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('authStatus');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            if (!statusEl || !loginBtn || !logoutBtn) return;

            if (user) {
              statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px; border-radius:50%; margin-right:8px; vertical-align:middle;"><span>${user.displayName}</span>`;
              loginBtn.style.display = 'none';
              logoutBtn.style.display = 'flex';
              checkUserStatus(user);
            } else {
              statusEl.innerText = "ログインしていません";
              loginBtn.style.display = 'flex';
              logoutBtn.style.display = 'none';
            }
          });
      });
    </script>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="menu-trigger" onclick="toggleMenu(true)">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <span style="font-weight:bold; color:var(--primary-color);">MENU</span>
        <button class="menu-trigger" onclick="toggleMenu(false)">
            <span class="material-icons">close</span>
        </button>
    </div>

    <span class="menu-section-title">Account</span>
    <div id="authStatus" style="padding: 10px 15px; font-size: 0.85rem; color: #fff; min-height: 40px; display: flex; align-items: center;">確認中...</div>
    <div class="menu-item" id="loginBtn" onclick="login()">
        <span class="material-icons">login</span><span>Googleログイン</span>
    </div>
    <div class="menu-item" id="logoutBtn" onclick="logout()" style="display:none;">
        <span class="material-icons">logout</span><span>ログアウト</span>
    </div>

    <hr style="border:0; border-top:1px solid var(--border-color); margin: 10px 0;">

    <span class="menu-section-title" id="langTitle">Language Settings</span>
    <select id="langSelect" class="lang-select" onchange="changeLanguage()">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>
    <span class="menu-section-title" id="helpTitle">Help & Guide</span>
    <div class="menu-item" onclick="showGuide('file')"><span class="material-icons">description</span><span id="guideFileTitle">Audio Fileモード ガイド</span></div>
    <div class="menu-item" onclick="showGuide('yt')"><span class="material-icons">smart_display</span><span id="guideYTTitle">YouTubeモード ガイド</span></div>
</div>

<div class="container">
    <div class="title-area"><h2>AMS Practice Player</h2></div>
    <div class="mode-tabs">
        <button class="tab-btn active" id="tab-file" onclick="switchMode('file')">Audio File Mode</button>
        <button class="tab-btn" id="tab-yt" onclick="switchMode('yt')">YouTube Mode</button>
    </div>

    <div id="file-section" class="content-section active">
        <label for="audioFile" class="custom-file-upload" id="fileSelectBtn">ファイルを選択</label>
        <input type="file" id="audioFile" accept="audio/*, .mp3, .wav, .m4a, .aac, .mp4, .ogg, .flac, .webma">
        <div class="waveform-label">
            <span id="loadStatus">READY</span>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="material-icons" style="font-size:18px;">zoom_in</span>
                <input type="range" id="zoomSlider" min="0" max="500" value="100" style="width:80px;">
                <button class="reset-btn" id="resetZoomBtn">FIT</button>
            </div>
            <span class="time-display"><span id="currentTime">00:00</span> / <span id="totalTime">00:00</span></span>
        </div>
        <div id="waveform-wrapper">
            <div id="countdown-overlay"></div>
            <div id="waveform"></div>
        </div>
        <div class="panel">
            <div class="row">
                <span class="material-icons" style="font-size:18px; color:var(--text-dim);">volume_up</span>
                <input type="range" id="mainVolume" min="0" max="1" step="0.05" value="0.8">
            </div>
        </div>
        <div class="clear-btn-container">
            <button class="clear-btn-ja" onclick="wsRegions.clearRegions()" id="clearRangeBtn">範囲解除</button>
            <button class="clear-btn-ja" onclick="saveLoop('file')" id="saveLoopBtn">ループ保存</button>
        </div>
        <div id="loopListFile" class="loop-list-container"></div>
        <div class="transport-controls">
            <button class="btn-ctrl active" onclick="toggleFeature('count')"><span class="material-icons">timer</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(-5)"><span class="material-icons">replay_5</span></button>
            <button class="btn-ctrl play-main" id="playBtn"><span class="material-icons" id="playIcon">play_arrow</span></button>
            <button class="btn-ctrl" onclick="wavesurfer.skip(5)"><span class="material-icons">forward_5</span></button>
            <button class="btn-ctrl" onclick="toggleFeature('speedup')"><span class="material-icons">speed</span></button>
        </div>
        <div class="panel panel-rec">
            <div class="row">
                <span>SELF-RECORDING CHECK</span>
                <button class="btn-ctrl rec-btn" id="recBtn" onclick="toggleRecording()"><span class="material-icons">mic</span></button>
            </div>
            <div id="rec-waveform-wrapper"><div id="rec-waveform"></div></div>
        </div>
        <div class="panel">
            <div class="row">Speed <input type="range" id="speed" min="0.5" max="1.5" step="0.01" value="1.0"><span id="spTxt">BPM ---</span></div>
            <div class="row">Pitch <input type="range" id="pitch" min="-6" max="6" step="1" value="0"><span id="pitchTxt">±0</span></div>
        </div>
    </div>

    <div id="yt-section" class="content-section">
        <div style="display:flex; gap:8px; margin-bottom:10px;"><input type="text" id="ytUrl" placeholder="YouTube URL..." style="flex-grow:1;"><button onclick="loadYouTube()">LOAD</button></div>
        <div id="ytPlayerContainer"><div id="player"></div></div>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js?v=1.2.2"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=1.2.2').then(reg => {
            reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        if(confirm("新しいバージョンがあります。更新しますか？")) window.location.reload();
                    }
                };
            };
        });
    }
</script>
</body>
</html>
