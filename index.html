<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMS Practice Player v1.2.1 - Studio Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="AMS Player">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <link rel="icon" href="icon.png?v=1.2.1" type="image/png">
    <link rel="apple-touch-icon" href="icon.png?v=1.2.1">

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      // TODO: ご自身のFirebase設定に書き換えてください
      const firebaseConfig = {
        apiKey: "AIzaSyBnRKitQGBX0u8k4COtDTILYxCJuMf7xzE",
        authDomain: "ams-palyer.firebaseapp.com",
        projectId: "ams-palyer",
        storageBucket: "ms-palyer.appspot.com",
        messagingSenderId: "61564824081",
        appId: "1:61564824081:web:xxxxxxxxxxxxxxxxxxxx"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth();
      const provider = new GoogleAuthProvider();

      // グローバル関数として定義（HTMLのonclickから呼ぶため）
      window.login = () => {
        signInWithPopup(auth, provider).catch((error) => console.error(error));
      };
      window.logout = () => {
        signOut(auth);
      };

      // 状態監視
      onAuthStateChanged(auth, (user) => {
        const statusEl = document.getElementById('user-info');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        
        if (user) {
          statusEl.innerHTML = `<img src="${user.photoURL}" style="width:24px;border-radius:50%;vertical-align:middle;margin-right:8px;"> ${user.displayName}`;
          loginBtn.style.display = 'none';
          logoutBtn.style.display = 'flex';
        } else {
          statusEl.innerText = "ログインしていません";
          loginBtn.style.display = 'flex';
          logoutBtn.style.display = 'none';
        }
      });
    </script>
</head>
<body>

<header>
    <div class="header-logo">AMS PLAYER</div>
    <button class="menu-trigger" onclick="toggleMenu(true)">
        <span class="material-icons">menu</span>
    </button>
</header>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="side-menu" id="sideMenu">
    <div class="menu-header">
        <span style="font-weight:bold; color:var(--primary-color);">MENU</span>
        <button class="menu-trigger" onclick="toggleMenu(false)">
            <span class="material-icons">close</span>
        </button>
    </div>
    
    <span class="menu-section-title" id="langTitle">Language Settings</span>
    <select id="langSelect" class="lang-select" onchange="changeLanguage()">
        <option value="ja">日本語</option>
        <option value="en">English</option>
    </select>

    <span class="menu-section-title" id="helpTitle">Help & Guide</span>
    <div class="menu-item" onclick="showGuide('file')"><span class="material-icons">description</span><span id="guideFileTitle">Audio Fileモード ガイド</span></div>
    <div class="menu-item" onclick="showGuide('yt')"><span class="material-icons">smart_display</span><span id="guideYTTitle">YouTubeモード ガイド</span></div>

    <span class="menu-section-title">Account</span>
    <div id="user-info" style="padding: 10px 15px; font-size: 0.85rem; color: #fff;">読み込み中...</div>
    <div class="menu-item" id="login-btn" onclick="login()"><span class="material-icons">login</span><span>Googleログイン</span></div>
    <div class="menu-item" id="logout-btn" onclick="logout()" style="display:none;"><span class="material-icons">logout</span><span>ログアウト</span></div>
</div>

<div id="guideModalFile" class="modal">...（中略）...</div>
<div class="container">...（中略）...</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            console.log('AMS Player: Service Worker Registered');
        });
    }
</script>
</body>
</html>
